  const showBar = true; // 経過・ボリューム・インターバルは常時表示

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "'Noto Sans JP', -apple-system, sans-serif", maxWidth: 520, margin: "0 auto", paddingBottom: restFull && restStartAt != null ? 250 : 90 }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap');
        input:focus, button:focus-visible, select:focus { outline: 2px solid ${C.yellow}; outline-offset: 2px; }
        * { box-sizing: border-box; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
      `}</style>

      {/* ===== インターバル全画面表示 ===== */}
      {restFull && restStartAt != null && (
        <div style={{
          position: "fixed", left: 0, right: 0, bottom: "calc(56px + env(safe-area-inset-bottom))", zIndex: 90,
          maxWidth: 520, margin: "0 auto",
          background: C.surface,
          borderTop: `2px solid ${restElapsed >= 180 ? C.red : restElapsed >= 60 ? C.yellow : C.green}`,
          borderRadius: "18px 18px 0 0", boxShadow: "0 -12px 40px rgba(0,0,0,0.6)",
          padding: "14px 16px calc(14px + env(safe-area-inset-bottom))",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ flexShrink: 0 }}>
              <div style={{ fontSize: 10, color: C.muted, letterSpacing: 1 }}>インターバル</div>
              <div style={{
                fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800,
                fontSize: 56, lineHeight: 1.05,
                color: restElapsed >= 180 ? C.red : restElapsed >= 60 ? C.yellow : C.text,
                fontVariantNumeric: "tabular-nums",
              }}>
                {fmtClock(restElapsed)}
              </div>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", gap: 4, marginBottom: 6 }}>
                {[1, 2, 3].map(m => (
                  <div key={m} style={{
                    flex: 1, height: 5, borderRadius: 999,
                    background: restElapsed >= m * 60 ? (m >= 3 ? C.red : m >= 2 ? C.yellow : C.green) : C.border,
                  }} />
                ))}
              </div>
              <div style={{ fontSize: 11, color: C.muted }}>
                {restElapsed < 60 ? "1分まで" : `${Math.floor(restElapsed / 60)}分経過`}
              </div>
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <button onClick={() => startRest()}
              style={{ ...btn(C.surface2, C.text), flex: 1, padding: "11px 0", fontSize: 13, border: `1px solid ${C.border}` }}>
              リセット
            </button>
            <button onClick={() => setRestFull(false)}
              style={{ ...btn(C.surface2, C.muted), flex: 1, padding: "11px 0", fontSize: 13, border: `1px solid ${C.border}` }}>
              閉じる
            </button>
            <button onClick={() => stopRest()}
              style={{ ...btn(C.red), flex: 1, padding: "11px 0", fontSize: 13 }}>
              終了
            </button>
          </div>
        </div>
      )}

      {/* ===== 初回ガイド ===== */}
      {loaded && !guideSeen && (() => {
        const steps = [
          {
            art: "hero", title: "OVERLOAD+ へようこそ",
            lead: "前回の内容がそのまま出てくる、筋トレ記録アプリです。",
            body: "同じ分割の前回の記録(重量・回数・セット数)がそのまま並ぶので、入力の手間なく「前回より上」を狙えます。推定1RMや自己ベストは自動で計算されます。",
          },
          {
            art: "split", title: "① 分割を決める",
            lead: "「分割」タブで、あなたのトレーニング分割を作ります。",
            body: "全身・上下・PPL・5分割のプリセットから選ぶか、ゼロから作成。各日にやる種目を登録しておくと、その日のメニューが自動で組まれます。保存するたびに次の日へ自動で進みます。",
          },
          {
            art: "record", title: "② 記録する",
            lead: "「記録」タブで、重量・回数・「あと何回できた?(RIR)」を入力。",
            body: "「あと何回できた?」を入力したセットが実施済みとして記録されます。セット番号のタップでウォームアップ(W)や補助あり(補)に切り替え、連続する種目はスーパーセットにまとめられます。休憩は入力後に自動でタイマーが動き、1分ごとに通知音が鳴ります。",
          },
          {
            art: "progress", title: "③ 伸びを確認する",
            lead: "Max 1RMと今日の1RMがその場で比較できます。",
            body: "セットごとに推定1RMが表示され、自己ベストを超えると更新バッジが出ます。何日ベストを更新していないかも分かるので、停滞にすぐ気付けます。\n\n⚠️ データは端末内だけに保存されます。設定タブから定期的にバックアップを書き出してください。",
          },
        ];
        const step = steps[guideStep];
        const last = guideStep === steps.length - 1;
        const finish = () => { persist({ guideSeen: true }); setGuideStep(0); setView("split"); };
        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(10,11,12,0.96)", display: "flex", flexDirection: "column", padding: "calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))", overflowY: "auto" }}>
            <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", maxWidth: 460, width: "100%", margin: "0 auto" }}>
              <div style={{ display: "flex", justifyContent: "center", marginBottom: 24 }}>
                <div style={{
                  width: 168, height: 168, borderRadius: 28, background: C.surface,
                  border: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center",
                  boxShadow: "0 12px 40px rgba(0,0,0,0.45)",
                }}>
                  <GuideArt kind={step.art} />
                </div>
              </div>
              <h2 style={{ fontSize: 24, fontWeight: 900, textAlign: "center", margin: "0 0 14px", lineHeight: 1.35 }}>{step.title}</h2>
              <p style={{ fontSize: 16, color: C.text, textAlign: "center", lineHeight: 1.7, margin: "0 0 14px", fontWeight: 700 }}>{step.lead}</p>
              <p style={{ fontSize: 14, color: C.muted, lineHeight: 1.9, margin: 0, whiteSpace: "pre-wrap" }}>{step.body}</p>
            </div>
            <div style={{ maxWidth: 460, width: "100%", margin: "0 auto" }}>
              <div style={{ display: "flex", justifyContent: "center", gap: 8, margin: "24px 0" }}>
                {steps.map((_, i) => (
                  <div key={i} style={{ width: i === guideStep ? 22 : 8, height: 8, borderRadius: 999, background: i === guideStep ? C.red : C.border, transition: "width .2s" }} />
                ))}
              </div>
              <button onClick={() => last ? finish() : setGuideStep(guideStep + 1)} style={{ ...btn(C.red), width: "100%", padding: 16, fontSize: 16 }}>
                {last ? "はじめる" : "次へ"}
              </button>
              <button onClick={finish} style={{ ...btn("transparent", C.muted), width: "100%", padding: 12, fontSize: 13, marginTop: 6 }}>
                {last ? "" : "スキップ"}
              </button>
            </div>
          </div>
        );
      })()}

      {/* ===== 固定バー(タイマー+ボリューム) ===== */}
      {showBar && (
        <div style={{
          position: "sticky", top: 0, zIndex: 20, background: C.surface2, borderBottom: `1px solid ${C.border}`,
          padding: "10px 10px 12px", paddingTop: "calc(10px + env(safe-area-inset-top))",
        }}>
          <div style={{ display: "flex", alignItems: "stretch", gap: 6, maxWidth: 520, margin: "0 auto" }}>
            <div style={{ textAlign: "center", flexShrink: 0, minWidth: 62 }}>
              <div style={{ fontSize: 10, color: C.muted, marginBottom: 3 }}>経過</div>
              <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 30, lineHeight: 1 }}>{fmtClock(elapsed)}</div>
            </div>

            <div style={{ flex: 1, minWidth: 0, textAlign: "center", borderLeft: `1px solid ${C.border}`, borderRight: `1px solid ${C.border}`, padding: "0 6px" }}>
              <div style={{ fontSize: 10, color: C.muted, marginBottom: 3, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                ボリューム{compareBase && liveVolume > 0 ? ` (vs ${compareBase.avgLabel})` : ""}
              </div>
              <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 30, lineHeight: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                {Math.round(liveVolume).toLocaleString()}<span style={{ fontSize: 13, color: C.muted, marginLeft: 1 }}>kg</span>
              </div>
              {compareBase && compareBase.avg > 0 && liveVolume > 0 && (() => {
                const pct = (liveVolume / compareBase.avg) * 100;
                const diff = liveVolume - compareBase.avg;
                return (
                  <div style={{ fontSize: 11, marginTop: 2, fontWeight: 700, color: pct >= 100 ? C.green : pct >= 90 ? C.yellow : C.red }}>
                    {pct.toFixed(0)}%
                    <span style={{ color: C.muted, fontWeight: 400, marginLeft: 4 }}>
                      平均{Math.round(compareBase.avg).toLocaleString()}
                    </span>
                  </div>
                );
              })()}
            </div>

            {restStartAt != null ? (
              <div onClick={() => setRestFull(true)} style={{ textAlign: "center", cursor: "pointer", flexShrink: 0, minWidth: 74 }}>
                <div style={{ fontSize: 10, color: C.yellow, marginBottom: 3 }}>インターバル</div>
                <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 30, lineHeight: 1, color: C.yellow }}>
                  {fmtClock(restElapsed)}
                </div>
                <div style={{ fontSize: 9, color: C.muted, marginTop: 2 }}>タップで拡大</div>
              </div>
            ) : (
              <button onClick={startRest} style={{
                ...btn(C.surface, C.text), padding: "0 12px", fontSize: 12, lineHeight: 1.35,
                flexShrink: 0, whiteSpace: "nowrap", border: `1px solid ${C.border}`,
              }}>
                インターバル<br />開始
              </button>
            )}
          </div>
        </div>
      )}

      <header style={{ padding: "16px 16px 12px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 32, letterSpacing: 1, lineHeight: 1 }}>
            OVERLOAD<span style={{ color: C.red }}>+</span>
            <span style={{ fontFamily: "'Noto Sans JP', sans-serif", fontSize: 11, fontWeight: 700, color: C.green, marginLeft: 8, verticalAlign: "middle" }}>v54</span>
          </div>
        </div>
        {AI_ENABLED && (
          <button onClick={askCoach} style={{ ...btn(C.blue), padding: "8px 12px", fontSize: 13 }}>AIコーチ</button>
        )}
      </header>

      {error && <div style={{ margin: "0 16px 12px", padding: 12, borderRadius: 10, background: "#3A2224", color: "#F5B8B3", fontSize: 13 }}>{error}</div>}

      {/* 入力途中の記録を復元した通知 */}
      {draftRestored && today.length > 0 && (
        <div style={{ margin: "0 16px 12px", padding: 12, borderRadius: 10, background: "#1E3226", border: `1px solid ${C.green}`, display: "flex", gap: 10, alignItems: "flex-start" }}>
          <span style={{ fontSize: 15, flexShrink: 0 }}>💾</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, color: "#A8E6BC", lineHeight: 1.6, marginBottom: 8 }}>
              入力途中の記録を復元しました。続きから記録できます。
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setDraftRestored(false)} style={{ ...btn(C.green, "#fff"), padding: "6px 14px", fontSize: 12 }}>OK</button>
              <button onClick={async () => {
                if (!window.confirm("復元した記録を破棄して、最初からやり直しますか?")) return;
                setToday([]); setStartAt(null); setElapsed(0); stopRest(); setDraftRestored(false);
                try { await store.del(DRAFT_KEY); localStorage.removeItem(DRAFT_KEY); } catch { /* noop */ }
              }} style={{ ...btn("transparent", C.muted), padding: "6px 10px", fontSize: 12 }}>破棄する</button>
            </div>
          </div>
        </div>
      )}

      {/* バックアップ推奨バナー */}
      {backupNag && (
        <div style={{
          margin: "0 16px 12px", padding: 12, borderRadius: 10,
          background: "#3A3222", border: `1px solid ${C.yellow}`, display: "flex", gap: 10, alignItems: "flex-start",
        }}>
          <span style={{ fontSize: 16, flexShrink: 0, lineHeight: 1.3 }}>💾</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6, marginBottom: 8 }}>
              {backupNag.text}<br />
              <span style={{ color: C.muted, fontSize: 12 }}>
                記録は端末内にのみ保存されています。念のためファイルに書き出しておきましょう。
              </span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { setView("settings"); }} style={{ ...btn(C.yellow, "#141517"), padding: "7px 14px", fontSize: 13 }}>
                今すぐバックアップ
              </button>
              <button onClick={() => setHideBackupNag(true)} style={{ ...btn("transparent", C.muted), padding: "7px 10px", fontSize: 13 }}>
                あとで
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ===== 記録タブ ===== */}
      {view === "log" && (
        <div style={{ padding: "0 16px" }}>
          {todayDay && (
            <div style={{ background: C.surface, border: `1px solid ${C.blue}`, borderRadius: 14, padding: 14, marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontSize: 11, color: C.blue, fontWeight: 800 }}>今日のセッション(Day {split.cursor % split.days.length + 1}/{split.days.length}・{split.name})</div>
                {AI_ENABLED && <button onClick={startCoach} style={{ ...btn(C.surface2, C.muted), padding: "4px 10px", fontSize: 11 }}>開始コメント</button>}
              </div>
              <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 26, fontWeight: 800, margin: "4px 0 8px" }}>{todayDay.name}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {todayDay.muscles.map(m => { const d = lastTrained(m); return (
                  <span key={m} style={{ ...chip(false), cursor: "default", background: C.bg }}>{m}{d != null && <span style={{ color: C.yellow }}> ・{d === 0 ? "今日" : `${d}日前`}</span>}</span>
                ); })}
              </div>
            </div>
          )}

          {/* 今日の自動メニュー(分割があるとき、記録開始前に表示) */}
          {todayDay && today.length === 0 && autoMenu.length > 0 && (
            <div style={{ background: C.surface, borderRadius: 14, padding: 14, marginBottom: 14, border: `1px solid ${C.border}` }}>
              <div style={{ fontSize: 13, fontWeight: 900, marginBottom: 2 }}>今日のメニュー</div>
              <div style={{ fontSize: 11, color: C.muted, marginBottom: 10, lineHeight: 1.6 }}>
                {todayDay.exercises && todayDay.exercises.length ? "マイ分割に登録した種目" : "前回のセッション"}の記録をそのまま引き継いでいます。開始後に調整できます。
              </div>
              {autoMenu.map((it, i) => {
                const p = it.prescription;
                return (
                  <div key={i} style={{ marginBottom: 10, paddingBottom: 8, borderBottom: i < autoMenu.length - 1 ? `1px solid ${C.border}` : "none" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, marginBottom: 3 }}>
                      <span style={{ fontSize: 13, minWidth: 0, lineHeight: 1.4 }}>
                        {p.name}<span style={{ color: C.muted, fontSize: 11, marginLeft: 6 }}>{p.muscle}</span>
                      </span>
                      <span style={{ flexShrink: 0 }}><JudgeBadge type={it.type} /></span>
                    </div>
                    {p.prevSets ? (
                      <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.7 }}>
                        {p.prevSets.map((s, si) => (
                          <span key={si}>
                            {si > 0 && " / "}
                            {s.warmup ? "W:" : ""}{s.assisted ? "補:" : ""}
                            <span style={{ color: s.warmup ? C.muted : C.text, fontWeight: s.warmup ? 400 : 700 }}>
                              {s.weight}{p.isDb ? "(片手)" : ""}×{s.reps}
                            </span>
                          </span>
                        ))}
                        <span style={{ color: C.muted, marginLeft: 6 }}>({p.sets}セット)</span>
                      </div>
                    ) : (
                      <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 18, fontWeight: 600 }}>
                        {p.weight}<span style={{ fontSize: 11, color: C.muted }}>{p.bwFactor > 0 ? "kg加重" : p.isDb ? "kg片手" : "kg"}</span>
                        {" × "}<span style={{ fontSize: 15 }}>{repsLabel(p.targetReps)}</span>
                      </div>
                    )}
                  </div>
                );
              })}
              <button onClick={startAutoMenu} style={{ ...btn(C.red), width: "100%", padding: 14, fontSize: 15, marginTop: 6 }}>この内容で記録を開始</button>
            </div>
          )}

          <h2 style={{ fontSize: 16, fontWeight: 900, margin: "8px 0 12px" }}>今日の記録</h2>

          {today.length === 0 && (
            <div style={{ border: `1px dashed ${C.border}`, borderRadius: 14, padding: 20, color: C.muted, fontSize: 14, textAlign: "center", marginBottom: 16 }}>
              {todayDay && autoMenu.length > 0 ? "上の「今日のメニュー」から開始するか、下の一覧で種目を追加できます。" : "下の一覧から種目を追加して開始しましょう。"}
              {!split && <><br />「分割」タブでマイ分割法を作ると、今日のメニューが自動で提案されます。</>}
            </div>
          )}

          {today.map((ex, exIdx) => {
            const prevEx = today[exIdx - 1];
            const nextEx = today[exIdx + 1];
            const inGroup = !!ex.ssGroup;
            const groupStart = inGroup && (!prevEx || prevEx.ssGroup !== ex.ssGroup);
            const groupEnd = inGroup && (!nextEx || nextEx.ssGroup !== ex.ssGroup);
            const isLast = exIdx === today.length - 1;
            // グループ内の順番(A/B/C…)
            let ssLetter = "";
            if (inGroup) {
              let n = 0;
              for (let k = exIdx; k >= 0 && today[k].ssGroup === ex.ssGroup; k--) n++;
              ssLetter = String.fromCharCode(64 + n); // 1→A
            }
            return (
            <React.Fragment key={ex.id}>
            <div style={{
              background: C.surface, padding: 14,
              border: `1px solid ${inGroup ? C.blue : C.border}`,
              borderTopWidth: inGroup && !groupStart ? 0 : 1,
              borderRadius: inGroup ? (groupStart ? "14px 14px 0 0" : groupEnd ? "0 0 14px 14px" : 0) : 14,
              marginBottom: inGroup && !groupEnd ? 0 : (isLast ? 12 : 0),
            }}>
              {groupStart && (
                <div style={{ display: "inline-block", background: C.blue, color: "#fff", fontSize: 10, fontWeight: 800, borderRadius: 6, padding: "2px 8px", marginBottom: 8 }}>
                  スーパーセット
                </div>
              )}
              <div style={{ marginBottom: 8 }}>
                <div style={{ fontSize: 14, fontWeight: 700, lineHeight: 1.4, marginBottom: 6 }}>
                  {inGroup && <span style={{ color: C.blue, fontWeight: 800, marginRight: 6 }}>{ssLetter}.</span>}
                  {ex.name}
                  {ex.muscle && <span style={{ color: C.muted, fontSize: 11, fontWeight: 400, marginLeft: 6 }}>{ex.muscle}</span>}
                  {resolveIsDb(ex.name, ex.isDb) && <span style={{ color: C.muted, fontSize: 11, marginLeft: 4 }}>片手</span>}
                  {resolveRom(ex.name, ex.rom) < 1 && <span style={{ color: C.blue, fontSize: 10, marginLeft: 4 }}>ROM×{resolveRom(ex.name, ex.rom)}</span>}
                  {todayDay && ex.muscle && !muscleMatchesDay(ex.muscle, todayDay) && <span style={{ color: C.yellow, fontSize: 11, marginLeft: 6 }}>今日の部位外</span>}
                </div>
                {exIdx > 0 && (
                  <button onClick={() => toggleSuperset(ex.id)} style={{
                    ...btn(inGroup && prevEx && prevEx.ssGroup === ex.ssGroup ? C.blue : C.surface2, inGroup && prevEx && prevEx.ssGroup === ex.ssGroup ? "#fff" : C.muted),
                    padding: "4px 10px", fontSize: 11, marginBottom: 8,
                  }}>
                    {inGroup && prevEx && prevEx.ssGroup === ex.ssGroup ? "⛓ 上の種目とスーパーセット中(解除)" : "⛓ 上の種目とスーパーセットにする"}
                  </button>
                )}
                <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                  <button onClick={() => moveExercise(ex.id, -1)} disabled={exIdx === 0} aria-label="上へ移動"
                    style={{ ...btn(C.surface2, exIdx === 0 ? C.border : C.muted), padding: "4px 8px", fontSize: 12, cursor: exIdx === 0 ? "default" : "pointer" }}>▲</button>
                  <button onClick={() => moveExercise(ex.id, 1)} disabled={exIdx === today.length - 1} aria-label="下へ移動"
                    style={{ ...btn(C.surface2, exIdx === today.length - 1 ? C.border : C.muted), padding: "4px 8px", fontSize: 12, cursor: exIdx === today.length - 1 ? "default" : "pointer" }}>▼</button>
                  {AI_ENABLED && <button onClick={() => howToDo(ex.name)} style={{ ...btn(C.surface2, C.blue), padding: "4px 8px", fontSize: 12 }}>やり方</button>}
                  <button onClick={() => openYouTube(ex.name)} aria-label="YouTubeでフォームを検索" style={{ ...btn(C.surface2, C.red), padding: "4px 8px", fontSize: 11, fontWeight: 700 }}>YouTube</button>
                  <button onClick={() => { setSwapEx(swapEx === ex.id ? null : ex.id); setSwapSearch(""); setSwapMuscle(""); }}
                    style={{ ...btn(C.surface2, swapEx === ex.id ? C.blue : C.muted), padding: "4px 9px", fontSize: 12 }}>変更</button>
                  <button onClick={() => setOpenHist({ ...openHist, [ex.id]: !openHist[ex.id] })}
                    style={{ ...btn(C.surface2, openHist[ex.id] ? C.blue : C.muted), padding: "4px 9px", fontSize: 12 }}>履歴</button>
                  <button onClick={() => setOpenCfg({ ...openCfg, [ex.id]: !openCfg[ex.id] })} style={{ ...btn(C.surface2, C.muted), padding: "4px 9px", fontSize: 12 }}>⚙</button>
                  <div style={{ flex: 1 }} />
                  <button onClick={() => removeExercise(ex.id)} aria-label="種目を削除" style={{ ...btn("transparent", C.muted), padding: "4px 6px", fontSize: 12 }}>✕ 削除</button>
                </div>
              </div>

              {/* 種目の差し替え(セット内容はそのまま) */}
              {swapEx === ex.id && (
                <div style={{ background: C.bg, borderRadius: 10, padding: 10, marginBottom: 10, border: `1px solid ${C.blue}` }}>
                  <div style={{ fontSize: 11, color: C.muted, marginBottom: 8 }}>
                    別の種目に差し替えます(入力済みのセット内容はそのまま引き継がれます)。
                  </div>
                  <input value={swapSearch} onChange={e => setSwapSearch(e.target.value)} placeholder="種目を検索"
                    style={{ width: "100%", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "8px 10px", fontSize: 13, fontFamily: "inherit", marginBottom: 8 }} />
                  {/* 部位フィルター(他の部位にも変更できる) */}
                  <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8, marginBottom: 4 }}>
                    <button onClick={() => setSwapMuscle("")} style={{ ...chip(swapMuscle === ""), flexShrink: 0 }}>すべて</button>
                    {MUSCLES.map(m => (
                      <button key={m} onClick={() => setSwapMuscle(m)} style={{ ...chip(swapMuscle === m), flexShrink: 0 }}>{m}</button>
                    ))}
                  </div>
                  <div style={{ maxHeight: 180, overflowY: "auto" }}>
                    {allExercises
                      .filter(e => {
                        const q = swapSearch.trim();
                        if (e.n === ex.name) return false;
                        if (q) return e.n.includes(q) || e.m.includes(q) || e.eq.includes(q);
                        if (swapMuscle) return e.m === swapMuscle;
                        return true; // 既定はすべての部位から選べる
                      })
                      .slice(0, 60)
                      .map(e => (
                        <button key={e.n} onClick={() => swapExercise(ex.id, e.n)}
                          style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, width: "100%", textAlign: "left", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 10px", marginBottom: 5, cursor: "pointer", color: C.text, fontSize: 13, fontFamily: "inherit" }}>
                          <span style={{ minWidth: 0 }}>{e.n}</span>
                          <span style={{ color: C.muted, fontSize: 11, flexShrink: 0 }}>{e.m}・{e.eq}</span>
                        </button>
                      ))}
                  </div>
                  <button onClick={() => { setSwapEx(null); setSwapSearch(""); }} style={{ ...btn("transparent", C.muted), width: "100%", fontSize: 12, padding: 6, marginTop: 2 }}>キャンセル</button>
                </div>
              )}

              {/* 判断材料: 前回の内容と重量の推移 */}
              {(() => {
                const ins = exerciseInsight(ex.name);
                if (!ins) return null;
                const unit = ins.isDb ? "kg(片手)" : "kg";
                return (
                  <div style={{ background: C.bg, borderRadius: 10, padding: "8px 10px", marginBottom: 10 }}>
                    <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 10, color: C.muted, flexShrink: 0 }}>前回 {fmtDate(ins.date)}</span>
                      <span style={{ fontSize: 13, color: C.text, fontWeight: 700 }}>
                        {ins.topWeight}{unit} × {ins.topReps}回
                      </span>
                      {ins.topRir != null && (
                        <span style={{
                          fontSize: 11, fontWeight: 800, borderRadius: 999, padding: "1px 9px",
                          background: ins.topRir >= 2 ? C.green : ins.topRir === 1 ? C.yellow : C.surface2,
                          color: ins.topRir >= 1 ? "#141517" : C.muted,
                        }}>
                          余力 {ins.topRir}
                        </span>
                      )}
                    </div>

                    <div style={{ fontSize: 11, color: C.muted, marginTop: 4, lineHeight: 1.6 }}>
                      {ins.sets.map((s, si) => (
                        <span key={si}>
                          {si > 0 && " / "}
                          {s.warmup ? "W:" : ""}{s.assisted ? "補:" : ""}{s.weight}×{s.reps}{s.rir != null ? `(残${s.rir})` : ""}
                        </span>
                      ))}
                    </div>

                    <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 6, flexWrap: "wrap" }}>
                      {ins.streak >= 2 && (
                        <span style={{ fontSize: 11, color: ins.streak >= 4 ? C.yellow : C.muted }}>
                          {ins.topWeight}{unit} で <strong>{ins.streak}回連続</strong>
                        </span>
                      )}
                      {ins.trend.length >= 2 && (
                        <span style={{ fontSize: 11, color: C.muted }}>
                          推移 {ins.trend.join(" → ")}
                        </span>
                      )}
                    </div>
                  </div>
                );
              })()}

              {/* 過去の自分 vs 今日の自分 */}
              {(() => {
                const pr = prMap[ex.name];
                const live1RM = liveBest1RM(ex);            // 今日の推定1RM
                const liveW = liveMaxWeight(ex);            // 今日の最大重量(実挙上)
                const bestW = pr?.bestWeight || 0;          // 自己ベスト = 実際に挙げた最大重量
                const best1RM = pr?.best1RM || 0;           // 推定1RMのベスト
                const isPRw = liveW > 0 && liveW > bestW + 0.01;
                const isPR1RM = live1RM > 0 && live1RM > best1RM + 0.01;
                const hasHistory = !!pr && (pr.best1RM > 0 || pr.bestWeight > 0);
                if (!hasHistory && live1RM === 0) return null; // 初めての種目で未実施なら表示しない
                const diff = live1RM > 0 && best1RM > 0 ? live1RM - best1RM : null;
                const pct = diff != null && best1RM > 0 ? (live1RM / best1RM) * 100 : null;
                const daysSincePR = pr?.date ? Math.floor((Date.now() - new Date(pr.date).getTime()) / 86400000) : null;
                const unit = ex.bwFactor > 0 ? "kg(体重込)" : resolveIsDb(ex.name, ex.isDb) ? "kg(両手計)" : "kg";
                return (
                  <div style={{ background: C.bg, borderRadius: 10, padding: "10px 12px", marginBottom: 10 }}>
                    {/* 対比 */}
                    <div style={{ display: "flex", alignItems: "stretch", gap: 8 }}>
                      <div style={{ flex: 1, textAlign: "center" }}>
                        <div style={{ fontSize: 9, color: C.muted, marginBottom: 2 }}>
                          過去の自分{pr?.date ? `(${fmtDate(pr.date)})` : ""}
                        </div>
                        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 24, fontWeight: 800, color: C.yellow, lineHeight: 1 }}>
                          {best1RM > 0 ? best1RM.toFixed(1) : "—"}<span style={{ fontSize: 10, color: C.muted }}>kg</span>
                        </div>
                        <div style={{ fontSize: 9, color: C.muted, marginTop: 2 }}>{pr?.weight > 0 ? `${pr.weight}kg×${pr.reps}回` : "Max 1RM"}</div>
                      </div>

                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flexShrink: 0, minWidth: 46 }}>
                        <div style={{ fontSize: 9, color: C.muted }}>VS</div>
                        {diff != null && (
                          <div style={{ fontSize: 12, fontWeight: 800, color: diff >= 0 ? C.green : C.red, whiteSpace: "nowrap" }}>
                            {diff >= 0 ? "+" : ""}{diff.toFixed(1)}
                          </div>
                        )}
                        {pct != null && (
                          <div style={{ fontSize: 9, color: C.muted }}>{pct.toFixed(0)}%</div>
                        )}
                      </div>

                      <div style={{ flex: 1, textAlign: "center" }}>
                        <div style={{ fontSize: 9, color: isPR1RM ? C.green : C.muted, marginBottom: 2, fontWeight: isPR1RM ? 800 : 400 }}>今日の自分</div>
                        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 24, fontWeight: 800, color: isPR1RM ? C.green : C.text, lineHeight: 1 }}>
                          {live1RM > 0 ? live1RM.toFixed(1) : "—"}<span style={{ fontSize: 10, color: C.muted }}>kg</span>
                        </div>
                        <div style={{ fontSize: 9, color: C.muted, marginTop: 2 }}>推定1RM</div>
                      </div>
                    </div>

                    {/* 到達度バー */}
                    {pct != null && (
                      <div style={{ marginTop: 8, height: 5, borderRadius: 999, background: C.surface2, overflow: "hidden" }}>
                        <div style={{
                          width: `${Math.min(100, pct)}%`, height: "100%", borderRadius: 999,
                          background: isPR1RM ? C.green : pct >= 95 ? C.yellow : C.blue, transition: "width .3s",
                        }} />
                      </div>
                    )}

                    {/* 過去の自分を超えた! */}
                    {isPR1RM && best1RM > 0 && (
                      <div style={{
                        marginTop: 10, padding: "10px 12px", borderRadius: 10, textAlign: "center",
                        background: "linear-gradient(90deg, rgba(76,175,110,0.22), rgba(232,179,60,0.22))",
                        border: `1px solid ${C.green}`,
                      }}>
                        <div style={{
                          fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 30,
                          letterSpacing: 2, color: C.green, lineHeight: 1,
                        }}>
                          YOU WIN!
                        </div>
                        <div style={{ fontSize: 11, color: C.text, marginTop: 5 }}>
                          過去の自分を <strong style={{ color: C.yellow }}>+{(live1RM - best1RM).toFixed(1)}kg</strong> 更新しました
                        </div>
                      </div>
                    )}

                    {/* 更新バッジ / 未更新日数 */}
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
                      {isPR1RM && best1RM === 0 && (
                        <span style={{ background: C.yellow, color: "#141517", borderRadius: 999, padding: "3px 11px", fontSize: 11, fontWeight: 800 }}>
                          ⚡ 初回記録 {live1RM.toFixed(1)}kg
                        </span>
                      )}
                      {isPRw && (
                        <span style={{ background: C.green, color: "#fff", borderRadius: 999, padding: "3px 11px", fontSize: 11, fontWeight: 800 }}>
                          🏆 最大重量 {liveW.toFixed(1)}{unit}
                        </span>
                      )}
                      {!isPR1RM && daysSincePR != null && (
                        <span style={{ fontSize: 10, color: daysSincePR >= 60 ? C.yellow : C.muted }}>
                          {daysSincePR === 0 ? "本日1RM更新済み" : `1RM ${daysSincePR}日間未更新`}
                        </span>
                      )}
                      {!isPRw && bestW > 0 && (
                        <span style={{ fontSize: 10, color: C.muted }}>最大重量 {bestW.toFixed(1)}{unit}</span>
                      )}
                    </div>
                  </div>
                );
              })()}

              {/* この種目の過去履歴 */}
              {openHist[ex.id] && (() => {
                const hist = exerciseHistory(ex.name, 5);
                return (
                  <div style={{ background: C.bg, borderRadius: 10, padding: 10, marginBottom: 10, border: `1px solid ${C.blue}` }}>
                    <div style={{ fontSize: 11, color: C.muted, marginBottom: 8 }}>
                      {ex.name} の直近{hist.length > 0 ? hist.length : ""}回の記録
                    </div>
                    {hist.length === 0 ? (
                      <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "8px 0" }}>この種目の過去記録はまだありません。</div>
                    ) : hist.map((h, hi) => (
                      <div key={hi} style={{ marginBottom: 8, paddingBottom: 6, borderBottom: hi < hist.length - 1 ? `1px solid ${C.border}` : "none" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, marginBottom: 2 }}>
                          <span style={{ fontSize: 12, fontWeight: 700, color: hi === 0 ? C.text : C.muted }}>
                            {fmtDate(h.date)}{hi === 0 && <span style={{ color: C.blue, fontSize: 10, marginLeft: 6 }}>前回</span>}
                          </span>
                          <span style={{ fontSize: 11, color: C.yellow, flexShrink: 0 }}>{Math.round(h.volume).toLocaleString()}kg</span>
                        </div>
                        <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.6, wordBreak: "break-word" }}>
                          {h.ex.sets.map(s => `${s.warmup ? "W:" : ""}${s.assisted ? "補:" : ""}${s.weight}×${s.reps}${s.rir != null ? `(残${s.rir})` : ""}`).join(" / ")}
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })()}

              {openCfg[ex.id] && (
                <div style={{ background: C.bg, borderRadius: 10, padding: 12, marginBottom: 10 }}>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center", marginBottom: 10 }}>
                    {!ex.muscle && (
                      <label style={{ fontSize: 12, color: C.yellow }}>部位(未設定) <select value={ex.muscle} onChange={e => updEx(ex.id, { muscle: e.target.value })} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "5px 6px", fontSize: 13, fontFamily: "inherit" }}><option value="">未設定</option>{MUSCLES.map(m => <option key={m} value={m}>{m}</option>)}</select></label>
                    )}
                    <label style={{ fontSize: 12, color: C.muted, display: "flex", alignItems: "center", gap: 4 }}><input type="checkbox" checked={ex.bwFactor > 0} onChange={e => updEx(ex.id, { bwFactor: e.target.checked ? 0.7 : 0 })} />自重種目</label>
                  </div>

                  {/* 体重係数(自重種目のみ) */}
                  {ex.bwFactor > 0 && (
                    <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 10, marginBottom: 10 }}>
                      <label style={{ fontSize: 12, color: C.text, display: "flex", alignItems: "center", gap: 6 }}>
                        体重係数
                        <NumInput inputMode="decimal" value={ex.bwFactor} style={cfgInput}
                          onChange={e => updEx(ex.id, { bwFactor: e.target.value })}
                          onBlur={e => { const v = num(e.target.value); updEx(ex.id, { bwFactor: v > 0 ? v : 0 }); }} />
                      </label>
                      <p style={{ fontSize: 10, color: C.muted, margin: "6px 0 0", lineHeight: 1.7 }}>
                        自重のうち何割が負荷になるかの目安です。重量は「体重×係数＋加重」で計算されます。
                        懸垂は体重のほぼ全部を持ち上げるので1.0、ディップスは0.95、腕立ては足で支える分を除いて0.65前後が目安です。
                      </p>
                    </div>
                  )}

                  {/* 可動域係数 */}
                  <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 10 }}>
                    <label style={{ fontSize: 12, color: C.text, display: "flex", alignItems: "center", gap: 6 }}>
                      可動域係数
                      <NumInput inputMode="decimal" value={ex.rom ?? 1} style={cfgInput}
                        onChange={e => updEx(ex.id, { rom: e.target.value })}
                        onBlur={e => { const v = num(e.target.value); updEx(ex.id, { rom: v > 0 ? Math.min(1, Math.max(0.1, v)) : 1 }); }} />
                    </label>
                    <p style={{ fontSize: 10, color: C.muted, margin: "6px 0 0", lineHeight: 1.7 }}>
                      動かす距離が短い種目のボリュームを控えめに数えるための係数です。
                      シュラッグやカーフレイズは重量の割に可動域が数cmしかないため0.5、通常の種目は1.0にしています。
                      集計ボリュームにのみ影響し、推定1RMやPRには影響しません。
                    </p>
                  </div>
                </div>
              )}

              <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 4 }}>
                <span style={{ width: 20 }} />
                <span style={{ flex: 1.3, ...fieldLabel }}>{ex.bwFactor > 0 ? "加重 kg" : resolveIsDb(ex.name, ex.isDb) ? "重量 kg/片手" : "重量 kg"}</span>
                <span style={{ flex: 1, ...fieldLabel }}>回数</span>
                <span style={{ width: 26 }} />
                <span style={{ flex: 2.4, ...fieldLabel }}>あと何回できた?<span style={{ opacity: 0.7 }}>(RIR)</span></span>
                <span style={{ width: 26 }} />
              </div>

              {ex.sets.map((s, i) => {
                const wsIndex = ex.sets.slice(0, i + 1).filter(x => !x.warmup).length; // ワーキング通し番号
                const inc = num(ex.increment) || 2.5;
                const done = s.warmup || (s.rir !== "" && s.rir != null); // 実施済みか
                // このセットの推定1RM(ウォームアップ・補助は対象外)
                const setW = num(s.weight), setR = Math.round(num(s.reps));
                const set1RM = (!s.warmup && !s.assisted && setW > 0 && setR > 0 && s.rir !== "" && s.rir != null)
                  ? est1RM(effWeight(setW, resolveIsDb(ex.name, ex.isDb), ex.bwFactor || 0, profile.bodyweight), setR)
                  : 0;
                const pastBest1RM = prMap[ex.name]?.best1RM || 0;
                // このセットが自己ベストを更新しているか(同一セッション内では最も高い1セットのみに印を付ける)
                const bestIdxInSession = (() => {
                  let bi = -1, bv = 0;
                  ex.sets.forEach((x, xi) => {
                    if (x.warmup || x.assisted) return;
                    if (x.rir === "" || x.rir == null) return; // 未実施は対象外
                    const w = num(x.weight), r = Math.round(num(x.reps));
                    if (w <= 0 || r <= 0) return;
                    const v = est1RM(effWeight(w, resolveIsDb(ex.name, ex.isDb), ex.bwFactor || 0, profile.bodyweight), r);
                    if (v > bv) { bv = v; bi = xi; }
                  });
                  return bi;
                })();
                const isSetPR = set1RM > 0 && set1RM > pastBest1RM + 0.01 && i === bestIdxInSession;
                return (
                <div key={i} style={{ marginBottom: 8, opacity: done ? 1 : 0.55 }}>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <button onClick={() => {
                      // 通常 → ウォームアップ(W) → 補助あり(補) → 通常 の順で切替
                      const next = (!s.warmup && !s.assisted) ? { warmup: true, assisted: false }
                        : s.warmup ? { warmup: false, assisted: true }
                        : { warmup: false, assisted: false };
                      setToday(t => t.map(e => e.id !== ex.id ? e : {
                        ...e, sets: e.sets.map((x, j) => j === i ? { ...x, ...next } : x),
                      }));
                    }}
                      title="タップで ウォームアップ / 補助あり / 通常 を切替"
                      aria-label={`セット${i + 1}の種別を切り替え`}
                      style={{ width: 24, height: 24, borderRadius: 6, flexShrink: 0, cursor: "pointer", fontSize: 11, fontWeight: 800, fontFamily: "inherit",
                        border: `1px solid ${s.warmup ? C.yellow : s.assisted ? C.blue : C.border}`,
                        background: s.warmup ? C.yellow : s.assisted ? C.blue : "transparent",
                        color: s.warmup ? "#141517" : s.assisted ? "#fff" : C.muted }}>
                      {s.warmup ? "W" : s.assisted ? "補" : wsIndex}
                    </button>
                    <NumInput inputMode="decimal" value={s.weight} placeholder="0"
                      onBlur={() => { if ((num(s.weight) > 0 || num(s.reps) > 0) && isLastInGroup(exIdx)) startRest(); }}
                      onChange={e => updateSet(ex.id, i, "weight", e.target.value)} aria-label={`セット${i + 1}の重量`} style={{ ...numInput, flex: 1.3, opacity: s.warmup ? 0.6 : 1 }} />
                    <NumInput inputMode="numeric" value={s.reps} placeholder="0"
                      onBlur={() => { if ((num(s.weight) > 0 || num(s.reps) > 0) && isLastInGroup(exIdx)) startRest(); }}
                      onChange={e => updateSet(ex.id, i, "reps", e.target.value)} aria-label={`セット${i + 1}の回数`} style={{ ...numInput, flex: 1, opacity: s.warmup ? 0.6 : 1 }} />
                    <button onClick={() => copyFromPrev(ex.id, i)} disabled={i === 0}
                      title="前のセットの重量・回数をコピー" aria-label="前のセットをコピー"
                      style={{ width: 26, height: 26, borderRadius: 8, flexShrink: 0, cursor: i === 0 ? "default" : "pointer", fontSize: 12,
                        border: `1px solid ${i === 0 ? C.border : C.blue}`, background: C.surface2, color: i === 0 ? C.border : C.blue }}>⧉</button>
                    <div style={{ flex: 2.4, opacity: s.warmup ? 0.35 : 1, pointerEvents: s.warmup ? "none" : "auto" }}>
                      <RirSelect value={s.rir === "" ? null : num(s.rir)} onChange={v => {
                        updateSet(ex.id, i, "rir", v === "" ? "" : v);
                        if (v !== "" && isLastInGroup(exIdx)) { startRest(); setRestFull(true); }
                      }} />
                    </div>
                    <button onClick={() => removeSet(ex.id, i)} aria-label={`セット${i + 1}を削除`}
                      style={{ width: 26, height: 26, borderRadius: 8, border: `1px solid ${C.border}`, background: C.surface2, color: C.muted, fontSize: 12, cursor: "pointer", flexShrink: 0 }}>✕</button>
                  </div>

                  {/* このセットの推定1RM */}
                  {set1RM > 0 && (
                    <div style={{ display: "flex", alignItems: "center", gap: 8, paddingLeft: 30, marginTop: 3 }}>
                      <span style={{ fontSize: 10, color: isSetPR ? C.green : C.muted }}>
                        推定1RM {set1RM.toFixed(1)}kg
                      </span>
                      {isSetPR && (
                        <span style={{ background: C.yellow, color: "#141517", borderRadius: 999, padding: "1px 8px", fontSize: 10, fontWeight: 800 }}>
                          ⚡ 1RM更新 +{(set1RM - pastBest1RM).toFixed(1)}kg
                        </span>
                      )}
                    </div>
                  )}
                </div>
                );
              })}
              <div style={{ fontSize: 10, color: C.muted, marginBottom: 8, lineHeight: 1.6 }}>
                ※「あと何回できた?」を入力したセットが実施済みとして記録されます(薄いセットは未実施)。
                左の番号をタップすると ウォームアップ(W) → 補助あり(補) → 通常 と切り替わります。
              </div>

              <button onClick={() => { addSet(ex.id); }} style={{ ...btn(C.surface2, C.text), width: "100%", padding: 10, fontSize: 13, marginBottom: 8 }}>＋ セットを追加</button>

              {/* フォーム崩れ / 痛み・違和感 / メモ */}
              <div style={{ display: "flex", gap: 8 }}>
                {[["formBroke", "フォーム崩れ", C.yellow], ["pain", "痛み・違和感", "#FF5A4E"]].map(([k, label, col]) => (
                  <button key={k} onClick={() => updEx(ex.id, { [k]: !ex[k] })} style={{ flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontFamily: "inherit", border: `1px solid ${ex[k] ? col : C.border}`, background: ex[k] ? col : C.bg, color: ex[k] ? "#141517" : C.muted, fontWeight: ex[k] ? 800 : 500 }}>{ex[k] ? "✓ " : ""}{label}</button>
                ))}
                <button onClick={() => setOpenNote({ ...openNote, [ex.id]: !openNote[ex.id] })}
                  aria-label="種目メモ"
                  style={{ flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontFamily: "inherit",
                    border: `1px solid ${exerciseNotes[ex.name] ? C.yellow : C.border}`, background: C.bg,
                    color: exerciseNotes[ex.name] ? C.yellow : C.muted, fontWeight: exerciseNotes[ex.name] ? 800 : 500 }}>
                  📌 メモ{exerciseNotes[ex.name] ? "有" : ""}
                </button>
              </div>

              {/* 固定メモ(展開時に編集、保存済みなら常に内容を表示) */}
              {openNote[ex.id] ? (
                <div style={{ marginTop: 8 }}>

                    style={{ width: "100%", background: C.bg, border: `1px solid ${C.yellow}`, borderRadius: 8, color: C.text, padding: "8px 10px", fontSize: 13, fontFamily: "inherit", resize: "vertical", lineHeight: 1.6 }} />
                </div>
              ) : exerciseNotes[ex.name] ? (
                <div onClick={() => setOpenNote({ ...openNote, [ex.id]: true })}
                  style={{ display: "flex", gap: 6, marginTop: 8, background: C.bg, borderLeft: `3px solid ${C.yellow}`, borderRadius: 6, padding: "8px 10px", fontSize: 12, color: C.text, lineHeight: 1.6, whiteSpace: "pre-wrap", cursor: "pointer" }}>
                  <span style={{ flexShrink: 0 }}>📌</span>
                  <span style={{ minWidth: 0 }}>{exerciseNotes[ex.name]}</span>

            {/* 種目と種目の間に挿入 */}

              <>
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0 6px" }}>
                  <div style={{ flex: 1, height: 1, background: insertAt === exIdx + 1 ? C.red : C.border }} />
                  <button onClick={() => { setInsertAt(insertAt === exIdx + 1 ? null : exIdx + 1); setSearch(""); setPickerMuscle(""); }}
                    style={{
                      padding: "5px 14px", borderRadius: 999, cursor: "pointer",
                      fontSize: 12, fontFamily: "inherit", fontWeight: 700, whiteSpace: "nowrap",
                      border: `1px dashed ${insertAt === exIdx + 1 ? C.red : C.border}`,
                      background: insertAt === exIdx + 1 ? C.red : "transparent",
                      color: insertAt === exIdx + 1 ? "#fff" : C.muted,
                    }}>
                    {insertAt === exIdx + 1 ? "✕ 閉じる" : "＋ ここに追加"}
                  </button>
                  <div style={{ flex: 1, height: 1, background: insertAt === exIdx + 1 ? C.red : C.border }} />
                </div>

                {/* その場で種目を選べるパネル(下までスクロール不要) */}
                {insertAt === exIdx + 1 && (
                  <div style={{ background: C.surface, borderRadius: 14, padding: 12, marginBottom: 12, border: `1px solid ${C.red}` }}>
                    <input value={search} onChange={e => setSearch(e.target.value)} onFocus={selectOnFocus}
                      placeholder="種目を検索(なければカスタム追加)"
                      style={{ width: "100%", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "9px 10px", fontSize: 14, fontFamily: "inherit", marginBottom: 8 }} />
                    <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8 }}>
                      <button onClick={() => setPickerMuscle("")} style={{ ...chip(pickerMuscle === ""), flexShrink: 0 }}>最近使った順</button>
                      {MUSCLES.map(m => (
                        <button key={m} onClick={() => setPickerMuscle(m)} style={{ ...chip(pickerMuscle === m), flexShrink: 0 }}>{m}</button>
                      ))}
                    </div>
                    <div style={{ maxHeight: 210, overflowY: "auto" }}>
                      {search.trim() && !findExercise(search.trim()) ? (
                        <button onClick={() => addExercise(search, { muscle: customDraft.muscle, eq: customDraft.eq, isDb: customDraft.eq === "ダンベル", bwFactor: customDraft.eq === "自重" ? 0.7 : 0 }, exIdx + 1)}
                          style={{ ...btn(C.red), width: "100%", padding: 10, fontSize: 14 }}>
                          「{search.trim()}」をカスタム追加
                        </button>
                      ) : pickerList.slice(0, 60).map(e => (
                        <button key={e.n} onClick={() => addExercise(e.n, undefined, exIdx + 1)}
                          style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, width: "100%", textAlign: "left", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 8, padding: "9px 10px", marginBottom: 5, cursor: "pointer", color: C.text, fontSize: 13, fontFamily: "inherit" }}>
                          <span style={{ minWidth: 0 }}>{e.n}{recentNames.includes(e.n) && <span style={{ color: C.blue, fontSize: 10, marginLeft: 6 }}>最近</span>}</span>
                          <span style={{ color: C.muted, fontSize: 11, flexShrink: 0 }}>{e.m}・{e.eq}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}
            </React.Fragment>
            );
          })}

          {/* 種目選択 */}
          <div style={{ background: C.surface, borderRadius: 14, padding: 14, border: `1px solid ${insertAt != null ? C.red : C.border}` }}>
            {insertAt != null && (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, background: C.bg, borderRadius: 8, padding: "8px 10px", marginBottom: 10 }}>
                <span style={{ fontSize: 12, color: C.red, fontWeight: 700, minWidth: 0 }}>
                  {insertAt}番目の後ろに挿入します
                </span>
                <button onClick={() => setInsertAt(null)} style={{ ...btn("transparent", C.muted), padding: "2px 8px", fontSize: 11, flexShrink: 0 }}>末尾に戻す</button>
              </div>
            )}
            <input value={search} onChange={e => setSearch(e.target.value)} onFocus={selectOnFocus}
              onKeyDown={e => e.key === "Enter" && search.trim() && addExercise(search, findExercise(search.trim()) ? undefined : { muscle: customDraft.muscle, eq: customDraft.eq, isDb: customDraft.eq === "ダンベル", bwFactor: customDraft.eq === "自重" ? 0.7 : 0 })}
              placeholder="種目を検索(なければカスタム追加)"
              style={{ width: "100%", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", color: C.text, fontSize: 14, fontFamily: "inherit", marginBottom: 10 }} />

            {/* カスタム追加時の部位・器具設定 */}
            {search.trim() && !findExercise(search.trim()) && (
              <div style={{ background: C.bg, borderRadius: 10, padding: 10, marginBottom: 10 }}>
                <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>「{search.trim()}」をカスタム種目として追加</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
                  <select value={customDraft.muscle} onChange={e => setCustomDraft({ ...customDraft, muscle: e.target.value })} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "6px 8px", fontSize: 13, fontFamily: "inherit" }}>
                    <option value="">部位を選択</option>{MUSCLES.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                  <select value={customDraft.eq} onChange={e => setCustomDraft({ ...customDraft, eq: e.target.value })} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "6px 8px", fontSize: 13, fontFamily: "inherit" }}>
                    {EQUIPMENT.map(q => <option key={q} value={q}>{q}</option>)}
                  </select>
                </div>
                <button onClick={() => addExercise(search, { muscle: customDraft.muscle, eq: customDraft.eq, isDb: customDraft.eq === "ダンベル", bwFactor: customDraft.eq === "自重" ? 0.7 : 0 })} style={{ ...btn(C.red), width: "100%", padding: 10, fontSize: 14 }}>この設定で追加</button>
              </div>
            )}

            {!search.trim() && (
              <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
                <button onClick={() => setPickerMuscle(null)} style={{ ...chip(!pickerMuscle), flexShrink: 0 }}>{recentNames.length ? "最近使った順" : todayDay ? `今日(${todayDay.name})` : "すべて"}</button>
                {MUSCLES.filter(m => EXERCISE_DB.some(e => e.m === m)).map(m => (
                  <button key={m} onClick={() => setPickerMuscle(pickerMuscle === m ? null : m)} style={{ ...chip(pickerMuscle === m), flexShrink: 0 }}>{m}</button>
                ))}
              </div>

            {!(search.trim() && !findExercise(search.trim())) && (
              <div style={{ maxHeight: 240, overflowY: "auto" }}>
                {pickerList.map(e => (
                  <button key={e.n} onClick={() => addExercise(e.n)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, width: "100%", textAlign: "left", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 6, cursor: "pointer", color: C.text, fontSize: 13, fontFamily: "inherit" }}>
                    <span style={{ minWidth: 0 }}>{e.n}{recentNames.includes(e.n) && <span style={{ color: C.blue, fontSize: 10, marginLeft: 6 }}>最近</span>}</span>

                  </button>

              </div>

          </div>

          {today.length > 0 && (
            <button onClick={saveWorkout} disabled={saving} style={{ ...btn(C.red), width: "100%", marginTop: 16, padding: 16, fontSize: 16 }}>

            </button>
          )}
        </div>
      )}

      {/* ===== 提案タブ ===== */}
      {/* ===== 分割タブ ===== */}
      {view === "split" && (
        <div style={{ padding: "0 16px" }}>

            <>
              {pickingSplit && split && (
                <button onClick={() => setPickingSplit(false)} style={{ ...btn(C.surface2, C.muted), fontSize: 13, padding: "8px 12px", marginBottom: 12 }}>← 今の分割({split.name})に戻る</button>

                  <div style={{ color: C.muted, fontSize: 12, fontWeight: 400 }}>{p.days.map(d => d.name).join(" → ")}</div>
                </button>

            <>
