        exerciseOverrides: p.exerciseOverrides || {},
        lastBackupAt: new Date().toISOString(),
      };
      await persist(next);
      setBackupMsg(`復元しました(記録 ${next.workouts.length}件)。`);
      setError("");
    } catch (e) {
      setBackupMsg("");
      setError(`復元に失敗しました(${e?.message || "ファイルを確認してください"})。`);
    }
  };

  // バックアップ復元の直前の状態に戻す(importBackupが退避したスナップショットから)
  const restoreFromPreImportSnapshot = async () => {
    try {
      const snap = await store.get(PRE_IMPORT_BACKUP_KEY);
      if (!snap?.value) { setHasPreImportSnapshot(false); return; }
      const p = JSON.parse(snap.value);
      const ws = validateBackupPayload(p);
      if (!window.confirm(`バックアップ復元より前の状態(記録 ${ws.length}件)に戻します。\n現在のデータは置き換わります。よろしいですか?`)) return;
      const next = {
        workouts: migrateWorkouts(ws),
        split: migrateSplit(p.split),
        profile: defaultProfile(p.profile),
        recentNames: p.recentNames || [],
        customExercises: p.customExercises || [],
        exerciseNotes: p.exerciseNotes || {},
        exerciseOverrides: p.exerciseOverrides || {},
        lastBackupAt: p.lastBackupAt || null,
      };
      await persist(next);
      await store.del(PRE_IMPORT_BACKUP_KEY);
      setHasPreImportSnapshot(false);
      setBackupMsg(`復元前の状態に戻しました(記録 ${next.workouts.length}件)。`);
      setError("");
    } catch (e) {
      setError(`元に戻す処理に失敗しました(${e?.message || "データを確認してください"})。`);
    }
  };


  // ---- グラフ ----
  const exerciseNames = useMemo(() => { const s = new Set(); workouts.forEach(w => w.exercises.forEach(ex => s.add(ex.name))); return [...s]; }, [workouts]);
  // 種目が増えると種目チップが並びすぎるので、先に部位を選んでから種目を選ぶ。
  // 部位は記録時点の値(ex.muscle)を使う。未設定のものは「未設定」にまとめる。
  const chartExercisesByMuscle = useMemo(() => {
    const m = {};
    workouts.forEach(w => w.exercises.forEach(ex => {
      const key = ex.muscle || "未設定";
      if (!m[key]) m[key] = new Set();
      m[key].add(ex.name);
    }));
    return Object.fromEntries(Object.entries(m).map(([k, v]) => [k, [...v]]));
  }, [workouts]);
  // 部位の並びはMUSCLESの定義順に揃える(記録順だとバラバラになるため)
  const chartMuscles = useMemo(() => {
    const keys = Object.keys(chartExercisesByMuscle);
    return [...MUSCLES.filter(m => keys.includes(m)), ...keys.filter(k => !MUSCLES.includes(k))];
  }, [chartExercisesByMuscle]);
  const chartExerciseChoices = chartExercisesByMuscle[chartMuscle] || [];
  const chartData = useMemo(() => {
    if (!chartExercise) return [];
    return workouts.map(w => {
      const ex = w.exercises.find(e => e.name === chartExercise); if (!ex) return null;
      const ws = workingSets(ex); if (ws.length === 0) return null;
      const d = new Date(w.date);
      const best = ws.reduce((max, s) => Math.max(max, est1RM(setEff(ex, s), s.reps)), 0);
      return {
        date: `${d.getMonth() + 1}/${d.getDate()}`,
        最大重量: wU(Math.max(...ws.map(s => s.weight))),
        推定1RM: Math.round(toU(best) * 10) / 10,
      };
    }).filter(Boolean);
  }, [workouts, chartExercise, profile.bodyweight]);
  const volumeTrend = useMemo(() => workouts.map(w => {
    const d = new Date(w.date);
    return { date: `${d.getMonth() + 1}/${d.getDate()}`, 総ボリューム: Math.round(toU(w.exercises.reduce((a, ex) => a + exVolume(ex), 0))) };
  }), [workouts, profile.bodyweight]);
  // 週単位(月曜始まり)の合計ボリューム推移
  const weeklyVolumeTrend = useMemo(() => {
    const buckets = {};
    workouts.forEach(w => {
      const d = new Date(w.date);
      const dow = (d.getDay() + 6) % 7; // 月曜=0
      const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
      const key = monday.getTime();
      const vol = w.exercises.reduce((a, ex) => a + exVolume(ex), 0);
      if (!buckets[key]) buckets[key] = { key, monday, vol: 0 };
      buckets[key].vol += vol;
    });
    return Object.values(buckets).sort((a, b) => a.key - b.key).map(b => ({
      date: `${b.monday.getMonth() + 1}/${b.monday.getDate()}週`,
      総ボリューム: Math.round(toU(b.vol)),
    }));
  }, [workouts, profile.bodyweight]);
  const trainedMuscles = useMemo(() => {
    const s = new Set(); workouts.forEach(w => w.exercises.forEach(ex => { if (ex.muscle) s.add(ex.muscle); })); return [...s];
  }, [workouts]);
  const muscleVolumeTrend = useMemo(() => {
    if (!volMuscle) return [];
    return workouts.map(w => {
      const exs = w.exercises.filter(ex => ex.muscle === volMuscle);
      if (exs.length === 0) return null;
      const d = new Date(w.date);
      return { date: `${d.getMonth() + 1}/${d.getDate()}`, ボリューム: Math.round(exs.reduce((a, ex) => a + exVolume(ex), 0)) };
    }).filter(Boolean);
  }, [workouts, volMuscle, profile.bodyweight]);
  useEffect(() => { if (!volMuscle && trainedMuscles.length) setVolMuscle(trainedMuscles[0]); }, [trainedMuscles, volMuscle]);
  useEffect(() => { if (!chartMuscle && chartMuscles.length) setChartMuscle(chartMuscles[0]); }, [chartMuscles, chartMuscle]);
  // 部位を切り替えたら、その部位に無い種目が選ばれたままにならないよう先頭に寄せる
  useEffect(() => {
    if (!chartExerciseChoices.length) return;
    if (!chartExerciseChoices.includes(chartExercise)) setChartExercise(chartExerciseChoices[0]);
  }, [chartExerciseChoices, chartExercise]);


  // ---- バックアップ推奨の判定 ----
  // 記録が3件以上あり、①一度もバックアップしていない ②前回から30日以上経過 のいずれかで促す
  const backupNag = useMemo(() => {
    if (hideBackupNag || workouts.length < 3) return null;
    if (!lastBackupAt) return { days: null, text: "まだ一度もバックアップしていません。" };
    const days = Math.floor((Date.now() - new Date(lastBackupAt).getTime()) / 86400000);
    if (days >= 30) return { days, text: `前回のバックアップから${days}日経過しています。` };
    return null;
  }, [lastBackupAt, workouts.length, hideBackupNag]);

  // ================= 画面 =================
  const showBar = true; // 経過・ボリューム・インターバルは常時表示

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, maxWidth: 520, margin: "0 auto", paddingBottom: restFull && restStartAt != null ? 250 : 90 }}>
      <style>{`
        input:focus, button:focus-visible, select:focus { outline: 2px solid ${C.yellow}; outline-offset: 2px; }
        * { box-sizing: border-box; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
      `}</style>

      {/* ===== インターバル全画面表示 ===== */}
      {restFull && restStartAt != null && (
        <div style={{
          position: "fixed", left: 0, right: 0, bottom: "calc(56px + env(safe-area-inset-bottom))", zIndex: 90,
          maxWidth: 520, margin: "0 auto",
          background: C.surface,
          borderTop: `2px solid ${restElapsed >= 180 ? C.red : restElapsed >= 60 ? C.yellow : C.green}`,
          borderRadius: "18px 18px 0 0", boxShadow: "0 -12px 40px rgba(0,0,0,0.6)",
          padding: "14px 16px calc(14px + env(safe-area-inset-bottom))",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ flexShrink: 0 }}>
              <div style={{ fontSize: 11, color: C.muted, letterSpacing: 1 }}>インターバル</div>
              <div style={{
                fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800,
                fontSize: 56, lineHeight: 1.05,
                color: restElapsed >= 180 ? C.red : restElapsed >= 60 ? C.yellow : C.text,
                fontVariantNumeric: "tabular-nums",
              }}>
                {fmtClock(restElapsed)}
              </div>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", gap: 4, marginBottom: 6 }}>
                {[1, 2, 3].map(m => (
                  <div key={m} style={{
                    flex: 1, height: 5, borderRadius: 999,
                    background: restElapsed >= m * 60 ? (m >= 3 ? C.red : m >= 2 ? C.yellow : C.green) : C.border,
                  }} />
                ))}
              </div>
              <div style={{ fontSize: 12, color: C.muted }}>
                {restElapsed < 60 ? "1分まで" : `${Math.floor(restElapsed / 60)}分経過`}
              </div>
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <button onClick={() => startRest()}
              style={{ ...btn(C.surface2, C.text), flex: 1, padding: "11px 0", fontSize: 13, border: `1px solid ${C.border}` }}>
              リセット
            </button>
            <button onClick={() => setRestFull(false)}
              style={{ ...btn(C.surface2, C.muted), flex: 1, padding: "11px 0", fontSize: 13, border: `1px solid ${C.border}` }}>
              閉じる
            </button>
            <button onClick={() => stopRest()}
              style={{ ...btn(C.red), flex: 1, padding: "11px 0", fontSize: 13 }}>
              終了
            </button>
          </div>
        </div>
      )}

      {/* ===== 初回ガイド ===== */}
      {loaded && !guideSeen && (() => {
        const steps = [
          {
            art: "hero", title: "KURABELL Workout Log へようこそ",
            lead: "前回の内容がそのまま出てくる、筋トレ記録アプリです。",
            body: "同じ分割の前回の記録(重量・回数・セット数)がそのまま並ぶので、入力の手間なく「前回より上」を狙えます。推定1RMや自己ベストは自動で計算されます。",
          },
          {
            art: "split", title: "① 分割を決める",
            lead: "「分割」タブで、あなたのトレーニング分割を作ります。",
            body: "全身・上下・PPL・5分割のプリセットから選ぶか、ゼロから作成。各日にやる種目を登録しておくと、その日のメニューが自動で組まれます。保存するたびに次の日へ自動で進みます。",
          },
          {
            art: "record", title: "② 記録する",
            lead: "「記録」タブで、重量・回数・「あと何回できた?(RIR)」を入力。",
            body: "「あと何回できた?」を入力したセットが実施済みとして記録されます。セット番号のタップでウォームアップ(W)や補助あり(補)に切り替え、連続する種目はスーパーセットにまとめられます。休憩は入力後に自動でタイマーが動き、1分ごとに通知音が鳴ります。",
          },
          {
            art: "progress", title: "③ 伸びを確認する",
            lead: "Max 1RMと今日の1RMがその場で比較できます。",
            body: "セットごとに推定1RMが表示され、自己ベストを超えると更新バッジが出ます。何日ベストを更新していないかも分かるので、停滞にすぐ気付けます。\n\n⚠️ データは端末内だけに保存されます。設定タブから定期的にバックアップを書き出してください。",
          },
        ];
        const step = steps[guideStep];
        const last = guideStep === steps.length - 1;
        return (
          <div ref={guideModalRef} role="dialog" aria-modal="true" aria-label="アプリの使い方ガイド" tabIndex={-1}
            style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(10,11,12,0.96)", display: "flex", flexDirection: "column", padding: "calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))", overflowY: "auto" }}>
            <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", maxWidth: 460, width: "100%", margin: "0 auto" }}>
              <div style={{ display: "flex", justifyContent: "center", marginBottom: 24 }}>
                <div style={{
                  width: 168, height: 168, borderRadius: 28, background: C.surface,
                  border: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center",
                  boxShadow: "0 12px 40px rgba(0,0,0,0.45)",
                }}>
                  <GuideArt kind={step.art} />
                </div>
              </div>
              <h2 style={{ fontSize: 24, fontWeight: 900, textAlign: "center", margin: "0 0 14px", lineHeight: 1.35 }}>{step.title}</h2>
              <p style={{ fontSize: 16, color: C.text, textAlign: "center", lineHeight: 1.7, margin: "0 0 14px", fontWeight: 700 }}>{step.lead}</p>
              <p style={{ fontSize: 14, color: C.muted, lineHeight: 1.9, margin: 0, whiteSpace: "pre-wrap" }}>{step.body}</p>
            </div>
            <div style={{ maxWidth: 460, width: "100%", margin: "0 auto" }}>
              <div style={{ display: "flex", justifyContent: "center", gap: 8, margin: "24px 0" }}>
                {steps.map((_, i) => (
                  <div key={i} style={{ width: i === guideStep ? 22 : 8, height: 8, borderRadius: 999, background: i === guideStep ? C.red : C.border, transition: "width .2s" }} />
                ))}
              </div>
              <button onClick={() => last ? finishGuide() : setGuideStep(guideStep + 1)} style={{ ...btn(C.red), width: "100%", padding: 16, fontSize: 16 }}>
                {last ? "はじめる" : "次へ"}
              </button>
              <button onClick={finishGuide} style={{ ...btn("transparent", C.muted), width: "100%", padding: 12, fontSize: 13, marginTop: 6 }}>
                {last ? "" : "スキップ"}
              </button>
            </div>
          </div>
        );
      })()}

      {/* ===== 固定バー(タイマー+ボリューム) ===== */}
      {showBar && (
        <div style={{
          position: "sticky", top: 0, zIndex: 20, background: C.surface2, borderBottom: `1px solid ${C.border}`,
          padding: "10px 10px 12px", paddingTop: "calc(10px + env(safe-area-inset-top))",
        }}>
          <div style={{ display: "flex", alignItems: "stretch", gap: 6, maxWidth: 520, margin: "0 auto" }}>
            <div style={{ textAlign: "center", flexShrink: 0, minWidth: 62 }}>
              <div style={{ fontSize: 11, color: C.muted, marginBottom: 3 }}>経過</div>
              <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 30, lineHeight: 1 }}>{fmtClock(elapsed)}</div>
            </div>

            <div onClick={() => { if (sameSplitSessions.length > 0) setShowSplitHistory(true); }}
              style={{ flex: 1, minWidth: 0, textAlign: "center", borderLeft: `1px solid ${C.border}`, borderRight: `1px solid ${C.border}`, padding: "0 6px", cursor: sameSplitSessions.length > 0 ? "pointer" : "default" }}>
              <div style={{ fontSize: 11, color: C.muted, marginBottom: 3, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                ボリューム{compareBase && liveVolume > 0 ? ` (vs ${compareBase.avgLabel})` : ""}
              </div>
              <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 30, lineHeight: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                {Math.round(toU(liveVolume)).toLocaleString()}<span style={{ fontSize: 13, color: C.muted, marginLeft: 1 }}>{uLabel()}</span>
              </div>
              {compareBase && compareBase.avg > 0 && liveVolume > 0 && (() => {
                const pct = (liveVolume / compareBase.avg) * 100;
                const diff = liveVolume - compareBase.avg;
                return (
                  <div style={{ fontSize: 12, marginTop: 2, fontWeight: 700, color: pct >= 100 ? C.green : pct >= 90 ? C.yellow : C.red }}>
                    {pct.toFixed(0)}%
                    <span style={{ color: C.muted, fontWeight: 400, marginLeft: 4 }}>
                      平均{Math.round(toU(compareBase.avg)).toLocaleString()}
                    </span>
                  </div>
                );
              })()}
            </div>

            {restStartAt != null ? (
              <div onClick={() => setRestFull(true)} style={{ textAlign: "center", cursor: "pointer", flexShrink: 0, minWidth: 74 }}>
                <div style={{ fontSize: 11, color: C.yellow, marginBottom: 3 }}>インターバル</div>
                <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 30, lineHeight: 1, color: C.yellow }}>
                  {fmtClock(restElapsed)}
                </div>
                <div style={{ fontSize: 10, color: C.muted, marginTop: 2 }}>タップで拡大</div>
              </div>
            ) : (
              <button onClick={startRest} style={{
                ...btn(C.surface, C.text), padding: "0 12px", fontSize: 13, lineHeight: 1.35,
                flexShrink: 0, whiteSpace: "nowrap", border: `1px solid ${C.border}`,
              }}>
                インターバル<br />開始
              </button>
            )}
          </div>
        </div>
      )}

      <header style={{ padding: "16px 16px 12px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 26, letterSpacing: 0.5, lineHeight: 1.15 }}>
            KURABELL Workout Log
            <span style={{ fontFamily: FONT_UI, fontSize: 12, fontWeight: 700, color: C.green, marginLeft: 8, verticalAlign: "middle" }}>{APP_VERSION}</span>
          </div>
        </div>
        {(saveStatus === "saving" || saveStatus === "saved") && (
          <div role="status" style={{ fontSize: 12, color: saveStatus === "saved" ? C.green : C.muted, marginTop: 6 }}>
            {saveStatus === "saving" ? "保存中…" : "保存済み"}
          </div>
        )}
      </header>

      {error && (
        <div role="alert" style={{ margin: "0 16px 12px", padding: 12, borderRadius: 10, background: "#3A2224", color: "#F5B8B3", fontSize: 13 }}>
          <div>{error}</div>
          {saveStatus === "error" && (
            <button onClick={retrySave} style={{ ...btn(C.red), padding: "8px 14px", fontSize: 13, marginTop: 8 }}>再試行</button>
          )}
        </div>
      )}

      {/* 入力途中の記録を復元した通知 */}
      {draftRestored && today.length > 0 && (
        <div style={{ margin: "0 16px 12px", padding: 12, borderRadius: 10, background: "#1E3226", border: `1px solid ${C.green}`, display: "flex", gap: 10, alignItems: "flex-start" }}>
          <span style={{ fontSize: 15, flexShrink: 0 }}>💾</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, color: "#A8E6BC", lineHeight: 1.6, marginBottom: 8 }}>
              入力途中の記録を復元しました。続きから記録できます。
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setDraftRestored(false)} style={{ ...btn(C.green, "#fff"), padding: "6px 14px", fontSize: 13 }}>OK</button>
              <button onClick={async () => {
                if (!window.confirm("復元した記録を破棄して、最初からやり直しますか?")) return;
                setToday([]); setStartAt(null); setElapsed(0); stopRest(); setDraftRestored(false);
                try { await store.del(DRAFT_KEY); localStorage.removeItem(DRAFT_KEY); } catch { /* noop */ }
              }} style={{ ...btn("transparent", C.muted), padding: "6px 10px", fontSize: 13 }}>破棄する</button>
            </div>
          </div>
        </div>
      )}

      {/* バックアップ推奨バナー */}
      {backupNag && (
        <div style={{
          margin: "0 16px 12px", padding: 12, borderRadius: 10,
          background: "#3A3222", border: `1px solid ${C.yellow}`, display: "flex", gap: 10, alignItems: "flex-start",
        }}>
          <span style={{ fontSize: 16, flexShrink: 0, lineHeight: 1.3 }}>💾</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6, marginBottom: 8 }}>
              {backupNag.text}<br />
              <span style={{ color: C.muted, fontSize: 13 }}>
                記録は端末内にのみ保存されています。念のためファイルに書き出しておきましょう。
              </span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { setView("settings"); }} style={{ ...btn(C.yellow, "#141517"), padding: "7px 14px", fontSize: 13 }}>
                今すぐバックアップ
              </button>
              <button onClick={() => setHideBackupNag(true)} style={{ ...btn("transparent", C.muted), padding: "7px 10px", fontSize: 13 }}>
                あとで
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ===== 記録タブ ===== */}
      {view === "log" && (
        <div style={{ padding: "0 16px" }}>
          {todayDay && (
            <div style={{ background: C.surface, border: `1px solid ${C.blue}`, borderRadius: 14, padding: 14, marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontSize: 12, color: C.blue, fontWeight: 800 }}>今日のセッション(Day {split.cursor % split.days.length + 1}/{split.days.length}・{splitName(split.name)})</div>
              </div>
              <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 26, fontWeight: 800, margin: "4px 0 8px" }}>{dayName(todayDay.name)}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {todayDay.muscles.map(m => { const d = lastTrained(m); return (
                  <span key={m} style={{ ...chip(false), cursor: "default", background: C.bg }}>{muscleName(m)}{d != null && <span style={{ color: C.yellow }}> ・{d === 0 ? "今日" : `${d}日前`}</span>}</span>
                ); })}
              </div>
            </div>
          )}

          {/* 今日の自動メニュー(分割があるとき、記録開始前に表示) */}
          {todayDay && today.length === 0 && autoMenu.length > 0 && (
            <div style={{ background: C.surface, borderRadius: 14, padding: 14, marginBottom: 14, border: `1px solid ${C.border}` }}>
              <div style={{ fontSize: 13, fontWeight: 900, marginBottom: 2 }}>今日のメニュー</div>
              <div style={{ fontSize: 12, color: C.muted, marginBottom: 10, lineHeight: 1.6 }}>
                {todayDay.exercises && todayDay.exercises.length ? "マイ分割に登録した種目" : "前回のセッション"}の記録をそのまま引き継いでいます。開始後に調整できます。
              </div>
              {autoMenu.map((it, i) => {
                const p = it.prescription;
                return (
                  <div key={i} style={{ marginBottom: 10, paddingBottom: 8, borderBottom: i < autoMenu.length - 1 ? `1px solid ${C.border}` : "none" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, marginBottom: 3 }}>
                      <span style={{ fontSize: 13, minWidth: 0, lineHeight: 1.4 }}>
                        {exName(p.name)}<span style={{ color: C.muted, fontSize: 12, marginLeft: 6 }}>{muscleName(p.muscle)}</span>
                      </span>
                      <span style={{ flexShrink: 0 }}><JudgeBadge type={it.type} /></span>
                    </div>
                    {p.prevSets ? (
                      <div style={{ fontSize: 13, color: C.grey, lineHeight: 1.7, opacity: 0.6 }}>
                        {p.prevSets.map((s, si) => (
                          <span key={si}>
                            {si > 0 && " / "}
                            {s.warmup ? "W:" : ""}{s.assisted ? "補:" : ""}
                            <span style={{ color: C.grey, fontWeight: s.warmup ? 400 : 700 }}>
                              {s.weight}{p.isDb ? "(片手)" : ""}×{s.reps}
                            </span>
                          </span>
                        ))}
                        <span style={{ color: C.grey, marginLeft: 6 }}>({p.sets}セット)</span>
                      </div>
                    ) : (
                      <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 18, fontWeight: 600, color: C.muted }}>
                        {wU(p.weight)}<span style={{ fontSize: 12, color: C.muted }}>{uLabel()}{p.bwFactor > 0 ? "加重" : p.isDb ? "片手" : ""}</span>
                        {" × "}<span style={{ fontSize: 15 }}>{repsLabel(p.targetReps)}</span>
                      </div>
                    )}
                  </div>
                );
              })}
              <button onClick={startAutoMenu} style={{ ...btn(C.red), width: "100%", padding: 14, fontSize: 15, marginTop: 6 }}>この内容で記録を開始</button>
            </div>
          )}

          <h2 style={{ fontSize: 16, fontWeight: 900, margin: "8px 0 12px" }}>今日の記録</h2>

          {today.length === 0 && (
            <div style={{ border: `1px dashed ${C.border}`, borderRadius: 14, padding: 20, color: C.muted, fontSize: 14, textAlign: "center", marginBottom: 16 }}>
              {todayDay && autoMenu.length > 0 ? "上の「今日のメニュー」から開始するか、下の一覧で種目を追加できます。" : "下の一覧から種目を追加して開始しましょう。"}
              {!split && <><br />「分割」タブでマイ分割法を作ると、今日のメニューに前回の記録が引き継がれます。</>}
            </div>
          )}

          {today.map((ex, exIdx) => {
            const ins = exerciseInsight(ex.name); // 前回の内容(セット行のゴースト表示と判断材料で共用)
            const prevEx = today[exIdx - 1];
            const nextEx = today[exIdx + 1];
            const inGroup = !!ex.ssGroup;
            const groupStart = inGroup && (!prevEx || prevEx.ssGroup !== ex.ssGroup);
            const groupEnd = inGroup && (!nextEx || nextEx.ssGroup !== ex.ssGroup);
            const isLast = exIdx === today.length - 1;
            // グループ内の順番(A/B/C…)
            let ssLetter = "";
            if (inGroup) {
              let n = 0;
              for (let k = exIdx; k >= 0 && today[k].ssGroup === ex.ssGroup; k--) n++;
              ssLetter = String.fromCharCode(64 + n); // 1→A
            }
            return (
            <React.Fragment key={ex.id}>
            <div style={{
              background: C.surface, padding: 14,
              border: `1px solid ${inGroup ? C.blue : C.border}`,
              borderTopWidth: inGroup && !groupStart ? 0 : 1,
              borderRadius: inGroup ? (groupStart ? "14px 14px 0 0" : groupEnd ? "0 0 14px 14px" : 0) : 14,
              marginBottom: inGroup && !groupEnd ? 0 : (isLast ? 12 : 0),
            }}>
              {groupStart && (
                <div style={{ display: "inline-block", background: C.blue, color: "#fff", fontSize: 11, fontWeight: 800, borderRadius: 6, padding: "2px 8px", marginBottom: 8 }}>
                  スーパーセット
                </div>
              )}
              <div style={{ marginBottom: 8 }}>
                <div style={{ fontSize: 14, fontWeight: 700, lineHeight: 1.4, marginBottom: 6 }}>
                  {inGroup && <span style={{ color: C.blue, fontWeight: 800, marginRight: 6 }}>{ssLetter}.</span>}
                  {exName(ex.name)}
                  {ex.muscle && <span style={{ color: C.muted, fontSize: 12, fontWeight: 400, marginLeft: 6 }}>{ex.muscle}</span>}
                  {resolveIsDb(ex.name, ex.isDb) && <span style={{ color: C.muted, fontSize: 12, marginLeft: 4 }}>片手</span>}
                  {resolveRom(ex.name, ex.rom) < 1 && <span style={{ color: C.blue, fontSize: 11, marginLeft: 4 }}>ROM×{resolveRom(ex.name, ex.rom)}</span>}
                  {todayDay && ex.muscle && !muscleMatchesDay(ex.muscle, todayDay) && <span style={{ color: C.yellow, fontSize: 12, marginLeft: 6 }}>今日の部位外</span>}
                </div>
                {exIdx > 0 && (
                  <button onClick={() => toggleSuperset(ex.id)} style={{
                    ...btn(inGroup && prevEx && prevEx.ssGroup === ex.ssGroup ? C.blue : C.surface2, inGroup && prevEx && prevEx.ssGroup === ex.ssGroup ? "#fff" : C.muted),
                    padding: "4px 10px", fontSize: 12, marginBottom: 8,
                  }}>
                    {inGroup && prevEx && prevEx.ssGroup === ex.ssGroup ? "⛓ 上の種目とスーパーセット中(解除)" : "⛓ 上の種目とスーパーセットにする"}
                  </button>
                )}
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
                  <button onClick={() => moveExercise(ex.id, -1)} disabled={exIdx === 0} aria-label="上へ移動"
                    style={{ ...btn(C.surface2, exIdx === 0 ? C.border : C.muted), padding: "4px 8px", fontSize: 13, cursor: exIdx === 0 ? "default" : "pointer" }}>▲</button>
                  <button onClick={() => moveExercise(ex.id, 1)} disabled={exIdx === today.length - 1} aria-label="下へ移動"
                    style={{ ...btn(C.surface2, exIdx === today.length - 1 ? C.border : C.muted), padding: "4px 8px", fontSize: 13, cursor: exIdx === today.length - 1 ? "default" : "pointer" }}>▼</button>
                  <button onClick={() => openYouTube(ex.name)} aria-label="YouTubeでフォームを検索" style={{ ...btn(C.surface2, C.red), padding: "4px 8px", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap", flexShrink: 0 }}>YouTube</button>
                  <button onClick={() => { setSwapEx(swapEx === ex.id ? null : ex.id); setSwapSearch(""); setSwapMuscle(""); }}
                    style={{ ...btn(C.surface2, swapEx === ex.id ? C.blue : C.muted), padding: "4px 9px", fontSize: 13, whiteSpace: "nowrap", flexShrink: 0 }}>変更</button>
                  <button onClick={() => setOpenHist({ ...openHist, [ex.id]: !openHist[ex.id] })}
                    style={{ ...btn(C.surface2, openHist[ex.id] ? C.blue : C.muted), padding: "4px 9px", fontSize: 13, whiteSpace: "nowrap", flexShrink: 0 }}>履歴</button>
                  <button onClick={() => setOpenCfg({ ...openCfg, [ex.id]: !openCfg[ex.id] })} aria-label="種目の詳細設定" aria-expanded={!!openCfg[ex.id]}
                    style={{ ...btn(C.surface2, C.muted), padding: "4px 9px", fontSize: 13, minWidth: 32, minHeight: 32, flexShrink: 0 }}>⚙</button>
                  <div style={{ flex: 1 }} />
                  <button onClick={() => removeExercise(ex.id)} aria-label="種目を削除" style={{ ...btn("transparent", C.muted), padding: "4px 6px", fontSize: 13, whiteSpace: "nowrap", flexShrink: 0 }}>✕ 削除</button>
                </div>
              </div>

              {/* 種目の差し替え(セットは新しい種目の前回記録から入れ直す) */}
              {swapEx === ex.id && (
                <div style={{ background: C.bg, borderRadius: 10, padding: 10, marginBottom: 10, border: `1px solid ${C.blue}` }}>
                  <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>
                    別の種目に差し替えます(入力中のセットは、差し替え先の種目の前回記録に入れ替わります)。
                  </div>
                  <input value={swapSearch} onChange={e => setSwapSearch(e.target.value)} placeholder="種目を検索"
                    style={{ width: "100%", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "8px 10px", fontSize: 16, fontFamily: "inherit", marginBottom: 8 }} />
                  {/* 部位フィルター(他の部位にも変更できる) */}
                  <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8, marginBottom: 4 }}>
                    <button onClick={() => setSwapMuscle("")} style={{ ...chip(swapMuscle === ""), flexShrink: 0 }}>すべて</button>
                    {MUSCLES.map(m => (
                      <button key={m} onClick={() => setSwapMuscle(m)} style={{ ...chip(swapMuscle === m), flexShrink: 0 }}>{muscleName(m)}</button>
                    ))}
                  </div>
                  <div style={{ maxHeight: 180, overflowY: "auto" }}>
                    {allExercises
                      .filter(e => {
                        const q = swapSearch.trim();
                        if (e.n === ex.name) return false;
                        // 今日の記録に既にある種目名には差し替えない(同名重複すると、履歴参照が
                        // 名前ベースの.findのため一方のカードの記録が以後参照できなくなる)
                        if (today.some(t => t.id !== ex.id && t.name === e.n)) return false;
                        if (q) return exMatches(e, q);
                        if (swapMuscle) return e.m === swapMuscle;
                        return true; // 既定はすべての部位から選べる
                      })
                      .slice(0, 60)
                      .map(e => (
                        <button key={e.n} onClick={() => swapExercise(ex.id, e.n)}
                          style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, width: "100%", textAlign: "left", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 10px", marginBottom: 5, cursor: "pointer", color: C.text, fontSize: 13, fontFamily: "inherit" }}>
                          <span style={{ minWidth: 0 }}>{exName(e.n)}</span>
                          <span style={{ color: C.muted, fontSize: 12, flexShrink: 0 }}>{muscleName(e.m)}・{eqName(e.eq)}</span>
                        </button>
                      ))}
                  </div>
                  <button onClick={() => { setSwapEx(null); setSwapSearch(""); }} style={{ ...btn("transparent", C.muted), width: "100%", fontSize: 13, padding: 6, marginTop: 2 }}>キャンセル</button>
                </div>
              )}

              {/* 判断材料: 重量の停滞と推移。前回の各セットはセット行に並べて出すのでここでは繰り返さない */}
              {(() => {
                if (!ins) return null;
                const hasStreak = ins.streak >= 2, hasTrend = ins.trend.length >= 2;
                const unit = ins.isDb ? `${uLabel()}(片手)` : uLabel();
                return (
                  <div style={{ background: C.bg, borderRadius: 10, padding: "6px 10px", marginBottom: 10, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                    <span style={{ fontSize: 12, color: C.muted }}>前回 {fmtDate(ins.date)}</span>
                    {hasStreak && (
                      <span style={{ fontSize: 12, color: ins.streak >= 4 ? C.yellow : C.muted }}>
                        {wU(ins.topWeight)}{unit} で <strong>{ins.streak}回連続</strong>
                      </span>
                    )}
                    {hasTrend && (
                      <span style={{ fontSize: 12, color: C.muted }}>
                        推移 {ins.trend.map(wU).join(" → ")}
                      </span>
                    )}
                  </div>
                );
              })()}

              {/* 過去の自分 vs 今日の自分 */}
              {(() => {
                const pr = prMap[ex.name];
                const live1RM = liveBest1RM(ex);            // 今日の推定1RM
                const liveW = liveMaxWeight(ex);            // 今日の最大重量(実挙上)
                const bestW = pr?.bestWeight || 0;          // 自己ベスト = 実際に挙げた最大重量
                const best1RM = pr?.best1RM || 0;           // 推定1RMのベスト
                const isPRw = liveW > 0 && liveW > bestW + 0.01;
                const isPR1RM = live1RM > 0 && live1RM > best1RM + 0.01;
                const hasHistory = !!pr && (pr.best1RM > 0 || pr.bestWeight > 0);
                if (!hasHistory && live1RM === 0) return null; // 初めての種目で未実施なら表示しない
                const diff = live1RM > 0 && best1RM > 0 ? live1RM - best1RM : null;
                const pct = diff != null && best1RM > 0 ? (live1RM / best1RM) * 100 : null;
                const daysSincePR = pr?.date ? Math.floor((Date.now() - new Date(pr.date).getTime()) / 86400000) : null;
                const unit = ex.bwFactor > 0 ? `${uLabel()}(体重込)` : resolveIsDb(ex.name, ex.isDb) ? `${uLabel()}(両手計)` : uLabel();
                return (
                  <div style={{ background: C.bg, borderRadius: 10, padding: "10px 12px", marginBottom: 10 }}>
                    {/* 対比 */}
                    <div style={{ display: "flex", alignItems: "stretch", gap: 8 }}>
                      <div style={{ flex: 1, textAlign: "center" }}>
                        <div style={{ fontSize: 10, color: C.muted, marginBottom: 2 }}>
                          過去の自分{pr?.date ? `(${fmtDate(pr.date)})` : ""}
                        </div>
                        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 24, fontWeight: 800, color: C.yellow, lineHeight: 1 }}>
                          {best1RM > 0 ? toU(best1RM).toFixed(1) : "—"}<span style={{ fontSize: 11, color: C.muted }}>{uLabel()}</span>
                        </div>
                        <div style={{ fontSize: 10, color: C.muted, marginTop: 2 }}>{pr?.weight > 0 ? `${wU(pr.weight)}${uLabel()}×${pr.reps}回` : "Max 1RM"}</div>
                      </div>

                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flexShrink: 0, minWidth: 46 }}>
                        <div style={{ fontSize: 10, color: C.muted }}>VS</div>
                        {diff != null && (
                          <div style={{ fontSize: 13, fontWeight: 800, color: diff >= 0 ? C.green : C.red, whiteSpace: "nowrap" }}>
                            {diff >= 0 ? "+" : ""}{diff.toFixed(1)}
                          </div>
                        )}
                        {pct != null && (
                          <div style={{ fontSize: 10, color: C.muted }}>{pct.toFixed(0)}%</div>
                        )}
                      </div>

                      <div style={{ flex: 1, textAlign: "center" }}>
                        <div style={{ fontSize: 10, color: isPR1RM ? C.green : C.muted, marginBottom: 2, fontWeight: isPR1RM ? 800 : 400 }}>今日の自分</div>
                        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 24, fontWeight: 800, color: isPR1RM ? C.green : C.text, lineHeight: 1 }}>
                          {live1RM > 0 ? toU(live1RM).toFixed(1) : "—"}<span style={{ fontSize: 11, color: C.muted }}>{uLabel()}</span>
                        </div>
                        <div style={{ fontSize: 10, color: C.muted, marginTop: 2 }}>推定1RM</div>
                      </div>
                    </div>

                    {/* 到達度バー */}
                    {pct != null && (
                      <div style={{ marginTop: 8, height: 5, borderRadius: 999, background: C.surface2, overflow: "hidden" }}>
                        <div style={{
                          width: `${Math.min(100, pct)}%`, height: "100%", borderRadius: 999,
                          background: isPR1RM ? C.green : pct >= 95 ? C.yellow : C.blue, transition: "width .3s",
                        }} />
                      </div>
                    )}

                    {/* 過去の自分を超えた! */}
                    {isPR1RM && best1RM > 0 && (
                      <div style={{
                        marginTop: 10, padding: "10px 12px", borderRadius: 10, textAlign: "center",
                        background: "linear-gradient(90deg, rgba(76,175,110,0.22), rgba(232,179,60,0.22))",
                        border: `1px solid ${C.green}`,
                      }}>
                        <div style={{
                          fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 30,
                          letterSpacing: 2, color: C.green, lineHeight: 1,
                        }}>
                          YOU WIN!
                        </div>
                        <div style={{ fontSize: 12, color: C.text, marginTop: 5 }}>
                          過去の自分に勝利(<strong style={{ color: C.yellow }}>+{toU(live1RM - best1RM).toFixed(1)}{uLabel()}</strong>)
                        </div>
                      </div>
                    )}

                    {/* 更新バッジ / 未更新日数 */}
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
                      {isPR1RM && best1RM === 0 && (
                        <span style={{ background: C.yellow, color: "#141517", borderRadius: 999, padding: "3px 11px", fontSize: 12, fontWeight: 800 }}>
                          ⚡ 初回記録 {toU(live1RM).toFixed(1)}{uLabel()}
                        </span>
                      )}
                      {isPRw && (
                        <span style={{ background: C.green, color: "#fff", borderRadius: 999, padding: "3px 11px", fontSize: 12, fontWeight: 800 }}>
                          🏆 最大重量 {toU(liveW).toFixed(1)}{unit}
                        </span>
                      )}
                      {!isPR1RM && daysSincePR != null && (
                        <span style={{ fontSize: 11, color: daysSincePR >= 60 ? C.yellow : C.muted }}>
                          {daysSincePR === 0 ? "本日1RM更新済み" : `1RM ${daysSincePR}日間未更新`}
                        </span>
                      )}
                      {!isPRw && bestW > 0 && (
                        <span style={{ fontSize: 11, color: C.muted }}>最大重量 {toU(bestW).toFixed(1)}{unit}</span>
                      )}
                    </div>
                  </div>
                );
              })()}

              {/* この種目の過去履歴 */}
              {openHist[ex.id] && (() => {
                const hist = exerciseHistory(ex.name, 5);
                return (
                  <div style={{ background: C.bg, borderRadius: 10, padding: 10, marginBottom: 10, border: `1px solid ${C.blue}` }}>
                    <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>
                      {exName(ex.name)} の直近{hist.length > 0 ? hist.length : ""}回の記録
                    </div>
                    {hist.length === 0 ? (
                      <div style={{ fontSize: 13, color: C.muted, textAlign: "center", padding: "8px 0" }}>この種目の過去記録はまだありません。</div>
                    ) : hist.map((h, hi) => (
                      <div key={hi} style={{ marginBottom: 8, paddingBottom: 6, borderBottom: hi < hist.length - 1 ? `1px solid ${C.border}` : "none" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, marginBottom: 2 }}>
                          <span style={{ fontSize: 13, fontWeight: 700, color: hi === 0 ? C.text : C.muted }}>
                            {fmtDate(h.date)}{hi === 0 && <span style={{ color: C.blue, fontSize: 11, marginLeft: 6 }}>前回</span>}
                          </span>
                          <span style={{ fontSize: 12, color: C.yellow, flexShrink: 0 }}>{Math.round(toU(h.volume)).toLocaleString()}{uLabel()}</span>
                        </div>
                        <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.6, wordBreak: "break-word" }}>
                          {h.ex.sets.map(s => `${s.warmup ? "W:" : ""}${s.assisted ? "補:" : ""}${s.weight}×${s.reps}${s.rir != null ? `(RIR${s.rir})` : ""}`).join(" / ")}
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })()}

              {openCfg[ex.id] && (
                <div style={{ background: C.bg, borderRadius: 10, padding: 12, marginBottom: 10 }}>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center", marginBottom: 10 }}>
                    {!ex.muscle && (
                      <label style={{ fontSize: 13, color: C.yellow }}>部位(未設定) <select value={ex.muscle} onChange={e => updEx(ex.id, { muscle: e.target.value })} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "5px 6px", fontSize: 16, fontFamily: "inherit" }}><option value="">未設定</option>{MUSCLES.map(m => <option key={m} value={m}>{muscleName(m)}</option>)}</select></label>
                    )}
                    <label style={{ fontSize: 13, color: C.muted, display: "flex", alignItems: "center", gap: 4 }}><input type="checkbox" checked={ex.bwFactor > 0} onChange={e => updEx(ex.id, { bwFactor: e.target.checked ? 0.7 : 0 })} />自重種目</label>
                  </div>

                  {/* 体重係数(自重種目のみ) */}
                  {ex.bwFactor > 0 && (
                    <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 10, marginBottom: 10 }}>
                      <label style={{ fontSize: 13, color: C.text, display: "flex", alignItems: "center", gap: 6 }}>
                        体重係数
                        <NumInput inputMode="decimal" value={ex.bwFactor} style={cfgInput}
                          onChange={e => updEx(ex.id, { bwFactor: e.target.value })}
                          onBlur={e => { const v = num(e.target.value); updEx(ex.id, { bwFactor: v > 0 ? v : 0 }); }} />
                      </label>
                      <p style={{ fontSize: 11, color: C.muted, margin: "6px 0 0", lineHeight: 1.7 }}>
                        自重のうち何割が負荷になるかの目安です。重量は「体重×係数＋加重」で計算されます。
                        懸垂は体重のほぼ全部を持ち上げるので1.0、ディップスは0.95、腕立ては足で支える分を除いて0.65前後が目安です。
                      </p>
                    </div>
                  )}

                  {/* 可動域係数 */}
                  <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 10 }}>
                    <label style={{ fontSize: 13, color: C.text, display: "flex", alignItems: "center", gap: 6 }}>
                      可動域係数
                      <NumInput inputMode="decimal" value={ex.rom ?? 1} style={cfgInput}
                        onChange={e => updEx(ex.id, { rom: e.target.value })}
                        onBlur={e => { const v = num(e.target.value); updEx(ex.id, { rom: v > 0 ? Math.min(1, Math.max(0.1, v)) : 1 }); }} />
                    </label>
                    <p style={{ fontSize: 11, color: C.muted, margin: "6px 0 0", lineHeight: 1.7 }}>
                      動かす距離が短い種目のボリュームを控えめに数えるための係数です。
                      シュラッグやカーフレイズは重量の割に可動域が数cmしかないため0.5、通常の種目は1.0にしています。
                      集計ボリュームにのみ影響し、推定1RMやPRには影響しません。
                    </p>
                  </div>
                </div>
              )}

              <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 4 }}>
                <span style={{ width: 20 }} />
                <span style={{ flex: 1.3, ...fieldLabel }}>{ex.bwFactor > 0 ? `加重 ${uLabel()}` : resolveIsDb(ex.name, ex.isDb) ? `重量 ${uLabel()}/片手` : `重量 ${uLabel()}`}</span>
                <span style={{ flex: 1, ...fieldLabel }}>回数</span>
                <span style={{ width: 26 }} />
                <span style={{ flex: 2.4, ...fieldLabel }}>あと何回できた?<span style={{ opacity: 0.7 }}>(RIR)</span></span>
                <span style={{ width: 26 }} />
              </div>

              {ex.sets.map((s, i) => {
                const wsIndex = ex.sets.slice(0, i + 1).filter(x => !x.warmup).length; // ワーキング通し番号
                const inc = incU(num(ex.increment) || 2.5);
                const done = s.warmup || (s.rir !== "" && s.rir != null); // 実施済みか
                // このセットの推定1RM(ウォームアップ・補助は対象外)
                const setW = fromU(s.weight), setR = Math.round(num(s.reps));
                const set1RM = (!s.warmup && !s.assisted && setW > 0 && setR > 0 && s.rir !== "" && s.rir != null)
                  ? est1RM(effWeight(setW, resolveIsDb(ex.name, ex.isDb), ex.bwFactor || 0, profile.bodyweight), setR)
                  : 0;
                const pastBest1RM = prMap[ex.name]?.best1RM || 0;
                // このセットが自己ベストを更新しているか(同一セッション内では最も高い1セットのみに印を付ける)
                const bestIdxInSession = (() => {
                  let bi = -1, bv = 0;
                  ex.sets.forEach((x, xi) => {
                    if (x.warmup || x.assisted) return;
                    if (x.rir === "" || x.rir == null) return; // 未実施は対象外
                    const w = fromU(x.weight), r = Math.round(num(x.reps));
                    if (w <= 0 || r <= 0) return;
                    const v = est1RM(effWeight(w, resolveIsDb(ex.name, ex.isDb), ex.bwFactor || 0, profile.bodyweight), r);
                    if (v > bv) { bv = v; bi = xi; }
                  });
                  return bi;
                })();
                const isSetPR = set1RM > 0 && set1RM > pastBest1RM + 0.01 && i === bestIdxInSession;
                // 前回の同じ番手のワーキングセット。同じ重量×回数なら余力の伸びを差分で出す
                const prevSet = s.warmup ? null : (ins?.sets?.[wsIndex - 1] || null);
                const rirDiff = (prevSet && prevSet.rir != null && s.rir !== "" && s.rir != null
                  && num(prevSet.weight) === setW && Math.round(num(prevSet.reps)) === setR)
                  ? num(s.rir) - prevSet.rir : null;
                return (
                <div key={i} style={{ marginBottom: 8, opacity: done ? 1 : 0.55 }}>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <button onClick={() => {
                      // 通常 → ウォームアップ(W) → 補助あり(補) → 通常 の順で切替
                      const next = (!s.warmup && !s.assisted) ? { warmup: true, assisted: false }
                        : s.warmup ? { warmup: false, assisted: true }
                        : { warmup: false, assisted: false };
                      setToday(t => t.map(e => e.id !== ex.id ? e : {
                        ...e, sets: e.sets.map((x, j) => j === i ? { ...x, ...next } : x),
                      }));
                    }}
                      title="タップで ウォームアップ / 補助あり / 通常 を切替"
                      aria-label={`セット${i + 1}の種別を切り替え`}
                      style={{ width: 24, height: 24, borderRadius: 6, flexShrink: 0, cursor: "pointer", fontSize: 12, fontWeight: 800, fontFamily: "inherit",
                        border: `1px solid ${s.warmup ? C.yellow : s.assisted ? C.blue : C.border}`,
                        background: s.warmup ? C.yellow : s.assisted ? C.blue : "transparent",
                        color: s.warmup ? "#141517" : s.assisted ? "#fff" : C.muted }}>
                      {s.warmup ? "W" : s.assisted ? "補" : wsIndex}
                    </button>
                    <NumInput inputMode="decimal" value={s.weight} placeholder="0"
                      onBlur={() => { if ((num(s.weight) > 0 || num(s.reps) > 0) && isLastInGroup(exIdx)) startRest(); }}
                      onChange={e => updateSet(ex.id, i, "weight", e.target.value)} aria-label={`セット${i + 1}の重量(${uLabel()})`} style={{ ...numInput, flex: 1.3, opacity: s.warmup ? 0.6 : 1 }} />
                    <NumInput inputMode="numeric" value={s.reps} placeholder="0"
                      onBlur={() => { if ((num(s.weight) > 0 || num(s.reps) > 0) && isLastInGroup(exIdx)) startRest(); }}
                      onChange={e => updateSet(ex.id, i, "reps", e.target.value)} aria-label={`セット${i + 1}の回数`} style={{ ...numInput, flex: 1, opacity: s.warmup ? 0.6 : 1 }} />
                    <button onClick={() => copyFromPrev(ex.id, i)} disabled={i === 0}
                      title="前のセットの重量・回数をコピー" aria-label="前のセットをコピー"
                      style={{ width: 26, height: 26, borderRadius: 8, flexShrink: 0, cursor: i === 0 ? "default" : "pointer", fontSize: 13,
                        border: `1px solid ${i === 0 ? C.border : C.blue}`, background: C.surface2, color: i === 0 ? C.border : C.blue }}>⧉</button>
                    <div style={{ flex: 2.4, opacity: s.warmup ? 0.35 : 1, pointerEvents: s.warmup ? "none" : "auto" }}>
                      <RirSelect value={s.rir === "" ? null : num(s.rir)} onChange={v => {
                        updateSet(ex.id, i, "rir", v === "" ? "" : v);
                        if (v !== "" && isLastInGroup(exIdx)) { startRest(); setRestFull(true); }
                      }} />
                    </div>
                    <button onClick={() => removeSet(ex.id, i)} aria-label={`セット${i + 1}を削除`}
                      style={{ width: 26, height: 26, borderRadius: 8, border: `1px solid ${C.border}`, background: C.surface2, color: C.muted, fontSize: 13, cursor: "pointer", flexShrink: 0 }}>✕</button>
                  </div>

                  {/* このセットの推定1RM と、前回の同じ番手のセット */}
                  {(set1RM > 0 || prevSet) && (
                    <div style={{ display: "flex", alignItems: "center", gap: 8, paddingLeft: 30, marginTop: 3, flexWrap: "wrap" }}>
                      {set1RM > 0 && (
                        <span style={{ fontSize: 11, color: isSetPR ? C.green : C.muted }}>
                          推定1RM {toU(set1RM).toFixed(1)}{uLabel()}
                        </span>
                      )}
                      {isSetPR && (
                        <span style={{ background: C.yellow, color: "#141517", borderRadius: 999, padding: "1px 8px", fontSize: 11, fontWeight: 800 }}>
                          ⚡ 1RM更新 +{toU(set1RM - pastBest1RM).toFixed(1)}{uLabel()}
                        </span>
                      )}
                      {prevSet && (
                        <span style={{ fontSize: 11, color: C.muted, marginLeft: "auto" }}>
                          前回 {prevSet.assisted ? "補:" : ""}{prevSet.weight}×{prevSet.reps}
                          {prevSet.rir != null ? ` RIR${prevSet.rir}` : ""}
                          {rirDiff != null && (
                            <span style={{ marginLeft: 5, fontWeight: 800, color: rirDiff > 0 ? C.green : rirDiff < 0 ? C.yellow : C.muted }}>
                              {rirDiff > 0 ? `→ RIR+${rirDiff}` : rirDiff < 0 ? `→ RIR${rirDiff}` : "→ 同じ"}
                            </span>
                          )}
                        </span>
                      )}
                    </div>
                  )}
                </div>
                );
              })}
              <div style={{ fontSize: 11, color: C.muted, marginBottom: 8, lineHeight: 1.6 }}>
                ※「あと何回できた?」を入力したセットが実施済みとして記録されます(薄いセットは未実施)。
                左の番号をタップすると ウォームアップ(W) → 補助あり(補) → 通常 と切り替わります。
              </div>

              <button onClick={() => { addSet(ex.id); }} style={{ ...btn(C.surface2, C.text), width: "100%", padding: 10, fontSize: 13, marginBottom: 8 }}>＋ セットを追加</button>

              {/* フォーム崩れ / 痛み・違和感 / メモ */}
              <div style={{ display: "flex", gap: 8 }}>
                {[["formBroke", "フォーム崩れ", C.yellow], ["pain", "痛み・違和感", "#FF5A4E"]].map(([k, label, col]) => (
                  <button key={k} onClick={() => updEx(ex.id, { [k]: !ex[k] })} style={{ flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontFamily: "inherit", border: `1px solid ${ex[k] ? col : C.border}`, background: ex[k] ? col : C.bg, color: ex[k] ? "#141517" : C.muted, fontWeight: ex[k] ? 800 : 500 }}>{ex[k] ? "✓ " : ""}{label}</button>
                ))}
                <button onClick={() => setOpenNote({ ...openNote, [ex.id]: !openNote[ex.id] })}
                  aria-label="種目メモ"
                  style={{ flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 13, fontFamily: "inherit",
                    border: `1px solid ${exerciseNotes[ex.name] ? C.yellow : C.border}`, background: C.bg,
                    color: exerciseNotes[ex.name] ? C.yellow : C.muted, fontWeight: exerciseNotes[ex.name] ? 800 : 500 }}>
                  📌 メモ{exerciseNotes[ex.name] ? "有" : ""}
                </button>
              </div>

              {/* 固定メモ(展開時に編集、保存済みなら常に内容を表示) */}
              {openNote[ex.id] ? (
                <div style={{ marginTop: 8 }}>
                  <div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>この種目の固定メモ(次回も表示されます)</div>
                  <ExerciseNoteEditor
                    key={ex.name}
                    value={exerciseNotes[ex.name] || ""}
                    onSave={v => persist({ exerciseNotes: { ...exerciseNotes, [ex.name]: v } })} />
                </div>
              ) : exerciseNotes[ex.name] ? (
                <div onClick={() => setOpenNote({ ...openNote, [ex.id]: true })}
                  style={{ display: "flex", gap: 6, marginTop: 8, background: C.bg, borderLeft: `3px solid ${C.yellow}`, borderRadius: 6, padding: "8px 10px", fontSize: 13, color: C.text, lineHeight: 1.6, whiteSpace: "pre-wrap", cursor: "pointer" }}>
                  <span style={{ flexShrink: 0 }}>📌</span>
                  <span style={{ minWidth: 0 }}>{exerciseNotes[ex.name]}</span>
                </div>
              ) : null}

            </div>

            {/* 種目と種目の間に挿入 */}
            {!(inGroup && !groupEnd) && !isLast && (
              <>
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0 6px" }}>
                  <div style={{ flex: 1, height: 1, background: insertAt === exIdx + 1 ? C.red : C.border }} />
                  <button onClick={() => { setInsertAt(insertAt === exIdx + 1 ? null : exIdx + 1); setSearch(""); setPickerMuscle(""); }}
                    style={{
                      padding: "5px 14px", borderRadius: 999, cursor: "pointer",
                      fontSize: 13, fontFamily: "inherit", fontWeight: 700, whiteSpace: "nowrap",
                      border: `1px dashed ${insertAt === exIdx + 1 ? C.red : C.border}`,
                      background: insertAt === exIdx + 1 ? C.red : "transparent",
                      color: insertAt === exIdx + 1 ? "#fff" : C.muted,
                    }}>
                    {insertAt === exIdx + 1 ? "✕ 閉じる" : "＋ ここに追加"}
                  </button>
                  <div style={{ flex: 1, height: 1, background: insertAt === exIdx + 1 ? C.red : C.border }} />
                </div>

                {/* その場で種目を選べるパネル(下までスクロール不要) */}
                {insertAt === exIdx + 1 && (
                  <div style={{ background: C.surface, borderRadius: 14, padding: 12, marginBottom: 12, border: `1px solid ${C.red}` }}>
                    <input value={search} onChange={e => setSearch(e.target.value)} onFocus={selectOnFocus}
                      placeholder="種目を検索(なければカスタム追加)"
                      style={{ width: "100%", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "9px 10px", fontSize: 16, fontFamily: "inherit", marginBottom: 8 }} />
                    <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8 }}>
                      <button onClick={() => setPickerMuscle("")} style={{ ...chip(pickerMuscle === ""), flexShrink: 0 }}>最近使った順</button>
                      {MUSCLES.map(m => (
                        <button key={m} onClick={() => setPickerMuscle(m)} style={{ ...chip(pickerMuscle === m), flexShrink: 0 }}>{muscleName(m)}</button>
                      ))}
                    </div>
                    {/* こちらも同じ理由で、部分一致でも候補を出す。カスタム追加は候補の下に並べる */}
                    <div style={{ maxHeight: 210, overflowY: "auto" }}>
                      {pickerList.slice(0, 60).map(e => (
                        <button key={e.n} onClick={() => addExercise(e.n, undefined, exIdx + 1)}
                          style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, width: "100%", textAlign: "left", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 8, padding: "9px 10px", marginBottom: 5, cursor: "pointer", color: C.text, fontSize: 13, fontFamily: "inherit" }}>
                          <span style={{ minWidth: 0 }}>{exName(e.n)}{recentNames.includes(e.n) && <span style={{ color: C.blue, fontSize: 11, marginLeft: 6 }}>最近</span>}</span>
                          <span style={{ color: C.muted, fontSize: 12, flexShrink: 0 }}>{muscleName(e.m)}・{eqName(e.eq)}</span>
                        </button>
                      ))}
                    </div>
                    {search.trim() && !findExercise(search.trim()) && (
                      <button onClick={() => addExercise(search, { muscle: customDraft.muscle, eq: customDraft.eq, isDb: customDraft.eq === "ダンベル", bwFactor: customDraft.eq === "自重" ? 0.7 : 0 }, exIdx + 1)}
                        style={{ ...btn(C.red), width: "100%", padding: 10, fontSize: 14, marginTop: 8 }}>
                        「{search.trim()}」をカスタム追加
                      </button>
                    )}
                  </div>
                )}
              </>
            )}
            </React.Fragment>
            );
          })}

          {/* 種目選択 */}
          <div style={{ background: C.surface, borderRadius: 14, padding: 14, border: `1px solid ${insertAt != null ? C.red : C.border}` }}>
            {insertAt != null && (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, background: C.bg, borderRadius: 8, padding: "8px 10px", marginBottom: 10 }}>
                <span style={{ fontSize: 13, color: C.red, fontWeight: 700, minWidth: 0 }}>
                  {insertAt}番目の後ろに挿入します
                </span>
                <button onClick={() => setInsertAt(null)} style={{ ...btn("transparent", C.muted), padding: "2px 8px", fontSize: 12, flexShrink: 0 }}>末尾に戻す</button>
              </div>
            )}
            <input value={search} onChange={e => setSearch(e.target.value)} onFocus={selectOnFocus}
              // 既存種目はEnterでそのまま追加してよいが、新規カスタム種目は部位・器具を選ばずに
              // 既定値(部位未設定・ダンベル)のまま追加されてしまうため、Enterでは追加しない。
              // 下の「カスタム種目として追加」パネルで選んでからボタンを押してもらう。
              onKeyDown={e => { if (e.key === "Enter" && search.trim() && findExercise(search.trim())) addExercise(search); }}
              placeholder="種目を検索(なければカスタム追加)"
              style={{ width: "100%", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", color: C.text, fontSize: 16, fontFamily: "inherit", marginBottom: 10 }} />

            {!search.trim() && (
              <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
                <button onClick={() => setPickerMuscle(null)} style={{ ...chip(!pickerMuscle), flexShrink: 0 }}>{recentNames.length ? "最近使った順" : todayDay ? `今日(${dayName(todayDay.name)})` : "すべて"}</button>
                {MUSCLES.filter(m => EXERCISE_DB.some(e => e.m === m)).map(m => (
                  <button key={m} onClick={() => setPickerMuscle(pickerMuscle === m ? null : m)} style={{ ...chip(pickerMuscle === m), flexShrink: 0 }}>{muscleName(m)}</button>
                ))}
              </div>
            )}

            {/* 候補リストは検索語が完全一致でなくても常に出す。
                以前は「完全一致でなければカスタム追加パネルに切り替える」出し分けだったため、
                部分一致(「ベンチ」/"bench")では候補が1件も見えなかった。 */}
            <div style={{ maxHeight: 240, overflowY: "auto" }}>
              {pickerList.map(e => (
                <button key={e.n} onClick={() => addExercise(e.n)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, width: "100%", textAlign: "left", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 6, cursor: "pointer", color: C.text, fontSize: 13, fontFamily: "inherit" }}>
                  <span style={{ minWidth: 0 }}>{exName(e.n)}{recentNames.includes(e.n) && <span style={{ color: C.blue, fontSize: 11, marginLeft: 6 }}>最近</span>}</span>
                  <span style={{ color: C.muted, fontSize: 12, flexShrink: 0 }}>{muscleName(e.m)}・{eqName(e.eq)}</span>
                </button>
              ))}
              {pickerList.length === 0 && <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: 12 }}>該当なし。下のパネルからカスタム種目として追加できます。</div>}
            </div>

            {/* カスタム追加時の部位・器具設定。候補が出ていても、同じ名前で新しく作りたい場合が
                あるのでリストとは排他にせず、下に並べる。 */}
            {search.trim() && !findExercise(search.trim()) && (
              <div style={{ background: C.bg, borderRadius: 10, padding: 10, marginTop: 10 }}>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 8 }}>「{search.trim()}」をカスタム種目として追加</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
                  <select value={customDraft.muscle} onChange={e => setCustomDraft({ ...customDraft, muscle: e.target.value })} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "6px 8px", fontSize: 16, fontFamily: "inherit" }}>
                    <option value="">部位を選択</option>{MUSCLES.map(m => <option key={m} value={m}>{muscleName(m)}</option>)}
                  </select>
                  <select value={customDraft.eq} onChange={e => setCustomDraft({ ...customDraft, eq: e.target.value })} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "6px 8px", fontSize: 16, fontFamily: "inherit" }}>
                    {EQUIPMENT.map(q => <option key={q} value={q}>{eqName(q)}</option>)}
                  </select>
                </div>
                <button onClick={() => addExercise(search, { muscle: customDraft.muscle, eq: customDraft.eq, isDb: customDraft.eq === "ダンベル", bwFactor: customDraft.eq === "自重" ? 0.7 : 0 })} style={{ ...btn(C.red), width: "100%", padding: 10, fontSize: 14 }}>この設定で追加</button>
              </div>
            )}

          </div>

          {today.length > 0 && (
            <button onClick={saveWorkout} disabled={saving} style={{ ...btn(C.red), width: "100%", marginTop: 16, padding: 16, fontSize: 16 }}>
              {saving ? "保存中…" : `ワークアウトを保存${split ? "(次のDayへ)" : ""}`}
            </button>
          )}
        </div>
      )}

      {/* ===== 提案タブ ===== */}
      {/* ===== 分割タブ ===== */}
      {view === "split" && (
        <div style={{ padding: "0 16px" }}>
          <h2 style={{ fontSize: 16, fontWeight: 900, margin: "8px 0 4px" }}>分割法</h2>
          <p style={{ color: C.muted, fontSize: 13, margin: "0 0 12px" }}>ローテーション方式:保存するたびに次のDayへ進みます。</p>
          {(!split || pickingSplit) ? (
            <>
              {pickingSplit && split && (
                <button onClick={() => setPickingSplit(false)} style={{ ...btn(C.surface2, C.muted), fontSize: 13, padding: "8px 12px", marginBottom: 12 }}>← 今の分割({splitName(split.name)})に戻る</button>
              )}
              {!split && (
                <div style={{ background: C.surface, borderRadius: 14, padding: 14, marginBottom: 16, border: `1px solid ${C.border}` }}>
                  <div style={{ fontSize: 13, color: C.muted, marginBottom: 10, lineHeight: 1.6 }}>
                    分割を作らなくても、種目を選んですぐ記録を始められます。分割は後からいつでも作れます。
                  </div>
                  <button onClick={() => setView("log")} style={{ ...btn(C.red), width: "100%", padding: 14, fontSize: 15 }}>今すぐ記録する</button>
                </div>
              )}
              <p style={{ color: C.muted, fontSize: 13, margin: "0 0 10px" }}>{split ? "パターンを選ぶか、ゼロから作成できます。(選ぶと今の分割は置き換わります)" : "または、分割メニューを設定する"}</p>
              {SPLIT_PRESETS.map(p => (
                <button key={p.name} onClick={() => applyPreset(p)} style={{ ...btn(C.surface, C.text), width: "100%", textAlign: "left", padding: 14, marginBottom: 8, border: `1px solid ${C.border}` }}>
                  <div style={{ fontWeight: 900, fontSize: 15, marginBottom: 4 }}>{splitName(p.name)}</div>
                  <div style={{ color: C.muted, fontSize: 13, fontWeight: 400 }}>{p.days.map(d => dayName(d.name)).join(" → ")}</div>
                </button>
              ))}
              <button onClick={newCustomSplit} style={{ ...btn(C.surface2, C.text), width: "100%", padding: 14, border: `1px dashed ${C.border}` }}>＋ カスタム分割をゼロから作る</button>
            </>
          ) : (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, gap: 8 }}>
                <input value={split.name} onChange={e => updSplit({ name: e.target.value })} onFocus={selectOnFocus} aria-label="分割名" style={{ background: "transparent", border: "none", color: C.text, fontSize: 16, fontWeight: 900, fontFamily: "inherit", flex: 1, minWidth: 0 }} />
                <button onClick={() => setPickingSplit(true)} style={{ ...btn(C.blue), fontSize: 13, padding: "6px 10px", flexShrink: 0 }}>変更 / 作り直す</button>
              </div>
              <button onClick={deleteSplit} style={{ ...btn("transparent", C.muted), fontSize: 13, padding: "0 0 10px" }}>分割を削除</button>
              {split.days.map((d, i) => {
                const isNext = i === split.cursor % split.days.length; const editing = editDay === i;
                const goToLog = isNext && !editing;
                return (
                  <div key={i} onClick={goToLog ? () => setView("log") : undefined}
                    style={{ background: C.surface, borderRadius: 14, padding: 14, marginBottom: 8, border: `1px solid ${isNext ? C.blue : C.border}`, cursor: goToLog ? "pointer" : "default" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flex: 1, minWidth: 0 }}>
                        <span style={{ color: C.muted, fontSize: 13, flexShrink: 0 }}>Day {i + 1}</span>
                        {editing ? <input value={d.name} onChange={e => updDay(i, { name: e.target.value })} onFocus={selectOnFocus} aria-label="Day名" style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "4px 8px", fontSize: 16, fontFamily: "inherit", width: "100%" }} /> : <strong style={{ fontSize: 15 }}>{dayName(d.name)}</strong>}
                        {isNext && <span style={{ background: C.blue, color: "#fff", borderRadius: 999, padding: "2px 8px", fontSize: 11, fontWeight: 800, flexShrink: 0 }}>今日</span>}
                      </div>
                      <div style={{ display: "flex", gap: 4, flexShrink: 0, alignItems: "center" }} onClick={e => e.stopPropagation()}>
                        <button onClick={() => moveDay(i, -1)} disabled={i === 0} aria-label="上へ移動"

                          style={{ ...btn(C.surface2, i === split.days.length - 1 ? C.border : C.muted), padding: "4px 8px", fontSize: 13, cursor: i === split.days.length - 1 ? "default" : "pointer" }}>▼</button>

                        <button onClick={() => setEditDay(editing ? null : i)} style={{ ...btn(C.surface2, C.muted), padding: "4px 10px", fontSize: 13 }}>{editing ? "完了" : "編集"}</button>
                      </div>
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
                      {editing ? MUSCLES.map(m => <button key={m} onClick={() => toggleDayMuscle(i, m)} style={chip(d.muscles.includes(m))}>{muscleName(m)}</button>)
                        : d.muscles.length ? d.muscles.map(m => <span key={m} style={{ ...chip(false), cursor: "default" }}>{muscleName(m)}</span>)
