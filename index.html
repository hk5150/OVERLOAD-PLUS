<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />

<title>KURABELL Workout Log</title>
<meta name="description" content="プログレッシブオーバーロードに基づくトレーニング記録アプリ" />

<link rel="manifest" href="manifest.json" id="manifest-link" />
<script>
  // 端末が英語ならmanifestとページの説明文を英語版に差し替える。
  // manifestは1ページに1つしか指定できず、GitHub Pagesにはコンテントネゴシエーションが無いので、
  // ファイルを2つ置いてhrefを書き換える方式にしている(manifest.json / manifest.en.json)。
  // <head>内で走らせるのは、ブラウザがmanifestを読みに行く前に確定させるため。
  // ここは i18n.js より前なので t() は使えない(起動画面の BT 辞書と同じ制約)。
  (function () {
    if (String(navigator.language || '').slice(0, 2).toLowerCase() !== 'en') return;
    var m = document.getElementById('manifest-link');
    if (m) m.setAttribute('href', 'manifest.en.json');
    var d = document.querySelector('meta[name="description"]');
    if (d) d.setAttribute('content', 'A lifting log that puts your last session in front of you. Estimated 1RM and personal bests are calculated for you.');
  })();
</script>
<meta name="theme-color" content="#141517" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="KURABELL" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
  /* 数字・ロゴ用のBarlow Condensedはローカル同梱(fonts/、SIL OFL)。
     機内モードや電波の悪いジムでも字面が崩れないよう、外部CDNは使わない。
     日本語本文は端末の標準日本語フォント(iOSならHiragino Sans)に任せる:
     Noto Sans JPを同梱すると全ウェイトで数MBになり、ネイティブアプリの起動を重くするため。 */
  @font-face {
    font-family: 'Barlow Condensed';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url(fonts/barlow-condensed-600-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Barlow Condensed';
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url(fonts/barlow-condensed-800-latin.woff2) format('woff2');
  }

  html, body { margin: 0; padding: 0; background: #141517; color: #F2F0EB; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  * { -webkit-tap-highlight-color: transparent; }
  #boot { padding-top: calc(24px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; gap: 14px; padding: 24px; text-align: center; }
  #boot .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 1px; }
  #boot .msg { color: #8E939A; font-size: 13px; line-height: 1.7; }
  #boot .err { color: #F5B8B3; background: #3A2224; border-radius: 10px; padding: 12px; font-size: 12px; text-align: left; max-width: 420px; word-break: break-all; line-height: 1.7; }
  #boot button { background: #E2453C; color: #fff; border: none; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .spinner { width: 22px; height: 22px; border: 2px solid #2E3237; border-top-color: #E2453C; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 縦画面固定。
     ネイティブ(iOS)はInfo.plistのUISupportedInterfaceOrientationsで固定できるが、
     Web/PWAはiOS Safariがmanifestのorientationもscreen.orientation.lock()も無視するため、
     横向きのスマホにだけ「縦にしてください」を出して実質的に縦運用へ寄せる。
     pointer:coarse と max-height でタッチ端末の横向きだけに絞り、
     背の低いデスクトップウィンドウでは出さない。 */
  #rotate-lock { display: none; }
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
    #root { display: none; }
    #rotate-lock {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; min-height: 100vh; padding: 24px; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    }
    #rotate-lock .title { font-size: 16px; font-weight: 700; }
    #rotate-lock .msg { color: #8E939A; font-size: 13px; line-height: 1.7; }
  }
</style>
</head>
<body>

<div id="root">
  <div id="boot">

    <div class="msg" id="bootmsg">読み込み中…</div>
    <div class="err" id="booterr" style="display:none"></div>
    <button id="retry" style="display:none" onclick="location.reload(true)">再読み込み</button>
  </div>
</div>

<!-- 横向きのスマホでのみ表示(CSSの@mediaで制御)。縦画面前提のレイアウトなので縦運用へ誘導する -->
<div id="rotate-lock">
  <svg width="46" height="46" viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <rect x="15" y="4" width="18" height="30" rx="3" stroke="#F2F0EB" stroke-width="2"/>
    <path d="M22 30h4" stroke="#F2F0EB" stroke-width="2" stroke-linecap="round"/>
    <path d="M11 39a17 17 0 0 0 26 0" stroke="#E2453C" stroke-width="2" stroke-linecap="round"/>
    <path d="M37 33v6h-6" stroke="#E2453C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="title" id="rotate-title">画面を縦にしてください</div>
  <div class="msg" id="rotate-msg">KURABELL Workout Log は縦画面での利用を想定しています。</div>
</div>

<script>
  // ---- 起動診断 ----
  window.__boot = { react:false, recharts:false, babel:false, error:null };

  // ---- 起動画面の言語 ----
  // このブロックは src/domain/i18n.js より前に走るので t() が使えない。起動画面の文言だけは
  // ここに小さな辞書を持ち、navigator.language を直接見る。
  // 制約: 保存済みの言語設定(profile.lang)はまだ読めない(iOSでは非同期のPreferences/SQLite)。
  // 日本語端末で英語を選んでいる人には、起動の一瞬だけ日本語が出る。docs/多言語化.md 参照。
  var BOOT_JA = String(navigator.language || '').slice(0,2).toLowerCase() !== 'en';
  var BT = BOOT_JA ? {
    loading:'読み込み中…', libs:'ライブラリを読み込み中…', prep:'アプリを準備中…', retry:'再読み込み',
    onError:'起動時にエラーが発生しました', cantStart:'起動できませんでした',
    noSource:'全ての配信元から読み込めません: ', missing:' を読み込めませんでした',
    hint:'\n\n※ vendor/ フォルダを index.html と同じ階層に配置し、file:// ではなく http(s):// 経由で開いてください。',
    rotateTitle:'画面を縦にしてください', rotateMsg:'KURABELL Workout Log は縦画面での利用を想定しています。'
  } : {
    loading:'Loading…', libs:'Loading libraries…', prep:'Preparing the app…', retry:'Reload',
    onError:'An error occurred while starting', cantStart:'Could not start',
    noSource:'Could not load from any source: ', missing:' failed to load',
    hint:'\n\nPlace the vendor/ folder next to index.html and open the page over http(s):// rather than file://.',
    rotateTitle:'Please rotate to portrait', rotateMsg:'KURABELL Workout Log is designed for portrait orientation.'
  };
  document.documentElement.lang = BOOT_JA ? 'ja' : 'en';
  (function(){
    var set = function(id, text){ var e = document.getElementById(id); if (e) e.textContent = text; };
    set('bootmsg', BT.loading);
    set('retry', BT.retry);
    set('rotate-title', BT.rotateTitle);
    set('rotate-msg', BT.rotateMsg);
  })();

  function bootMsg(t){ var e=document.getElementById('bootmsg'); if(e) e.textContent=t; }
  function bootFail(title, detail){
    var s=document.getElementById('spin'); if(s) s.style.display='none';
    bootMsg(title);
    var e=document.getElementById('booterr');
    if(e && detail){ e.style.display='block'; e.textContent=detail; }
    var r=document.getElementById('retry'); if(r) r.style.display='block';
  }
  window.addEventListener('error', function(ev){
    if (!document.getElementById('boot')) return;
    var m = ev.message || (ev.error && ev.error.message) || String(ev);
    bootFail(BT.onError, m + (ev.filename ? ('\n' + ev.filename + ':' + ev.lineno) : ''));
  });

  // ---- ライブラリ読み込み(リポジトリ同梱のローカルファイルから。CDN不使用) ----
  var LIBS = [
    { key:'react',    urls:['vendor/react.production.min.js'] },
    { key:'reactdom', urls:['vendor/react-dom.production.min.js'] },
    { key:'proptypes',urls:['vendor/prop-types.min.js'] },
    { key:'recharts', urls:['vendor/recharts.js'] },
    { key:'babel',    urls:['vendor/babel.min.js'] },
    // ドメインロジック(純粋関数)。テストで使い回すため#appsrcの外へ切り出したもの。
    { key:'i18n',       urls:['src/domain/i18n.js'] },
    { key:'units',      urls:['src/domain/units.js'] },
    { key:'oneRm',      urls:['src/domain/oneRm.js'] },
    { key:'storage',    urls:['src/domain/storage.js'] },
    { key:'backupValidation', urls:['src/domain/backupValidation.js'] },
    { key:'volume',     urls:['src/domain/volume.js'] },
    { key:'restNotifications', urls:['src/domain/restNotifications.js'] },
    // iOS版のSQLite永続化層。Web版では何もしない(nativeSqliteDriver()がnullを返すだけ)。
    { key:'dbSchema',    urls:['src/domain/db/schema.js'] },
    { key:'dbMigration', urls:['src/domain/db/migration.js'] },
    { key:'dbWorkoutStore', urls:['src/domain/db/workoutStore.js'] },
    { key:'dbCapacitorSqliteDriver', urls:['src/domain/db/capacitorSqliteDriver.js'] }
  ];

  function loadOne(urls, i){
    return new Promise(function(resolve, reject){
      if (i >= urls.length) return reject(new Error(BT.noSource + urls[0]));
      var s = document.createElement('script');
      s.src = urls[i];
      s.onload = resolve;
      s.onerror = function(){ loadOne(urls, i+1).then(resolve, reject); };
      document.head.appendChild(s);
    });
  }

  (async function(){
    try {
      bootMsg(BT.libs);
      for (var k=0; k<LIBS.length; k++) { await loadOne(LIBS[k].urls, 0); }

      if (typeof React === 'undefined')     throw new Error('React' + BT.missing);
      if (typeof ReactDOM === 'undefined')  throw new Error('ReactDOM' + BT.missing);
      if (typeof Recharts === 'undefined')  throw new Error('Recharts' + BT.missing);
      if (typeof Babel === 'undefined')     throw new Error('Babel' + BT.missing);

      bootMsg(BT.prep);
      var src = document.getElementById('appsrc').textContent;
      var out = Babel.transform(src, { presets: ['react'] }).code;
      // 実行
      (0, eval)(out);
    } catch (e) {
      bootFail(BT.cantStart, (e && e.message ? e.message : String(e)) + BT.hint);
    }
  })();
</script>

// 種目設定の上書き(ユーザーが変更した内蔵種目の設定を保持する)
// 元データは書き換えず、この上書きを重ねて解決するので「元に戻す」も可能。
let EXERCISE_OVERRIDES = {};
const setExerciseOverrides_module = (obj) => { EXERCISE_OVERRIDES = obj || {}; };
const baseLookup = (name) => DB_BY_NAME[name] || DB_BY_NAME[ALIASES[name]] || null;
const dbLookup = (name) => {
  const base = baseLookup(name);
  const ov = EXERCISE_OVERRIDES[name];
  if (!base && !ov) return null;
  return { ...(base || { n: name }), ...(ov || {}) };
};

// 「片手=ダンベル」判定: 種目マスターに登録があればそれを最優先(保存済みの誤フラグを上書き)
const resolveIsDb = (name, storedIsDb) => {
  const k = dbLookup(name);
  return k ? !!k.db : !!storedIsDb;
};
// 可動域係数: 集計ボリュームのみに適用(判定・1RM・PRには影響させない)。
// シュラッグ/カーフレイズ/リストカール=0.5、その他=1.0。保存値(ユーザー調整)があれば優先。
// 種目に応じた推奨の増加幅(kg)。小さな単関節種目に2.5kgは大きすぎるため実態に合わせる。
const recommendedIncrement = (name, fallback = 2.5) => {
  const k = dbLookup(name);
  if (!k) return fallback;
  if (k.inc) return k.inc;                       // 種目ごとの明示指定を最優先
  if (k.eq === "マシン") return 5;                // マシンは5kg刻みが多い
  if (k.t === "I") return k.db ? 1 : 2.5;        // 単関節: ダンベルは片手1kg、他は2.5kg
  return k.db ? 2 : 2.5;                          // 多関節: ダンベル片手2kg、バーベル等2.5kg
};

const resolveRom = (name, storedRom) => {
  const v = parseFloat(storedRom);
  if (!isNaN(v) && v > 0) return v;
  const k = dbLookup(name);
  return k?.rom ?? 1.0;
};

// タップで全選択(既存文字を消す手間を省く)
const selectOnFocus = (e) => {
  const el = e.target;
  const sel = () => {
    try {
      el.select();
      // iOSはselect()だけだと効かないことがあるため範囲指定も行う
      if (el.setSelectionRange) el.setSelectionRange(0, (el.value || "").length);
    } catch { /* noop */ }
  };
  sel();
  setTimeout(sel, 0);
  setTimeout(sel, 50);
};

// 数値入力: iOSでは全選択(select)がタップで解除されるため、
// 「フォーカス後の最初の入力で既存の値を置き換える」方式にして確実に上書きできるようにする。
// onChange は通常のinputと同じく event を受け取るので、既存の呼び出し側はそのまま使える。
function NumInput({ value, onChange, onFocus, onBlur, inputMode = "decimal", style, ...rest }) {
  const pristine = useRef(false);
  return (
    <input
      type="text"
      inputMode={inputMode}
      value={value}
      style={style}
      onFocus={(e) => { pristine.current = true; selectOnFocus(e); if (onFocus) onFocus(e); }}
      onChange={(e) => {
        let v = e.target.value;
        if (pristine.current) {
          pristine.current = false;
          const old = String(value ?? "");
          // 全選択が効かず既存値に追記された場合は、今打った分だけを残す
          if (old && v.length > old.length) {
            if (v.startsWith(old)) v = v.slice(old.length);
            else if (v.endsWith(old)) v = v.slice(0, v.length - old.length);
          }
        }
        if (onChange) onChange({ target: { value: v } });
      }}
      onBlur={(e) => { pristine.current = false; if (onBlur) onBlur(e); }}
      {...rest}
    />
  );
}

// - 開いたらモーダル内の最初の操作可能要素へフォーカス
// - Tabキーをモーダル内に留める(フォーカストラップ)

// - 閉じたら開く前にフォーカスしていた要素へ戻す
// active自体は呼び出し側で条件計算してよいが、フック呼び出し自体は(Reactの規則により)
// 常に同じ順序で実行する必要があるため、モーダルがJSX上で条件レンダーされていてもこのフックはトップレベルで呼ぶ。
function useModalA11y(active, onClose, containerRef) {
  useEffect(() => {
    if (!active) return;
    const container = containerRef.current;
    const prevFocused = document.activeElement;
    const focusables = () => container
      ? Array.from(container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(el => !el.disabled)
      : [];
    const first = focusables()[0];
    (first || container)?.focus?.();
    const onKeyDown = (e) => {
      if (e.key === "Escape") { onClose(); return; }
      if (e.key !== "Tab") return;
      const els = focusables();
      if (els.length === 0) return;
      const firstEl = els[0], lastEl = els[els.length - 1];
      if (e.shiftKey && document.activeElement === firstEl) { e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); firstEl.focus(); }
    };
    document.addEventListener("keydown", onKeyDown);
    return () => {
      document.removeEventListener("keydown", onKeyDown);
      if (prevFocused && prevFocused.focus) prevFocused.focus();
    };
  }, [active]);
}

// マウント後の例外で画面が白くならないよう捕捉する(記録データはlocalStorageに残るので再読み込みで復帰できる)
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Uncaught error in App:", error, info);
  }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: 24, textAlign: "center", background: C.bg, color: C.text }}>
        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 34, letterSpacing: 1 }}>
          KURABELL
        </div>
        <div style={{ color: C.muted, fontSize: 13, lineHeight: 1.7 }}>
          {t("err.crashTitle")}<br />{t("err.crashHint")}
        </div>
        <div style={{ color: "#F5B8B3", background: "#3A2224", borderRadius: 10, padding: 12, fontSize: 13, textAlign: "left", maxWidth: 420, wordBreak: "break-all", lineHeight: 1.7 }}>
          {this.state.error.message || String(this.state.error)}
        </div>
        <button onClick={() => window.location.reload()} style={{ background: C.red, color: "#fff", border: "none", borderRadius: 10, padding: "12px 20px", fontSize: 14, fontWeight: 700, fontFamily: "inherit", cursor: "pointer" }}>
          {t("common.reload")}
        </button>
      </div>
    );
  }
}

  const unit = useMemo(() => setUnit(resolveUnit(profile.unit, navigator.language)), [profile.unit]);

  const [today, setToday] = useState([]);
  const [search, setSearch] = useState("");
  const [pickerMuscle, setPickerMuscle] = useState(null);

  const [insertAt, setInsertAt] = useState(null);     // 種目を挿入する位置(nullなら末尾)
  const [histMode, setHistMode] = useState("list"); // list | calendar
  const [calMonth, setCalMonth] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [selectedDate, setSelectedDate] = useState(null); // "YYYY-M-D"
  const [editDay, setEditDay] = useState(null);
  const [pickingSplit, setPickingSplit] = useState(false); // trueで分割選択(プリセット/新規作成)画面を表示
  const [backupMsg, setBackupMsg] = useState("");
  const [lastBackupAt, setLastBackupAt] = useState(null); // 最後にバックアップした日時(ISO)
  const [hasPreImportSnapshot, setHasPreImportSnapshot] = useState(false); // バックアップ復元前のデータ退避が残っているか
  const [hideBackupNag, setHideBackupNag] = useState(false); // このセッション中は非表示
  const [offerSaveAsMenu, setOfferSaveAsMenu] = useState(null); // 分割未設定で初めて記録を保存した直後、その記録{name, muscles, exercises}をメニュー化するか尋ねる
  const [editWorkout, setEditWorkout] = useState(null); // 編集中の記録 {index, draft}
  // 記録中の入力値(today・編集中の記録)は保存前の文字列で、表示単位のまま持っている。
  // 単位を切り替えたらここで読み替えないと「135」がlbからkgに化けて別物の記録になる。
  // 起動時の読み込み(loadedがfalse→true)では換算しない。下書きは切り替え前の単位で
  // 保存されており、profile.unitも同時に復元されるので、すでに辻褄が合っているため。
  useEffect(() => {
    // 読み込みが終わるまでは記録もしない。読み込み前の既定値(端末の言語から決めた単位)を
    // prevとして覚えてしまうと、保存済みのprofile.unitが入った瞬間に「ユーザーが切り替えた」

    if (!loaded) return;
    const prev = prevUnitRef.current;
    prevUnitRef.current = unit;
    if (prev == null || prev === unit) return;
    const conv = (sets) => sets.map(s => ({ ...s, weight: convWeightStr(s.weight, prev, unit) }));
    setToday(t => t.map(ex => ({ ...ex, sets: conv(ex.sets) })));
    setEditWorkout(ew => ew && ({ ...ew, draft: { ...ew.draft,
      exercises: ew.draft.exercises.map(ex => ({ ...ex, sets: conv(ex.sets) })) } }));
  }, [unit, loaded]);
  const [editAddSearch, setEditAddSearch] = useState("");  // 履歴編集で種目を追加するときの検索語
  const [exSettingSearch, setExSettingSearch] = useState(""); // 設定タブの種目検索
  const [expandedSettingsMuscles, setExpandedSettingsMuscles] = useState(() => new Set()); // 設定タブでアコーディオン展開中の部位

  // タイマー
  const [startAt, setStartAt] = useState(null);   // セッション開始(ms)
  const [elapsed, setElapsed] = useState(0);
  const [restStartAt, setRestStartAt] = useState(null); // インターバル開始(ms)。null=停止中
  const [restElapsed, setRestElapsed] = useState(0);

  // AIモーダル
  const [draftRestored, setDraftRestored] = useState(false); // 復元した旨の通知

  // ---- 入力途中の記録を自動保存 ----
  // 他アプリに切り替えてブラウザが破棄されても、記録が消えないようにする。
  useEffect(() => {
    if (!loaded) return; // 初期読み込み前は書かない
    // セット入力のたびに毎回書き込むと重いので、入力が止まってから書き込む(デバウンス)
    const t = setTimeout(() => {
      (async () => {
        try {
          if (today.length === 0 && !startAt) {
            await store.del(DRAFT_KEY); // 記録がなければ下書きも消す
          } else {
            await store.set(DRAFT_KEY, JSON.stringify({
              today, startAt, restStartAt, savedAt: Date.now(),
            }));
          }
        } catch { /* 保存できなくても操作は続行 */ }
      })();
    }, 800);
    return () => clearTimeout(t);
  }, [today, startAt, restStartAt, loaded]);

  // 画面を離れる直前にも保存(iOSでのバックグラウンド破棄対策)
  useEffect(() => {
    const flush = () => {
      if (today.length === 0 && !startAt) return;
      try {
        // 同期的に書けるlocalStorageへ直接退避
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ today, startAt, restStartAt, savedAt: Date.now() }));
      } catch { /* noop */ }
    };
    const onHide = () => { if (document.visibilityState === "hidden") flush(); };
    document.addEventListener("visibilitychange", onHide);
    window.addEventListener("pagehide", flush);
    return () => {
      document.removeEventListener("visibilitychange", onHide);
      window.removeEventListener("pagehide", flush);
    };
  }, [today, startAt, restStartAt]);

  // ブラウザの容量逼迫時に記録がストレージごと消去されないよう、永続化を要求する(対応ブラウザのみ・拒否されても致命的ではない)
  useEffect(() => {
    if (navigator.storage?.persist) {
      navigator.storage.persist().catch(() => {});
    }
  }, []);

  // ---- 読み込み ----
  useEffect(() => {
    (async () => {
      try {
        const res = await store.get(STORAGE_KEY);
        if (res?.value) {
          let p;
          try { p = JSON.parse(res.value); }
          catch { throw new Error(t("err.jsonBroken")); }
          // 壊れたデータのまま画面に出さない(白紙の記録に見えて実は消えていない、を防ぐ)
          validateWorkoutsShape(extractWorkoutsArray(p));
          if (Array.isArray(p)) setWorkouts(migrateWorkouts(p));
          else {
            setWorkouts(migrateWorkouts(p.workouts));
            setSplit(migrateSplit(p.split));
            setProfile(defaultProfile(p.profile));
            setRecentNames(p.recentNames || []);
            setCustomExercises(p.customExercises || []);
            setExerciseNotes(p.exerciseNotes || {});
            setExerciseOverrides(p.exerciseOverrides || {});
            setExerciseOverrides_module(p.exerciseOverrides || {});
            setLastBackupAt(p.lastBackupAt || null);
            if (p.guideSeen) setGuideSeen(true);
          }
        }
      } catch (e) {
        // データが存在しない(res?.valueがfalsy)場合はここに来ない = 初回起動として無音のまま。
        // ここに来るのは「データはあるが読めない」場合なので、消えたように見えて実は残っていることを伝える。
        setError(t("err.loadFailed", { msg: e?.message || t("err.dataCorrupt") }));
      }

      // 入力途中の記録を復元(24時間以内のものだけ)
      try {
        const d = await store.get(DRAFT_KEY);
        if (d?.value) {
          const draft = JSON.parse(d.value);
          const fresh = draft.savedAt && (Date.now() - draft.savedAt) < 24 * 3600 * 1000;
          if (fresh && Array.isArray(draft.today) && draft.today.length > 0) {
            setToday(draft.today);
            if (draft.startAt) setStartAt(draft.startAt);
            if (draft.restStartAt) setRestStartAt(draft.restStartAt);
            setDraftRestored(true);
            setView("log"); // 記録の続きから始められるように記録タブへ
          } else if (!fresh) {
            await store.del(DRAFT_KEY); // 古い下書きは破棄
          }
        }
      } catch { /* 下書きなし */ }

      // バックアップ復元前のスナップショットが残っていれば、設定タブから戻せるようにする
      try {
        const snap = await store.get(PRE_IMPORT_BACKUP_KEY);
        if (snap?.value) setHasPreImportSnapshot(true);
      } catch { /* noop */ }

      setLoaded(true);
    })();
  }, []);

  const persist = async (patch) => {
    const next = {
      workouts: patch.workouts ?? workouts,
      split: patch.split === undefined ? split : patch.split,
      profile: patch.profile ?? profile,
      recentNames: patch.recentNames ?? recentNames,
      customExercises: patch.customExercises ?? customExercises,
      exerciseNotes: patch.exerciseNotes ?? exerciseNotes,
      exerciseOverrides: patch.exerciseOverrides ?? exerciseOverrides,
      lastBackupAt: patch.lastBackupAt !== undefined ? patch.lastBackupAt : lastBackupAt,
      guideSeen: patch.guideSeen !== undefined ? patch.guideSeen : guideSeen,
    };
    if (patch.workouts !== undefined) setWorkouts(next.workouts);
    if (patch.split !== undefined) setSplit(next.split);
    if (patch.profile !== undefined) setProfile(next.profile);
    if (patch.recentNames !== undefined) setRecentNames(next.recentNames);
    if (patch.customExercises !== undefined) setCustomExercises(next.customExercises);
    if (patch.exerciseNotes !== undefined) setExerciseNotes(next.exerciseNotes);
    if (patch.exerciseOverrides !== undefined) { setExerciseOverrides(next.exerciseOverrides); setExerciseOverrides_module(next.exerciseOverrides); }
    if (patch.lastBackupAt !== undefined) setLastBackupAt(next.lastBackupAt);
    if (patch.guideSeen !== undefined) setGuideSeen(next.guideSeen);
    // 画面上のstateは既に更新済み(楽観的更新)。書き込みが失敗しても巻き戻さない
    // (別の操作で上書きされた方が「保存できたと見せかけて実は消えていた」より安全なため)。
    // 代わりに保存状態を可視化し、失敗時は同じ内容でいつでも再試行できるようにする。
    setSaveStatus("saving");
    try {
      await store.set(STORAGE_KEY, JSON.stringify(next));
      setSaveStatus("saved");
    } catch {
      setSaveStatus("error");
      setError(t("err.saveFailed"));
    }
  };

  // 保存に失敗した後の再試行。楽観的更新で画面には既に反映されている現在のstateを、
  // そのまま改めて書き込む(patchを覚えておく必要がない)。
  const retrySave = async () => {
    const next = { workouts, split, profile, recentNames, customExercises, exerciseNotes, exerciseOverrides, lastBackupAt, guideSeen };
    setSaveStatus("saving");
    try {
      await store.set(STORAGE_KEY, JSON.stringify(next));
      setSaveStatus("saved");
      setError("");
    } catch {
      setSaveStatus("error");
      setError(t("err.saveRetryFailed"));
    }
  };

  // 保存成功の表示は一定時間で消す(常時出ていると煩わしいため)。失敗表示は再試行されるまで残す。
  useEffect(() => {
    if (saveStatus !== "saved") return;
    const t = setTimeout(() => setSaveStatus("idle"), 2000);
    return () => clearTimeout(t);
  }, [saveStatus]);

  // ---- 経過タイマー ----
  useEffect(() => {
    if (!startAt) return;
    const id = setInterval(() => setElapsed(Math.floor((Date.now() - startAt) / 1000)), 1000);
    return () => clearInterval(id);
  }, [startAt]);

  // ---- 通知音(Web Audio) ----
  // iOSは動画撮影・電話・他アプリの音声再生でAudioContextを中断/破棄する。
  // 壊れていたら作り直す方式にして、鳴らなくなるのを防ぐ。
  const soundOn = profile.soundOn !== false;
  const audioRef = useRef(null);
  const firedMinRef = useRef(0); // 何分の通知まで鳴らしたか(再レンダーでも保持)

  // ---- 休憩タイマーのローカル通知 ----
  // 通知が使えるなら分刻みのbeep()は鳴らさず通知に一本化する(前面でもバナーが出るため
  // 二重に知らせてしまう。Apple Watchへのハプティックも1回で済む)。
  // 許可されていない/Web版では従来どおりbeep()にフォールバックする。
  const [notifyPerm, setNotifyPerm] = useState("unavailable"); // granted | denied | prompt | unavailable
  const notifyGranted = notifyPerm === "granted";
  const askedNotifyRef = useRef(false); // 許可要求はセッション中1回だけ
  // 通知APIの呼び出しを発行順に直列化する。startRest()は重量・回数のonBlurから連続発火し
  // restStartAtが短時間に何度も変わるため、直列化しないと前の実行のcancelが後の実行の
  // scheduleを追い越して消してしまう(起動時の「初回レンダーのcancel」が下書き復元の
  // scheduleを消す経路が実在する)。
  const notifyQueueRef = useRef(Promise.resolve());
  const runNotify = (fn) => {
    notifyQueueRef.current = notifyQueueRef.current.then(fn).catch(() => {});
    return notifyQueueRef.current;
  };

  // 使える状態のAudioContextを返す(壊れていれば再生成)
  const getAudioCtx = () => {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    let ctx = audioRef.current;
    // closed / interrupted(iOS独自)は再生成が必要
    if (!ctx || ctx.state === "closed" || ctx.state === "interrupted") {
      try { if (ctx && ctx.state !== "closed") ctx.close(); } catch { /* noop */ }
      try { ctx = new Ctx(); audioRef.current = ctx; } catch { return null; }
    }
    return ctx;
  };

  // ユーザー操作のたびに解錠を試みる(初回だけでなく、中断からの復帰にも効く)
  useEffect(() => {
    const unlock = () => {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        if (ctx.state === "suspended") ctx.resume();
        const osc = ctx.createOscillator(), g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.01);
      } catch { /* 無視 */ }
    };
    // once を付けず、操作のたびに実行して中断からの復帰を確実にする
    document.addEventListener("touchend", unlock);
    document.addEventListener("click", unlock);
    // 画面に戻ったときも復旧を試みる(動画撮影から戻った直後など)
    const onVisible = () => { if (document.visibilityState === "visible") unlock(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      document.removeEventListener("touchend", unlock);
      document.removeEventListener("click", unlock);
      document.removeEventListener("visibilitychange", onVisible);
    };
  }, []);

  const beep = (times = 1) => {
    if (!soundOn) return;
    try {
      // 指定したAudioContext上で実際にビープを鳴らす(既存/作り直し後のどちらでも使えるよう分離)
      const playOn = (c) => {
        for (let i = 0; i < times; i++) {
          const t = c.currentTime + 0.03 + i * 0.32;
          // 基音+倍音を重ねて、小さいスピーカーでも聞こえやすくする
          [880, 1320].forEach((freq, fi) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = fi === 0 ? "square" : "sine"; // 基音は矩形波でよく通る
            osc.frequency.setValueAtTime(freq, t);
            const peak = fi === 0 ? 0.9 : 0.4;
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(peak, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
            osc.connect(gain); gain.connect(c.destination);
            osc.start(t); osc.stop(t + 0.28);
          });
        }
      };
      const recreateAndPlay = () => {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          const fresh = new Ctx();
          audioRef.current = fresh;
          fresh.resume().then(() => playOn(fresh)).catch(() => {});
        } catch { /* noop */ }
      };
      const ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === "running") {
        playOn(ctx);
      } else {
        // 停止中は復帰を待つ。iOSはバックグラウンド復帰直後、resume()が解決も失敗もせず
        // ハングすることがあるため、一定時間で見切りをつけて作り直す(タイムアウト側の
        // フォールバックが誤って二重発火しないよう settled フラグで一度だけに制御)。
        let settled = false;
        ctx.resume().then(() => {
          if (settled) return;
          settled = true;
          playOn(ctx);
        }).catch(() => {
          if (settled) return;
          settled = true;
          recreateAndPlay();
        });
        setTimeout(() => {
          if (settled) return;
          settled = true;
          recreateAndPlay();
        }, 400);
      }
      // 音が出せない場合の保険としてバイブも併用
      if (navigator.vibrate) navigator.vibrate(times === 1 ? [300] : [200, 120, 200, 120, 200]);
    } catch { /* 音が出せない環境では無視 */ }
  };

  // ---- 起動時に前回の予約通知を掃除する ----
  // 下書きは today.length === 0 && !startAt のとき保存されず、復元条件も today.length > 0。
  // そのため「セット未入力のままヘッダーからインターバルを開始 → アプリを終了」すると、
  // アプリ側が存在を知らない通知だけが後から鳴る。宣言順でタイマーeffectより先に置き、
  // 同じキューを通すことで「掃除 → 下書き復元によるschedule」の順序を保証する。
  useEffect(() => {
    if (!loaded) return;
    runNotify(async () => {
      await cancelRestNotifications();
      await clearDeliveredRestNotifications();
    });
    checkRestNotificationPermission().then(setNotifyPerm);
  }, [loaded]);

  // ---- インターバルタイマー(カウントアップ・1分ごとに知らせる) ----
  useEffect(() => {
    if (restStartAt == null) {
      firedMinRef.current = 0;
      runNotify(() => cancelRestNotifications());
      return;
    }
    // 通知はOS側が発火するので、アプリがバックグラウンドでも届く(この機能の主目的)。
    // 許可要求はインターバルを実際に始めたときだけ、セッション中1回。設定トグルの操作で
    // 出すと、休憩中にトグルしたユーザーへ唐突にダイアログが出るため連動させない。
    if (soundOn && restNotificationsAvailable()) {
      runNotify(async () => {
        let ok = notifyGranted;
        if (!ok && !askedNotifyRef.current) {
          askedNotifyRef.current = true;
          ok = await ensureRestNotificationPermission();
          if (ok !== notifyGranted) {
            // 状態が変わるとnotifyGrantedがdepsのこのeffectが再実行され、そちらで
            // scheduleされる。ここでも続けて呼ぶと同じ内容を二重に予約してしまうので返す。
            setNotifyPerm(ok ? "granted" : "denied");
            return;
          }
        }
        if (!ok) return;
        // このrestStartAtは、この関数がenqueueされた時点の値を閉じ込めている。
        // 許可ダイアログの応答待ち中に次のセットが記録されrestStartAtが更新された場合、
        // 一瞬古い基準時刻でscheduleされるが、runNotifyの直列化により直後にそのeffectの
        // 再実行(新しいrestStartAtでの呼び出し)が続くため、届く前に正しい内容へ上書きされる。
        await scheduleRestNotifications(restStartAt, Date.now(), {
          title: t("rest.notifyTitle"),
          body: (n) => t("rest.notifyBody", { n }),
        });
      });
    } else {
      runNotify(() => cancelRestNotifications());
    }
    const tick = () => {
      const sec = Math.floor((Date.now() - restStartAt) / 1000);
      setRestElapsed(sec);
      const min = Math.floor(sec / 60);
      // 1秒ごとの判定で分の境界を飛ばしても、未通知の分を確実に鳴らす
      if (min > firedMinRef.current) {
        firedMinRef.current = min;
        // 通知が届く環境では鳴らさない(通知と二重になるため)
        if (!notifyGranted) beep(min === 1 ? 1 : Math.min(min, 3)); // 経過が長いほど回数を増やす
      }
    };
    // 500msごとに判定して1分の取りこぼしを減らす(表示は秒単位)
    const id = setInterval(tick, 500);
    tick();
    const onVisible = () => {
      if (document.visibilityState !== "visible") return;
      tick();
      // 前面に戻ったら配信済みの通知を消す(通知センターに残骸を残さない)
      runNotify(() => clearDeliveredRestNotifications());
    };
    document.addEventListener("visibilitychange", onVisible);
    // cleanupで通知はキャンセルしない。バックグラウンド化はunmountを起こさないが、
    // 万一unmountで消すと「アプリを閉じていても知らせる」という目的そのものを損なう。
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVisible); };
  }, [restStartAt, soundOn, notifyGranted]);

  const startRest = () => { setRestStartAt(Date.now()); setRestElapsed(0); firedMinRef.current = 0; }; // 記録入力のたびに0から再スタート
  const stopRest = () => { setRestStartAt(null); setRestElapsed(0); firedMinRef.current = 0; setRestFull(false); };

  // 記録開始時にセッションタイマー始動
  const ensureStarted = () => { if (!startAt) { setStartAt(Date.now()); setElapsed(0); } };

  // ---- 集計 ----
  const daysSince = (iso) => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  const lastTrained = (muscle) => {
    for (let i = workouts.length - 1; i >= 0; i--)
      if (workouts[i].exercises.some(e => e.muscle === muscle || e.muscle === "全身")) return daysSince(workouts[i].date);
    return null;
  };
  // 計算本体は src/domain/volume.js へ移設(テストのため)。ここではprofile.bodyweightを
  // 閉じ込めた薄いラッパーとして、元の呼び出し方(引数1つ)をそのまま保つ。
  // window.のprefixは同名のローカル変数(このconst自体)への再帰を避けるために必要。
  const volumeDeps = { effWeight, resolveIsDb, resolveRom };
  const setVolume = (ex, s) => window.setVolume(ex, s, profile.bodyweight, volumeDeps);
  const workingSets = (ex) => window.workingSets(ex);
  const exVolume = (ex) => window.exVolume(ex, profile.bodyweight, volumeDeps);

  // ---- PR(自己ベスト)と推定1RM ----
  // 実効重量(ダンベルは両手・自重は体重換算)ベースで比較する
  const setEff = (ex, s) => effWeight(s.weight, resolveIsDb(ex.name, ex.isDb), ex.bwFactor ?? 0, ex.bwAtLog ?? profile.bodyweight);
  // 種目ごとの自己ベスト: {best1RM, bestWeight, date(1RM達成日), weightDate(重量PR達成日)}
  const prMap = useMemo(() => {
    const m = {};
    workouts.forEach(w => w.exercises.forEach(ex => {
      workingSets(ex).forEach(s => {
        if (s.assisted) return; // 補助ありは自己ベストに含めない
        if (!s.reps || s.reps < 1) return; // 実際に挙げていないセットは対象外
        const eff = setEff(ex, s);
        const rm = est1RM(eff, s.reps);
        const cur = m[ex.name] || { best1RM: 0, bestWeight: 0, date: null, weightDate: null, reps: 0, weight: 0 };
        if (rm > cur.best1RM) { cur.best1RM = rm; cur.date = w.date; cur.reps = s.reps; cur.weight = s.weight; }
        if (eff > cur.bestWeight) { cur.bestWeight = eff; cur.weightDate = w.date; }
        m[ex.name] = cur;
      });
    }));
    return m;
  }, [workouts, profile.bodyweight, exerciseOverrides]);

  // 記録中の種目の現在の最高推定1RM(PR更新判定に使う。補助ありは除外)
  const liveBest1RM = (ex) => {
    const isDb = resolveIsDb(ex.name, ex.isDb);
    // 「あと何回できた?」を入力したセットのみ = 実際に行ったセット
    return ex.sets.filter(s => !s.warmup && !s.assisted && s.rir !== "" && s.rir != null).reduce((max, s) => {
      const eff = effWeight(fromU(s.weight), isDb, ex.bwFactor || 0, profile.bodyweight);
      return Math.max(max, est1RM(eff, Math.round(num(s.reps))));
    }, 0);
  };
  // 記録中の種目の最大重量(実際に挙げた重量。回数1以上のセットのみ)
  const liveMaxWeight = (ex) => {
    const isDb = resolveIsDb(ex.name, ex.isDb);
    return ex.sets.filter(s => !s.warmup && !s.assisted && Math.round(num(s.reps)) > 0 && s.rir !== "" && s.rir != null).reduce((max, s) => {
      return Math.max(max, effWeight(fromU(s.weight), isDb, ex.bwFactor || 0, profile.bodyweight));
    }, 0);
  };

  // 種目の過去履歴(新しい順)。記録画面で前回までの内容を参照するのに使う
  const exerciseHistory = (name, limit = 5) => {
    const out = [];
    for (let i = workouts.length - 1; i >= 0 && out.length < limit; i--) {
      const w = workouts[i];
      const ex = w.exercises.find(e => e.name === name);
      if (ex) out.push({ date: w.date, session: w.session, ex, volume: exVolume(ex) });
    }
    return out;
  };

  // 直近7日 / その前の7日(先週比較用) 部位別 セット数+ボリューム
  const weekly = useMemo(() => {
    const acc = {}, prevAcc = {};
    const cutoff = Date.now() - 7 * 86400000, prevCutoff = Date.now() - 14 * 86400000;
    let totalVol = 0, prevTotalVol = 0;
    workouts.forEach(w => {
      const t = new Date(w.date).getTime();
      const inThisWeek = t >= cutoff;
      const inPrevWeek = t >= prevCutoff && t < cutoff;
      if (!inThisWeek && !inPrevWeek) return;
      w.exercises.forEach(ex => {
        if (!ex.muscle) return;
        const vol = exVolume(ex);
        if (inThisWeek) {
          if (!acc[ex.muscle]) acc[ex.muscle] = { sets: 0, vol: 0 };
          acc[ex.muscle].sets += workingSets(ex).length;
          acc[ex.muscle].vol += vol;
          totalVol += vol;
        } else {
          if (!prevAcc[ex.muscle]) prevAcc[ex.muscle] = { vol: 0 };
          prevAcc[ex.muscle].vol += vol;
          prevTotalVol += vol;
        }
      });
    });
    return { byMuscle: acc, prevByMuscle: prevAcc, totalVol, prevTotalVol };
  }, [workouts, profile.bodyweight, exerciseOverrides]);

  const todayDay = split ? split.days[split.cursor % split.days.length] : null;
  const muscleMatchesDay = (muscle, day) => !!day && (day.muscles.includes("全身") || muscle === "全身" || day.muscles.includes(muscle));

  // 今日の暫定ボリューム(記録中・ウォームアップ除外・可動域係数あり)
  // 今日の暫定ボリューム: 「あと何回できた?」を入力したセットだけを完了とみなして集計
  // (重量・回数を打った時点では加算せず、余力の入力=そのセット完了 とする)
  const isDoneSet = (s) => !s.warmup && s.rir !== "" && s.rir != null;
  const liveVolume = useMemo(() => today.reduce((a, ex) => {
    const isDb = resolveIsDb(ex.name, ex.isDb);
    const rom = resolveRom(ex.name, ex.rom);
    return a + ex.sets.filter(isDoneSet).reduce((b, s) => b + effWeight(fromU(s.weight), isDb, ex.bwFactor || 0, profile.bodyweight) * Math.round(num(s.reps)) * rom, 0);
  }, 0), [today, profile.bodyweight, exerciseOverrides, unit]);

  // 比較基準は「同じセッション」の直近3回の平均。前回1回だけを基準にすると、
  // たまたま不調だった日・種目を減らした日が基準になってしまうため平均を使う。
  // 同名セッションの記録が1件も無ければ、セッションを問わず全記録の直近3回にフォールバックする
  // (avgLabelもcompare.recentDay/compare.recentで出し分けている)。
  const compareBase = useMemo(() => {
    if (workouts.length === 0) return null;
    const sameList = todayDay ? workouts.filter(w => w.session === todayDay.name) : [];
    const list = sameList.length > 0 ? sameList : workouts;
    const volOf = (w) => w.exercises.reduce((a, ex) => a + exVolume(ex), 0); // 保存値ではなく常に再計算
    const recent = list.slice(-3);
    const avg = recent.reduce((a, w) => a + volOf(w), 0) / recent.length;
    return {
      avg,
      avgLabel: sameList.length > 0 ? t("compare.recentDay", { n: recent.length, day: dayName(todayDay.name) }) : t("compare.recent", { n: recent.length }),
    };
  }, [workouts, split, profile.bodyweight, exerciseOverrides, lang]);

  // 上部バーのボリュームタップで開く「同一分割の履歴一覧」用データ(新しい順)
  const sameSplitSessions = useMemo(() => {
    if (!todayDay) return [];
    return workouts
      .filter(w => w.session === todayDay.name)
      .map(w => ({ date: w.date, volume: w.exercises.reduce((a, ex) => a + exVolume(ex), 0), exercises: w.exercises }))
      .reverse();
  }, [workouts, split, profile.bodyweight, exerciseOverrides]);

  // 種目の判断材料: 前回のセット内容(RIR込み)と、同じ重量が何回続いているか
  const exerciseInsight = (name) => {
    const entries = [];
    for (let i = workouts.length - 1; i >= 0; i--) {
      const ex = workouts[i].exercises.find(e => e.name === name);
      if (ex) entries.push({ date: workouts[i].date, ex });
    }
    if (entries.length === 0) return null;

    const topOf = (ex) => {
      const ws = (ex.sets || []).filter(s => !s.warmup && !s.assisted && s.reps > 0);
      if (ws.length === 0) return null;
      return ws.reduce((best, s) => (s.weight > best.weight ? s : best), ws[0]);
    };

    const prev = entries[0];
    const prevTop = topOf(prev.ex);
    if (!prevTop) return null;

    // 同じトップ重量が何回連続しているか
    let streak = 0;
    for (const e of entries) {
      const t = topOf(e.ex);
      if (t && t.weight === prevTop.weight) streak++; else break;
    }

    // 直近のトップ重量の推移(古い順に最大4件)
    const trend = entries.slice(0, 4).map(e => topOf(e.ex)?.weight).filter(v => v != null).reverse();

    return {
      date: prev.date,
      sets: (prev.ex.sets || []).filter(s => !s.warmup),
      topWeight: prevTop.weight,
      topReps: prevTop.reps,
      topRir: prevTop.rir,
      isDb: resolveIsDb(name, prev.ex.isDb),
      streak,
      trend,
    };
  };

  // ---- 種目リスト(内蔵 + 保存済みカスタム) ----
  const allExercises = useMemo(
    () => [...EXERCISE_DB, ...customExercises].map(e => ({ ...e, ...(exerciseOverrides[e.n] || {}) })),
    [customExercises, exerciseOverrides]);
  const findExercise = (name) => allExercises.find(e => e.n === name) || dbLookup(name);
  const pickerList = useMemo(() => {
    // 今日の記録に既にある種目名は候補から外す(同名重複すると、履歴参照が
    // 名前ベースの.findのため一方のカードの記録が以後参照できなくなるため)
    const inToday = new Set(today.map(t => t.name));
    const notAdded = (e) => !inToday.has(e.n);
    const q = search.trim();
    if (q) return allExercises.filter(e => notAdded(e) && exMatches(e, q));
    if (pickerMuscle) return allExercises.filter(e => notAdded(e) && e.m === pickerMuscle);
    // 既定: 最近使った順 → 今日の部位 → 残り
    const rank = (e) => {
      const r = recentNames.indexOf(e.n);
      if (r >= 0) return r;                       // 0..n 最近ほど小
      if (todayDay && muscleMatchesDay(e.m, todayDay)) return 1000;
      return 2000;
    };
    return allExercises.filter(notAdded).sort((a, b) => rank(a) - rank(b));
  }, [search, pickerMuscle, todayDay, recentNames, allExercises, today]);

  // ---- 種目設定の引き継ぎ ----
  const lastConfig = (name) => {
    for (let i = workouts.length - 1; i >= 0; i--) {
      const ex = workouts[i].exercises.find(e => e.name === name);
      if (ex) return {
        repLow: ex.repLow ?? 8, repHigh: ex.repHigh ?? 12, targetRirLow: ex.targetRirLow ?? 1, targetRirHigh: ex.targetRirHigh ?? 2,
        increment: ex.increment ?? 2.5, muscle: ex.muscle ?? dbLookup(name)?.m ?? "",
        bwFactor: ex.bwFactor ?? dbLookup(name)?.bw ?? 0, isDb: resolveIsDb(name, ex.isDb), rom: resolveRom(name, ex.rom),
        lastWeight: Math.max(...ex.sets.map(s => s.weight)),
      };
    }
    const db = findExercise(name);
    return {
      repLow: num(profile.defTargetReps) || 8, repHigh: num(profile.defTargetReps) || 12,
      targetRirLow: db ? (db.t === "C" ? 1 : 0) : 1, targetRirHigh: db ? (db.t === "C" ? 3 : 2) : 2,
      increment: recommendedIncrement(name, num(profile.defIncrement) || 2.5), muscle: db?.m ?? customDraft.muscle ?? "", bwFactor: db?.bw ?? 0,
      isDb: db ? !!db.db : (customDraft.eq === "ダンベル"), rom: db?.rom ?? 1.0,
      lastWeight: null,
    };
  };

  // 種目名 → メニュー1項目。ベースは常に「同じ分割Dayの前回記録(重量・回数・セット数)」。
  const buildMenuItem = (name) => {
    // その種目を含む「同じセッション」の直近の記録を探す
    const prevEntry = [...workouts].reverse().find(w =>
      (!todayDay || w.session === todayDay.name) && w.exercises.some(e => e.name === name)
    ) || [...workouts].reverse().find(w => w.exercises.some(e => e.name === name));
    const prevEx = prevEntry?.exercises.find(e => e.name === name);
    const cfg = lastConfig(name);
    // 前回のセット構成(ウォームアップ・補助の指定込み)。常にこれをベースにする。
    const prevSets = prevEx ? prevEx.sets.map(s => ({
      weight: s.weight, reps: s.reps, warmup: !!s.warmup, assisted: !!s.assisted,
    })) : null;

    if (prevEx) {
      const workingW = prevSets.filter(x => !x.warmup).map(x => x.weight);
      return {
        type: "previous",
        reason: t("menu.reasonPrev", { date: prevEntry ? fmtDate(prevEntry.date) : t("menu.reasonPrevFallback") }),
        prescription: {
          name, muscle: prevEx.muscle ?? cfg.muscle, bwFactor: prevEx.bwFactor ?? cfg.bwFactor,
          isDb: resolveIsDb(name, prevEx.isDb), rom: prevEx.rom ?? cfg.rom ?? 1.0,
          weight: workingW.length ? Math.max(...workingW) : 0,
          prevSets, sets: prevSets.length,
          targetReps: prevSets.map(x => x.reps),
          repLow: prevEx.repLow ?? cfg.repLow, repHigh: prevEx.repHigh ?? cfg.repHigh,
          targetRirLow: prevEx.targetRirLow ?? cfg.targetRirLow, targetRirHigh: prevEx.targetRirHigh ?? cfg.targetRirHigh,
          increment: prevEx.increment ?? cfg.increment,
        },
      };
    }

    // 履歴がない種目は既定値で開始
    return {
      type: "new_start", reason: t("menu.reasonNew"),
      prescription: {
        name, muscle: cfg.muscle, bwFactor: cfg.bwFactor, isDb: cfg.isDb, rom: cfg.rom ?? 1.0,
        weight: 0,
        prevSets: null, sets: 1, targetReps: [0],
        repLow: cfg.repLow, repHigh: cfg.repHigh, targetRirLow: cfg.targetRirLow, targetRirHigh: cfg.targetRirHigh, increment: cfg.increment,
      },
    };
  };

  // 今日のセッションのメニュー(分割に登録した種目 > 前回同セッション > 部位一致の履歴)
  const autoMenu = useMemo(() => {
    if (!todayDay) return [];
    let names = [];
    if (todayDay.exercises && todayDay.exercises.length) {
      names = [...todayDay.exercises];
    } else {
      const lastSame = [...workouts].reverse().find(w => w.session === todayDay.name);
      if (lastSame) names = lastSame.exercises.map(e => e.name);
      else {
        const seen = new Set();
        [...workouts].reverse().forEach(w => w.exercises.forEach(ex => {
          if (!seen.has(ex.name) && muscleMatchesDay(ex.muscle, todayDay)) seen.add(ex.name);
        }));
        names = [...seen];
      }
    }
    return names.map(buildMenuItem);
  }, [split, workouts, profile.bodyweight, lang]);

  const startAutoMenu = () => {
    ensureStarted();
    setToday(autoMenu.map(it => {
      const p = it.prescription;
      // 前回のセット構成があればそれをそのまま、なければ目標回数で組む
      const sets = p.prevSets
        ? p.prevSets.map(s => ({ weight: wStr(s.weight), reps: String(s.reps), rir: "", warmup: !!s.warmup, ...(s.assisted ? { assisted: true } : {}) }))
        : p.targetReps.map(r => ({ weight: wStr(p.weight), reps: String(r), rir: "", warmup: false }));
      return { id: uid(), name: p.name, muscle: p.muscle, bwFactor: p.bwFactor, isDb: p.isDb, rom: p.rom ?? 1.0,
        repLow: p.repLow, repHigh: p.repHigh, targetRirLow: p.targetRirLow, targetRirHigh: p.targetRirHigh, increment: p.increment,
        formBroke: false, pain: false, sets };
    }));
  };

  // ---- 記録操作 ----
  // 指定した種目の前回記録があれば、セット構成ごと引き継ぐ
  // (同じ分割Dayでの記録を優先し、無ければ種目単位の直近記録を使う。履歴がなければ0から)
  const initialSetsFor = (name) => {
    const prevW = [...workouts].reverse().find(x => todayDay && x.session === todayDay.name && x.exercises.some(e => e.name === name))
      || [...workouts].reverse().find(x => x.exercises.some(e => e.name === name));
    const prevEx = prevW?.exercises.find(e => e.name === name);
    return prevEx
      ? prevEx.sets.map(x => ({ weight: wStr(x.weight), reps: String(x.reps), rir: "", warmup: !!x.warmup, ...(x.assisted ? { assisted: true } : {}) }))
      : [{ weight: "0", reps: "0", rir: "", warmup: false }];
  };
  const addExercise = (name, meta, at = insertAt) => {
    const n = (name || "").trim(); if (!n) return;
    ensureStarted();
    const cfg = meta ? { ...lastConfig(n), ...meta } : lastConfig(n);
    const w = cfg.lastWeight != null ? wStr(cfg.lastWeight) : "0";
    // 内蔵にもカスタムにも無い種目は、カスタム種目として永続登録(次回以降も一覧に出る)
    const known = allExercises.some(e => e.n === n);
    const nextCustom = known ? customExercises : [...customExercises, {
      n, m: cfg.muscle || "", eq: meta?.eq || customDraft.eq || "",
      t: "C", db: !!cfg.isDb, bw: cfg.bwFactor || 0, custom: true,
    }];
    const initialSets = initialSetsFor(n);
    const newEx = {
      id: uid(), name: n, repLow: cfg.repLow, repHigh: cfg.repHigh,
      targetRirLow: cfg.targetRirLow, targetRirHigh: cfg.targetRirHigh, increment: cfg.increment,
      muscle: cfg.muscle, bwFactor: cfg.bwFactor, isDb: cfg.isDb, rom: cfg.rom ?? 1.0, formBroke: false, pain: false,
      sets: initialSets,
    };
    // 挿入位置が指定されていればその位置へ、なければ末尾に追加
    setToday(t => {
