                    </div>

                    {/* 種目の登録(この日の固定メニュー) */}
                    {editing ? (
                      <div style={{ marginTop: 12, background: C.bg, borderRadius: 10, padding: 10 }}>
                        <div style={{ fontSize: 13, color: C.muted, marginBottom: 8 }}>この日にやる種目(登録すると自動メニューになります)</div>
                        {(d.exercises && d.exercises.length > 0) && (
                          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
                            {d.exercises.map(n => (
                              <button key={n} onClick={() => toggleDayExercise(i, n)} style={{ ...chip(true, C.red) }}>{n} ✕</button>
                            ))}
                          </div>
                        )}
                        <div style={{ maxHeight: 160, overflowY: "auto" }}>
                          {EXERCISE_DB.filter(e => d.muscles.length === 0 || muscleMatchesDay(e.m, d)).map(e => {
                            const on = (d.exercises || []).includes(e.n);
                            return (
                              <button key={e.n} onClick={() => toggleDayExercise(i, e.n)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, width: "100%", textAlign: "left", background: on ? C.surface2 : "transparent", border: `1px solid ${on ? C.blue : C.border}`, borderRadius: 8, padding: "8px 10px", marginBottom: 5, cursor: "pointer", color: C.text, fontSize: 13, fontFamily: "inherit" }}>
                                <span style={{ minWidth: 0 }}>{on ? "✓ " : ""}{exName(e.n)}</span>
                                <span style={{ color: C.muted, fontSize: 12, flexShrink: 0 }}>{muscleName(e.m)}・{eqName(e.eq)}</span>
                              </button>
                            );
                          })}
                          {d.muscles.length > 0 && EXERCISE_DB.filter(e => muscleMatchesDay(e.m, d)).length === 0 && (
                            <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: 8 }}>この部位の内蔵種目がありません。</div>
                          )}
                        </div>
                      </div>
                    ) : (d.exercises && d.exercises.length > 0) && (
                      <div style={{ marginTop: 8, fontSize: 13, color: C.muted }}>
                        種目: {d.exercises.join("、")}
                      </div>
                    )}

                    {goToLog && <div style={{ marginTop: 10, fontSize: 13, color: C.blue, fontWeight: 700 }}>タップして記録を始める →</div>}
                    {editing && <button onClick={() => removeDay(i)} style={{ ...btn("transparent", "#FF5A4E"), fontSize: 13, padding: "8px 0 0" }}>このDayを削除</button>}
                  </div>
                );
              })}
              <button onClick={addDay} style={{ ...btn(C.surface2, C.text), width: "100%", padding: 12, fontSize: 13, border: `1px dashed ${C.border}` }}>＋ Dayを追加</button>

              <div style={{ background: C.surface, borderRadius: 14, padding: 14, border: `1px solid ${C.border}`, marginTop: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
                  <h3 style={{ fontSize: 14, fontWeight: 900, margin: 0 }}>直近7日間の部位別</h3>
                  {weekly.totalVol > 0 && (
                    <div style={{ textAlign: "right" }}>
                      <span style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 18 }}>
                        {Math.round(toU(weekly.totalVol)).toLocaleString()}{uLabel()}
                      </span>
                      {weekly.prevTotalVol > 0 && (() => {
                        const pct = Math.round(((weekly.totalVol - weekly.prevTotalVol) / weekly.prevTotalVol) * 100);
                        return (
                          <span style={{ marginLeft: 6, fontSize: 13, fontWeight: 700, color: pct >= 0 ? C.green : C.red }}>
                            先週比{pct >= 0 ? "+" : ""}{pct}%
                          </span>
                        );
                      })()}
                    </div>
                  )}
                </div>
                {Object.keys(weekly.byMuscle).length === 0 ? <div style={{ color: C.muted, fontSize: 13 }}>種目に部位を設定して記録すると集計されます。</div>
                  : Object.entries(weekly.byMuscle).sort((a, b) => b[1].vol - a[1].vol).map(([m, v]) => {
                    const d = lastTrained(m);
                    const prevVol = weekly.prevByMuscle[m]?.vol || 0;
                    const pct = prevVol > 0 ? Math.round(((v.vol - prevVol) / prevVol) * 100) : null;
                    return (
                      <div key={m} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6, gap: 8 }}>
                        <span>{muscleName(m)}</span>
                        <span style={{ color: C.muted, textAlign: "right" }}>
                          <span style={{ color: C.yellow, fontWeight: 700 }}>{v.sets}セット</span>
                          <span style={{ marginLeft: 8 }}>{Math.round(toU(v.vol)).toLocaleString()}{uLabel()}</span>
                          {pct != null && (
                            <span style={{ marginLeft: 6, fontWeight: 700, color: pct >= 0 ? C.green : C.red }}>
                              {pct >= 0 ? "+" : ""}{pct}%
                            </span>
                          )}
                          {d != null && <span style={{ marginLeft: 8 }}>最終{d === 0 ? "今日" : `${d}日前`}</span>}
                        </span>
                      </div>
                    );
                  })}
              </div>
            </>
          )}
        </div>
      )}

      {/* ===== 履歴タブ ===== */}
      {view === "history" && (
        <div style={{ padding: "0 16px" }}>
          {offerSaveAsMenu && (
            <div style={{ background: C.surface, borderRadius: 14, padding: 14, border: `1px solid ${C.blue}`, marginBottom: 12 }}>
              <div style={{ fontSize: 13, lineHeight: 1.7, marginBottom: 10 }}>
                次回から今日の種目と前回記録を表示できます。この内容をメニューとして保存しますか?
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={applyOfferedMenu} style={{ ...btn(C.red), flex: 1, padding: 10, fontSize: 14 }}>保存する</button>
                <button onClick={dismissOfferedMenu} style={{ ...btn(C.surface2, C.muted), flex: 1, padding: 10, fontSize: 14 }}>今回はしない</button>
              </div>
            </div>
          )}
          {workouts.length > 0 && (
            <>
              {/* ボリューム推移(トータル / 部位別) */}
              <div style={{ background: C.surface, borderRadius: 14, padding: 14, border: `1px solid ${C.border}`, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, gap: 8 }}>
                  <h2 style={{ fontSize: 14, fontWeight: 900, margin: 0 }}>ボリューム推移</h2>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => setVolMode("total")} style={chip(volMode === "total")}>トータル</button>
                    <button onClick={() => setVolMode("weekly")} style={chip(volMode === "weekly")}>週別</button>
                    <button onClick={() => setVolMode("muscle")} style={chip(volMode === "muscle")}>部位別</button>
                  </div>
                </div>

                {volMode === "total" ? (
                  volumeTrend.length >= 2 ? (
                    <ResponsiveContainer width="100%" height={170}>
                      <LineChart data={volumeTrend} margin={{ top: 8, right: 8, left: -6, bottom: 0 }}>
                        <CartesianGrid stroke={C.border} strokeDasharray="3 3" />
                        <XAxis dataKey="date" stroke={C.muted} fontSize={11} tickLine={false} />
                        <YAxis stroke={C.muted} fontSize={11} tickLine={false} width={44} />
                        <Tooltip contentStyle={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 13, color: C.text }} formatter={v => [`${v.toLocaleString()}${uLabel()}`, "総ボリューム"]} />
                        <Line type="monotone" dataKey="総ボリューム" stroke={C.green} strokeWidth={2.5} dot={{ r: 3, fill: C.green }} />
                      </LineChart>
                    </ResponsiveContainer>
                  ) : <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: "20px 0" }}>2回以上記録すると推移が表示されます。</div>
                ) : volMode === "weekly" ? (
                  weeklyVolumeTrend.length >= 2 ? (
                    <ResponsiveContainer width="100%" height={170}>
                      <BarChart data={weeklyVolumeTrend} margin={{ top: 8, right: 8, left: -6, bottom: 0 }}>
                        <CartesianGrid stroke={C.border} strokeDasharray="3 3" />
                        <XAxis dataKey="date" stroke={C.muted} fontSize={11} tickLine={false} />
                        <YAxis stroke={C.muted} fontSize={11} tickLine={false} width={44} />
                        <Tooltip contentStyle={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 13, color: C.text }} formatter={v => [`${v.toLocaleString()}${uLabel()}`, "週合計"]} />
                        <Bar dataKey="総ボリューム" fill={C.blue} radius={[4, 4, 0, 0]} />
                      </BarChart>
                    </ResponsiveContainer>
                  ) : <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: "20px 0" }}>2週分以上記録すると推移が表示されます。</div>
                ) : trainedMuscles.length === 0 ? (
                  <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: "20px 0" }}>種目に部位を設定して記録すると部位別で表示されます。</div>
                ) : (
                  <>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
                      {trainedMuscles.map(m => <button key={m} onClick={() => setVolMuscle(m)} style={chip(volMuscle === m)}>{muscleName(m)}</button>)}
                    </div>
                    {muscleVolumeTrend.length >= 2 ? (
                      <ResponsiveContainer width="100%" height={170}>
                        <LineChart data={muscleVolumeTrend} margin={{ top: 8, right: 8, left: -6, bottom: 0 }}>
                          <CartesianGrid stroke={C.border} strokeDasharray="3 3" />
                          <XAxis dataKey="date" stroke={C.muted} fontSize={11} tickLine={false} />
                          <YAxis stroke={C.muted} fontSize={11} tickLine={false} width={44} />
                          <Tooltip contentStyle={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 13, color: C.text }} formatter={v => [`${v.toLocaleString()}${uLabel()}`, volMuscle]} />
                          <Line type="monotone" dataKey="ボリューム" stroke={C.blue} strokeWidth={2.5} dot={{ r: 3, fill: C.blue }} />
                        </LineChart>
                      </ResponsiveContainer>
                    ) : <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: "20px 0" }}>「{volMuscle}」を2回以上記録すると推移が表示されます。</div>}
                  </>
                )}
              </div>

              {/* 種目別 重量推移 */}
              <div style={{ background: C.surface, borderRadius: 14, padding: 14, border: `1px solid ${C.border}`, marginBottom: 16 }}>
                <h2 style={{ fontSize: 14, fontWeight: 900, margin: "0 0 10px" }}>種目別の重量推移</h2>
                {chartMuscles.length === 0 ? (
                  <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: "20px 0" }}>記録するとここに表示されます。</div>
                ) : (<>
                  {/* 部位 → 種目 の2段選択(種目が増えてもチップが並びすぎないように) */}
                  <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
                    {chartMuscles.map(m => <button key={m} onClick={() => setChartMuscle(m)} style={{ ...chip(chartMuscle === m), flexShrink: 0 }}>{muscleName(m)}</button>)}
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
                    {chartExerciseChoices.map(name => <button key={name} onClick={() => setChartExercise(name)} style={chip(chartExercise === name, C.red)}>{exName(name)}</button>)}
                  </div>
                </>)}
                {chartData.length >= 2 ? (
                  <ResponsiveContainer width="100%" height={200}>
                    <LineChart data={chartData} margin={{ top: 8, right: 8, left: -14, bottom: 0 }}>
                      <CartesianGrid stroke={C.border} strokeDasharray="3 3" />
                      <XAxis dataKey="date" stroke={C.muted} fontSize={11} tickLine={false} />
                      <YAxis stroke={C.muted} fontSize={11} tickLine={false} domain={["dataMin - 2", "dataMax + 2"]} />
                      <Tooltip contentStyle={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 13, color: C.text }} formatter={(v, n) => [n === "最大重量" ? `${v}${uLabel()}` : `${v.toLocaleString()}${uLabel()}`, n]} />
                      <Legend wrapperStyle={{ fontSize: 12, color: C.muted }} />
                      <Line type="monotone" dataKey="最大重量" stroke={C.red} strokeWidth={2.5} dot={{ r: 4, fill: C.red }} />
                      <Line type="monotone" dataKey="推定1RM" stroke={C.yellow} strokeWidth={2} strokeDasharray="4 3" dot={{ r: 3, fill: C.yellow }} />
                    </LineChart>
                  </ResponsiveContainer>
                ) : <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: "24px 0" }}>この種目を2回以上記録するとグラフが表示されます。</div>}
              </div>
            </>
          )}

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "8px 0 12px" }}>
            <h2 style={{ fontSize: 16, fontWeight: 900, margin: 0 }}>履歴 <span style={{ color: C.muted, fontWeight: 400, fontSize: 13 }}>{workouts.length}回</span></h2>
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={() => { setHistMode("list"); setSelectedDate(null); }} style={chip(histMode === "list")}>リスト</button>
              <button onClick={() => setHistMode("calendar")} style={chip(histMode === "calendar")}>カレンダー</button>
            </div>
          </div>

          {/* カレンダー */}
          {histMode === "calendar" && (() => {
            const trainedDates = new Set(workouts.map(w => { const d = new Date(w.date); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }));
            const first = new Date(calMonth.y, calMonth.m, 1);
            const startDow = first.getDay();
            const daysInMonth = new Date(calMonth.y, calMonth.m + 1, 0).getDate();
            const cells = [];
            for (let i = 0; i < startDow; i++) cells.push(null);
            for (let d = 1; d <= daysInMonth; d++) cells.push(d);
            const prevMonth = () => setCalMonth(c => c.m === 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m: c.m - 1 });
            const nextMonth = () => setCalMonth(c => c.m === 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m: c.m + 1 });
            const today = new Date();
            return (
              <div style={{ background: C.surface, borderRadius: 14, padding: 14, border: `1px solid ${C.border}`, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                  <button onClick={prevMonth} style={{ ...btn(C.surface2, C.text), padding: "6px 12px", fontSize: 14 }}>‹</button>
                  <div style={{ fontWeight: 900, fontSize: 15 }}>{calMonth.y}年{calMonth.m + 1}月</div>
                  <button onClick={nextMonth} style={{ ...btn(C.surface2, C.text), padding: "6px 12px", fontSize: 14 }}>›</button>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
                  {["日", "月", "火", "水", "木", "金", "土"].map((d, i) => (
                    <div key={d} style={{ textAlign: "center", fontSize: 11, color: i === 0 ? C.red : i === 6 ? C.blue : C.muted, paddingBottom: 4 }}>{d}</div>
                  ))}
                  {cells.map((d, i) => {
                    if (d === null) return <div key={`e${i}`} />;
                    const key = `${calMonth.y}-${calMonth.m}-${d}`;
                    const trained = trainedDates.has(key);
                    const isToday = today.getFullYear() === calMonth.y && today.getMonth() === calMonth.m && today.getDate() === d;
                    const isSel = selectedDate === key;
                    return (
                      <button key={key} onClick={() => setSelectedDate(isSel ? null : key)}
                        style={{
                          aspectRatio: "1", borderRadius: 8, border: isToday ? `1px solid ${C.muted}` : "1px solid transparent",
                          background: isSel ? C.blue : trained ? "rgba(226,69,60,0.18)" : "transparent",
                          color: isSel ? "#fff" : C.text, fontSize: 13, fontFamily: "inherit", cursor: "pointer",
                          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2,
                        }}>
                        {d}
                        {trained && <span style={{ width: 5, height: 5, borderRadius: "50%", background: isSel ? "#fff" : C.red }} />}
                      </button>
                    );
                  })}
                </div>
                <div style={{ fontSize: 12, color: C.muted, marginTop: 10, textAlign: "center" }}>
                  {selectedDate ? "日付をもう一度タップで解除" : "赤い点=トレーニング日。タップでその日の記録を表示"}
                </div>
              </div>
            );
          })()}

          {!loaded && <div style={{ color: C.muted, fontSize: 14 }}>読み込み中…</div>}
          {loaded && workouts.length === 0 && <div style={{ border: `1px dashed ${C.border}`, borderRadius: 14, padding: 20, color: C.muted, fontSize: 14, textAlign: "center" }}>まだ記録がありません。</div>}
          {[...workouts].map((w, revIdx) => ({ w, idx: revIdx })).reverse()
            .filter(({ w }) => {
              if (!(histMode === "calendar" && selectedDate)) return true;
              const d = new Date(w.date);
              return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` === selectedDate;
            })
            .map(({ w, idx }) => {
            const editing = editWorkout && editWorkout.index === idx;
            const d = editing ? editWorkout.draft : w;
            return (
            <div key={idx} style={{ background: C.surface, borderRadius: 14, padding: 14, marginBottom: 10, border: `1px solid ${editing ? C.blue : C.border}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, gap: 8 }}>
                <div style={{ fontWeight: 900, fontSize: 14, minWidth: 0 }}>{fmtDate(w.date)}{w.session && <span style={{ color: C.blue, marginLeft: 8, fontSize: 13 }}>{w.session}</span>}</div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  {editing ? (
                    <>
                      <button onClick={saveEditWorkout} style={{ ...btn(C.red), padding: "5px 12px", fontSize: 13 }}>保存</button>
                      <button onClick={cancelEditWorkout} style={{ ...btn(C.surface2, C.muted), padding: "5px 10px", fontSize: 13 }}>取消</button>
                    </>
                  ) : (
                    <>
                      <button onClick={() => copyWorkout(w, idx)}
                        style={{ ...btn(copiedIdx === idx ? C.green : C.surface2, copiedIdx === idx ? "#fff" : C.muted), padding: "5px 10px", fontSize: 13 }}>
                        {copiedIdx === idx ? "✓ コピー済" : "コピー"}
                      </button>
                      <button onClick={() => startEditWorkout(idx)} style={{ ...btn(C.surface2, C.muted), padding: "5px 10px", fontSize: 13 }}>編集</button>
                      <button onClick={() => deleteWorkout(idx)} aria-label="この記録を削除" style={{ ...btn("transparent", C.muted), padding: "5px 6px", fontSize: 13 }}>🗑</button>
                    </>
                  )}
                </div>
              </div>

              {!editing && (() => {
                const parts = [...new Set(w.exercises.map(ex => ex.muscle).filter(Boolean))];
                return parts.length > 0 ? (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
                    {parts.map(m => (
                      <span key={m} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 999, padding: "3px 10px", fontSize: 12, color: C.text }}>{muscleName(m)}</span>
                    ))}
                  </div>
                ) : null;
              })()}

              {!editing && (w.startAt || w.durationMin) && (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 10, fontSize: 12, color: C.muted, marginBottom: 8 }}>
                  {w.startAt && <span>{fmtTime(w.startAt)}〜{w.endAt ? fmtTime(w.endAt) : ""}</span>}
                  {w.durationMin != null && <span>{w.durationMin}分</span>}
                  <span style={{ color: C.yellow }}>{Math.round(toU(w.exercises.reduce((a, ex) => a + exVolume(ex), 0))).toLocaleString()}{uLabel()}</span>
                  {w.kcal != null && <span>約{w.kcal}kcal</span>}
                </div>
              )}

              {/* 表示モード */}
              {!editing && w.exercises.map((ex, j) => {
                const prevE = w.exercises[j - 1];
                const ssStart = ex.ssGroup && (!prevE || prevE.ssGroup !== ex.ssGroup);
                // この記録より前の自己ベスト1RMを求め、更新したセットを特定する
                const priorBest = workouts.slice(0, idx).reduce((best, pw) => {
                  const pe = pw.exercises.find(e => e.name === ex.name);
                  if (!pe) return best;
                  return pe.sets.reduce((b, s) => {
                    if (s.warmup || s.assisted || !s.reps) return b;
                    return Math.max(b, est1RM(setEff(pe, s), s.reps));
                  }, best);
                }, 0);
                let prIdx = -1, prVal = 0;
                ex.sets.forEach((s, si) => {
                  if (s.warmup || s.assisted || !s.reps) return;
                  const v = est1RM(setEff(ex, s), s.reps);
                  if (v > prVal) { prVal = v; prIdx = si; }
                });
                const hasPR = prIdx >= 0 && prVal > priorBest + 0.01;
                return (
                <div key={j} style={{ fontSize: 13, marginBottom: 8, paddingBottom: 6, borderBottom: j < w.exercises.length - 1 ? `1px solid ${C.border}` : "none" }}>
                  <div style={{ marginBottom: 2, lineHeight: 1.4 }}>
                    {ssStart && <span style={{ background: C.blue, color: "#fff", fontSize: 10, fontWeight: 800, borderRadius: 4, padding: "1px 6px", marginRight: 6 }}>SS</span>}
                    {ex.ssGroup && !ssStart && <span style={{ color: C.blue, marginRight: 6 }}>┗</span>}
                    {exName(ex.name)}

                        {si > 0 && <span style={{ color: C.muted, fontWeight: 400 }}> / </span>}
                        {hasPR && si === prIdx ? "⚡" : ""}{s.warmup ? "W:" : ""}{s.assisted ? "補:" : ""}{s.weight}×{s.reps}{s.rir != null ? `(RIR${s.rir})` : ""}
                      </span>
                    ))}
                  </div>
                </div>
                );
              })}

              {/* 編集モード */}
              {editing && (
                <div style={{ marginTop: 8 }}>
                  <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>

                  </div>
                  {d.exercises.map((ex, exIdx) => (
                    <div key={exIdx} style={{ background: C.bg, borderRadius: 10, padding: 10, marginBottom: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 8 }}>
                        <strong style={{ fontSize: 13, minWidth: 0 }}>{exName(ex.name)}</strong>
                        <div style={{ display: "flex", gap: 4, alignItems: "center", flexShrink: 0 }}>
                          <button onClick={() => editMoveExercise(exIdx, -1)} disabled={exIdx === 0} aria-label="上へ移動"
                            style={{ ...btn(C.surface2, exIdx === 0 ? C.border : C.muted), padding: "3px 8px", fontSize: 12, cursor: exIdx === 0 ? "default" : "pointer" }}>▲</button>
                          <button onClick={() => editMoveExercise(exIdx, 1)} disabled={exIdx === d.exercises.length - 1} aria-label="下へ移動"
                            style={{ ...btn(C.surface2, exIdx === d.exercises.length - 1 ? C.border : C.muted), padding: "3px 8px", fontSize: 12, cursor: exIdx === d.exercises.length - 1 ? "default" : "pointer" }}>▼</button>
                          <button onClick={() => editRemoveExercise(exIdx)} style={{ ...btn("transparent", C.muted), padding: 2, fontSize: 12 }}>削除</button>
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 4 }}>

                        <span style={{ flex: 1, ...fieldLabel }}>回数</span>
                        <span style={{ flex: 1, ...fieldLabel }}>余力</span>

                            style={{ width: 22, height: 22, borderRadius: 6, flexShrink: 0, cursor: "pointer", fontSize: 11, fontWeight: 800, fontFamily: "inherit",

                            {s.warmup ? "W" : setIdx + 1}
                          </button>
                          <NumInput inputMode="decimal" value={s.weight}
                            onChange={e => editSet(exIdx, setIdx, "weight", e.target.value)} aria-label="重量"
                            style={{ ...numInput, flex: 1.3, fontSize: 18, padding: "7px 2px" }} />
                          <NumInput inputMode="numeric" value={s.reps}
                            onChange={e => editSet(exIdx, setIdx, "reps", e.target.value)} aria-label="回数"
                            style={{ ...numInput, flex: 1, fontSize: 18, padding: "7px 2px" }} />
                          <NumInput inputMode="numeric" value={s.rir} placeholder="–"
                            onChange={e => editSet(exIdx, setIdx, "rir", e.target.value)} aria-label="余力"
                            style={{ ...numInput, flex: 1, fontSize: 18, padding: "7px 2px", color: C.yellow }} />
                          <button onClick={() => editRemoveSet(exIdx, setIdx)} aria-label="セットを削除"
                            style={{ width: 24, height: 24, borderRadius: 6, border: `1px solid ${C.border}`, background: C.surface2, color: C.muted, fontSize: 12, cursor: "pointer", flexShrink: 0 }}>✕</button>
                        </div>
                      ))}
                      <button onClick={() => editAddSet(exIdx)}
                        style={{ ...btn(C.surface2, C.text), width: "100%", padding: 8, fontSize: 13, marginTop: 4 }}>

                      </button>
                    </div>
                  ))}

                  {/* 記録し忘れた種目を追加 */}
                  <div style={{ background: C.bg, borderRadius: 10, padding: 10, marginBottom: 10 }}>
                    <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>記録し忘れた種目を追加できます。</div>
                    <input value={editAddSearch} onChange={e => setEditAddSearch(e.target.value)}

                      style={{ width: "100%", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "8px 10px", fontSize: 16, fontFamily: "inherit", marginBottom: 8 }} />
                    {editAddSearch.trim() && (
                      <div style={{ maxHeight: 170, overflowY: "auto" }}>
                        {allExercises
                          .filter(e => {
                            const q = editAddSearch.trim();
                            return exMatches(e, q);
                          })
                          .slice(0, 30)
                          .map(e => (
                            <button key={e.n} onClick={() => editAddExercise(e.n)}
                              style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, width: "100%", textAlign: "left", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 10px", marginBottom: 5, cursor: "pointer", color: C.text, fontSize: 13, fontFamily: "inherit" }}>
                              <span style={{ minWidth: 0 }}>{exName(e.n)}</span>
                              <span style={{ color: C.muted, fontSize: 12, flexShrink: 0 }}>{muscleName(e.m)}・{eqName(e.eq)}</span>
                            </button>
                          ))}
                        {!findExercise(editAddSearch.trim()) && (
                          <button onClick={() => editAddExercise(editAddSearch)}
                            style={{ ...btn(C.red), width: "100%", padding: 9, fontSize: 13 }}>
                            「{editAddSearch.trim()}」を追加
                          </button>
                        )}
                      </div>
                    )}
                  </div>

                  <button onClick={() => deleteWorkout(idx)} style={{ ...btn("transparent", "#FF5A4E"), width: "100%", fontSize: 13, padding: 8, border: `1px solid ${C.border}`, borderRadius: 8 }}>

              )}
            </div>

                const days = pr.date ? Math.floor((Date.now() - new Date(pr.date).getTime()) / 86400000) : null;
                return (
                <div key={name} style={{ marginBottom: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", fontSize: 13 }}>

                    <span style={{ width: 76, textAlign: "right", fontFamily: "'Barlow Condensed', sans-serif", fontSize: 17, fontWeight: 600, color: C.yellow }}>
                      {toU(pr.bestWeight).toFixed(1)}<span style={{ fontSize: 11, color: C.muted }}>{uLabel()}</span>
                    </span>
                    <span style={{ width: 68, textAlign: "right", fontFamily: "'Barlow Condensed', sans-serif", fontSize: 15, color: C.muted }}>
                      {toU(pr.best1RM).toFixed(1)}<span style={{ fontSize: 11 }}>{uLabel()}</span>

                  </div>

                    <div style={{ fontSize: 11, color: days >= 60 ? C.yellow : C.muted, marginTop: 1 }}>

                    </div>
                  )}
                </div>
                );
              })}
            </div>
          )}

          {workouts.length > 0 && <button onClick={clearAll} style={{ ...btn("transparent", C.muted), fontSize: 13, padding: 8 }}>すべての履歴を削除</button>}
        </div>
      )}

            style={{ ...btn(C.surface2, C.text), width: "100%", padding: 14, fontSize: 14, marginBottom: 12, border: `1px solid ${C.border}` }}>

              <span><NumInput inputMode="decimal" value={wU(profile.bodyweight)} onChange={e => persist({ profile: { ...profile, bodyweight: fromU(e.target.value) } })} style={{ ...cfgInput, width: 70, fontSize: 16 }} /> {uLabel()}</span>
            </label>
          </div>

            <p style={{ color: C.muted, fontSize: 13, margin: "0 0 12px", lineHeight: 1.6 }}>

            </p>
            <input value={exSettingSearch} onChange={e => setExSettingSearch(e.target.value)}

            <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 10 }}>
              <button onClick={() => setExSettingMuscle("")} style={{ ...chip(!exSettingMuscle), flexShrink: 0 }}>使用中</button>
              {MUSCLES.filter(m => allExercises.some(e => e.m === m)).map(m => (
                <button key={m} onClick={() => setExSettingMuscle(exSettingMuscle === m ? "" : m)} style={{ ...chip(exSettingMuscle === m), flexShrink: 0 }}>{muscleName(m)}</button>
              ))}
            </div>

            {(() => {
              const q = exSettingSearch.trim();
              let list;
              if (q) {
                list = allExercises.filter(e => exMatches(e, q));
                if (exSettingMuscle) list = list.filter(e => e.m === exSettingMuscle);
                list = list.slice(0, 30);
              } else if (exSettingMuscle) {
                // 部位を選んだら、その部位の全種目(内蔵+カスタム)から選べる
                list = allExercises.filter(e => e.m === exSettingMuscle).slice(0, 60);
              } else {
                // 使用中の種目(履歴・最近使った・カスタム)だけを既定で表示
                const used = new Set([
                  ...customExercises.map(e => e.n),
                  ...recentNames,
                  ...workouts.flatMap(w => w.exercises.map(e => e.name)),
                  ...Object.keys(exerciseOverrides),
                ]);
                list = allExercises.filter(e => used.has(e.n)).slice(0, 40);
              }
              if (list.length === 0) {
                return <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: "12px 0" }}>
                  {q || exSettingMuscle ? "該当する種目がありません。" : "記録するとここに表示されます。部位を選ぶか検索すれば全種目から探せます。"}
                </div>;
              }
              return list.map(e => {
                const custom = customExercises.some(c => c.n === e.n);
                const edited = !!exerciseOverrides[e.n];
                return (
                  <div key={e.n} style={{ background: C.bg, borderRadius: 10, padding: 10, marginBottom: 8 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, marginBottom: 8 }}>
                      <strong style={{ fontSize: 13, minWidth: 0 }}>

                      </strong>
                      {custom ? (
                        <button onClick={() => deleteCustomExercise(e.n)} style={{ ...btn("transparent", C.muted), padding: "2px 6px", fontSize: 12, flexShrink: 0 }}>削除</button>

                        <button onClick={() => resetExerciseOverride(e.n)} style={{ ...btn("transparent", C.muted), padding: "2px 6px", fontSize: 12, flexShrink: 0 }}>元に戻す</button>

                          style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "5px 6px", fontSize: 16, fontFamily: "inherit" }}>
                          <option value="">未設定</option>
                          {MUSCLES.map(m => <option key={m} value={m}>{muscleName(m)}</option>)}
                        </select>
                      </label>
                      <label style={{ fontSize: 13, color: C.muted }}>
                        器具{" "}
                        <select value={e.eq || ""} onChange={ev => {
                          const eq = ev.target.value;
                          updateCustomExercise(e.n, { eq, db: eq === "ダンベル", bw: eq === "自重" ? (e.bw || 0.7) : 0 });
                        }}
                          style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 8, color: C.text, padding: "5px 6px", fontSize: 16, fontFamily: "inherit" }}>
                          <option value="">その他</option>
                          {EQUIPMENT.map(qq => <option key={qq} value={qq}>{eqName(qq)}</option>)}
                        </select>
                      </label>
                      <label style={{ fontSize: 13, color: C.muted, display: "flex", alignItems: "center", gap: 4 }}>
                        <input type="checkbox" checked={!!e.db} onChange={ev => updateCustomExercise(e.n, { db: ev.target.checked })} />
                        片手(ダンベル)
                      </label>
                      {e.bw > 0 && (
                        <label style={{ fontSize: 13, color: C.muted }}>
                          体重係数{" "}
                          <NumInput inputMode="decimal" value={e.bw} style={cfgInput}
                            onChange={ev => updateCustomExercise(e.n, { bw: ev.target.value })}
                            onBlur={ev => { const v = num(ev.target.value); updateCustomExercise(e.n, { bw: v > 0 ? v : 0.7 }); }} />
                        </label>
                      )}
                      <label style={{ fontSize: 13, color: C.muted }}>
                        可動域{" "}
                        <NumInput inputMode="decimal" value={e.rom ?? 1} style={cfgInput}
                          onChange={ev => updateCustomExercise(e.n, { rom: ev.target.value })}
                          onBlur={ev => { const v = num(ev.target.value); updateCustomExercise(e.n, { rom: v > 0 ? Math.min(1, Math.max(0.1, v)) : 1 }); }} />
                      </label>
                    </div>
                  </div>
                );
              });
            })()}
            <p style={{ color: C.muted, fontSize: 12, margin: "6px 0 0", lineHeight: 1.6 }}>
              ※ 設定は今後の記録に反映されます。過去の記録は当時の設定のまま残ります。
            </p>
          </div>

          <div style={{ background: C.surface, borderRadius: 14, padding: 16, border: `1px solid ${C.border}`, marginBottom: 12 }}>
            <div style={{ fontSize: 14, fontWeight: 900, marginBottom: 10 }}>{t("settings.language")}</div>
            <div role="radiogroup" aria-label={t("settings.language")} style={{ display: "flex", gap: 8 }}>
              {SUPPORTED_LANGS.map(code => (
                <button key={code} role="radio" aria-checked={lang === code}
                  onClick={() => persist({ profile: { ...profile, lang: code } })}
                  style={{ ...btn(lang === code ? C.blue : C.surface2, lang === code ? "#fff" : C.text), flex: 1, fontSize: 14, padding: "10px 12px" }}>
                  {t("lang." + code)}
                </button>
              ))}
            </div>
            <p style={{ color: C.muted, fontSize: 13, margin: "10px 0 0", lineHeight: 1.6 }}>
              {t("settings.languageDesc")}
            </p>

            <div style={{ fontSize: 14, fontWeight: 900, margin: "16px 0 10px" }}>{t("settings.unit")}</div>
            <div role="radiogroup" aria-label={t("settings.unit")} style={{ display: "flex", gap: 8 }}>
              {SUPPORTED_UNITS.map(code => (
                <button key={code} role="radio" aria-checked={unit === code}
                  onClick={() => persist({ profile: { ...profile, unit: code } })}
                  style={{ ...btn(unit === code ? C.blue : C.surface2, unit === code ? "#fff" : C.text), flex: 1, fontSize: 14, padding: "10px 12px" }}>
                  {t("unit." + code)}
                </button>
              ))}
            </div>
            <p style={{ color: C.muted, fontSize: 13, margin: "10px 0 0", lineHeight: 1.6 }}>
              {t("settings.unitDesc")}
            </p>
          </div>

          <div style={{ background: C.surface, borderRadius: 14, padding: 16, border: `1px solid ${C.border}`, marginBottom: 12 }}>
            <label style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 14 }}>
              インターバルの通知音
              <button onClick={() => { const next = !soundOn; persist({ profile: { ...profile, soundOn: next } }); if (next) setTimeout(() => beep(1), 60); }}
                role="switch" aria-checked={soundOn} aria-label="インターバルの通知音"
                style={{ width: 52, height: 30, borderRadius: 999, border: "none", cursor: "pointer", background: soundOn ? C.green : C.grey, position: "relative" }}>
                <span style={{ position: "absolute", top: 3, left: soundOn ? 25 : 3, width: 24, height: 24, borderRadius: "50%", background: "#fff", transition: "left .15s" }} />
              </button>
            </label>
            <p style={{ color: C.muted, fontSize: 13, margin: "10px 0 0", lineHeight: 1.6 }}>
              インターバル中、1分・2分・3分…の経過時に音が鳴ります(経過が長いほど回数が増えます)。アプリを開いた後、最初のタップで音が有効になります。
              iPhoneでは本体のサイレントスイッチがオンだと鳴りません。
            </p>
          </div>

          {/* バックアップ */}
          <div style={{ background: C.surface, borderRadius: 14, padding: 16, border: `1px solid ${C.border}`, marginBottom: 12 }}>
            <div style={{ fontSize: 14, fontWeight: 900, marginBottom: 4 }}>バックアップ</div>
            <p style={{ color: C.muted, fontSize: 13, margin: "0 0 12px", lineHeight: 1.6 }}>
              記録・分割・カスタム種目・体重をまとめてファイルに保存できます。機種変更や、データが消えたときの復元に使えます。
            </p>
            {backupMsg && (
              <div role="status" style={{ background: "#1E3226", color: "#A8E6BC", borderRadius: 8, padding: 10, fontSize: 13, marginBottom: 10 }}>{backupMsg}</div>
            )}
            <button onClick={exportBackup} disabled={workouts.length === 0}
              style={{ ...btn(workouts.length === 0 ? C.surface2 : C.blue, workouts.length === 0 ? C.muted : "#fff"), width: "100%", padding: 14, fontSize: 14, marginBottom: 8 }}>
              ⬇ バックアップを書き出す(JSON)
            </button>

            <label style={{ ...btn(C.surface2, C.text), width: "100%", padding: 14, fontSize: 14, display: "block", textAlign: "center", marginBottom: 8, border: `1px solid ${C.border}` }}>

              <input type="file" accept="application/json,.json" style={{ display: "none" }}
                onChange={e => { const f = e.target.files?.[0]; importBackup(f); e.target.value = ""; }} />
            </label>

            <button onClick={exportCSV} disabled={workouts.length === 0}
              style={{ ...btn("transparent", workouts.length === 0 ? C.border : C.muted), width: "100%", padding: 10, fontSize: 13, border: `1px solid ${C.border}` }}>
              CSVで書き出す(Excel等で開く用)
            </button>

            {hasPreImportSnapshot && (
              <div style={{ marginTop: 10, padding: 10, borderRadius: 10, background: "#3A2224", border: `1px solid ${C.red}` }}>

                  バックアップ復元より前のデータが端末に残っています。間違えて復元してしまった場合は、ここから戻せます。
                </p>
                <button onClick={restoreFromPreImportSnapshot} style={{ ...btn(C.red), width: "100%", padding: 10, fontSize: 13 }}>
                  ↩ 復元前の状態に戻す
                </button>
              </div>
            )}

            <p style={{ color: C.muted, fontSize: 12, margin: "10px 0 0", lineHeight: 1.6 }}>
              ※復元すると現在のデータはすべて置き換わります。復元前に念のため書き出しておくと安全です。
            </p>
          </div>

          <p style={{ color: C.muted, fontSize: 12, lineHeight: 1.6 }}>
            ※カロリーはMETs×体重×時間による概算の目安で、医療・栄養管理用の正確な値ではありません。自重種目のボリュームは体重×係数+加重で換算しています。
            シュラッグ・カーフレイズ・リストカールは可動域が小さいため、集計ボリュームを0.5倍で換算しています(推定1RM・PR・次回メニューの判定には影響しません)。種目ごとに⚙から調整できます。
          </p>
        </div>
      )}

      {/* ===== 同一分割の履歴モーダル(上部バーのボリュームタップ) ===== */}
      {showSplitHistory && todayDay && (
        <div onClick={closeSplitHistory} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", zIndex: 50, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
          <div ref={splitHistoryModalRef} onClick={e => e.stopPropagation()} role="dialog" aria-modal="true" aria-label={`${dayName(todayDay.name)}の履歴`} tabIndex={-1}
            style={{ background: C.surface, borderTop: `3px solid ${C.blue}`, borderRadius: "16px 16px 0 0", padding: 20, width: "100%", maxWidth: 520, maxHeight: "70vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <strong style={{ fontSize: 15 }}>{dayName(todayDay.name)}の履歴</strong>
              <button onClick={closeSplitHistory} style={{ ...btn(C.surface2, C.muted), padding: "4px 12px", fontSize: 13 }}>閉じる</button>
            </div>
            {sameSplitSessions.map((s, i) => (
              <div key={i} style={{ borderTop: i > 0 ? `1px solid ${C.border}` : "none", padding: "10px 0" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                  <span style={{ fontWeight: 700, fontSize: 13 }}>{fmtDate(s.date)}</span>
                  <span style={{ fontSize: 13, color: C.muted }}>{Math.round(toU(s.volume)).toLocaleString()}{uLabel()}</span>
                </div>
                {s.exercises.map((ex, j) => (
                  <div key={j} style={{ marginBottom: 6 }}>
                    <div style={{ fontSize: 13, color: C.text }}>{exName(ex.name)}</div>
                    <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.6, wordBreak: "break-word" }}>
                      {ex.sets.map((st, si) => (
                        <span key={si}>
                          {si > 0 && " / "}
                          {st.warmup ? "W:" : ""}{st.assisted ? "補:" : ""}
                          {st.weight}{resolveIsDb(ex.name, ex.isDb) ? "(片手)" : ""}×{st.reps}{st.rir !== "" && st.rir != null ? `(RIR${st.rir})` : ""}
                        </span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* タブバー */}
      <nav style={{ position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 520, margin: "0 auto", display: "flex", background: C.surface, borderTop: `1px solid ${C.border}`, paddingBottom: "env(safe-area-inset-bottom)" }}>
        {[["split", "分割"], ["log", "記録"], ["history", "履歴"], ["settings", "設定"]].map(([k, label]) => (
          <button key={k} onClick={() => setView(k)} style={{ flex: 1, padding: "14px 0 18px", background: "none", border: "none", color: view === k ? C.red : C.muted, fontWeight: view === k ? 900 : 400, fontSize: 13, cursor: "pointer", fontFamily: "inherit", borderTop: view === k ? `2px solid ${C.red}` : "2px solid transparent" }}>{label}</button>
        ))}
      </nav>
    </div>
  );
}


// ---- マウント ----
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);

</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>

</body>
</html>
