<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
:root { --bg: #141517; --text: #F2F0EB; --muted: #A3A8B0; --yellow: #E8B33C; --green: #4CAF6E; }
html, body { margin: 0; width: 1200px; height: 1200px; background: var(--bg); overflow: hidden;
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; color: var(--text); }
.head { position: absolute; left: 90px; top: 110px; font-size: 92px; font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; }
.head em { font-style: normal; color: var(--yellow); }
.sub { position: absolute; left: 94px; top: 360px; font-size: 32px; font-weight: 600; line-height: 1.6; color: var(--muted); }
.watch { position: absolute; left: 50%; transform: translateX(-50%); top: 500px; width: 460px; height: 508px;
  padding: 26px; border-radius: 110px; background: #0B0B0C; border: 12px solid #2A2C30; box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: hidden; }
.watch .scr { width: 100%; height: 100%; border-radius: 80px; overflow: hidden; background: #000; }
.watch img { width: 100%; height: auto; display: block; }
.crown { position: absolute; left: calc(50% + 262px); top: 690px; width: 22px; height: 100px; border-radius: 9px; background: #2A2C30; }
</style></head><body>
<div class="head">インターバルも、<br><em>手首で見える。</em></div>
<div class="sub">余力(RIR)を入れると、そのままタイマーに。<br>次のセットの重量×回数と、前回の実績も。</div>
<div class="watch"><div class="scr"><img src="watch-rest-ja.png" alt=""></div></div>
<div class="crown"></div>
</body></html>
