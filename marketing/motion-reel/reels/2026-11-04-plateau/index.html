<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KURABELL 15s reel</title>
<!-- 1080x1920 / 15秒。window.seek(t) が t 秒目を描くだけ。タイマー・CSSトランジションなし -->
<style>
@font-face { font-family: "Barlow C"; font-weight: 800; src: url("../../../../fonts/barlow-condensed-800-latin.woff2") format("woff2"); }
:root { --bg:#141517; --text:#F2F0EB; --muted:#A3A8B0; --line:#2E3237; --yellow:#E8B33C; --green:#4CAF6E; --red:#E2453C; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; background:var(--bg); overflow:hidden; }
body { color:var(--text); font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP",sans-serif; }
.el { position:absolute; will-change:transform,opacity; }
.num { font-family:"Barlow C"; font-weight:800; }
h1 { font-weight:900; font-size:116px; line-height:1.22; letter-spacing:-.01em; }
h1 em { font-style:normal; color:var(--yellow); }
.lead { font-size:44px; font-weight:700; color:var(--muted); line-height:1.5; }
#bar { position:absolute; left:0; top:0; }
.dot { width:34px; height:34px; border-radius:50%; background:var(--text); }
.chip { font-size:64px; color:var(--text); }
.card { border-radius:28px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.55); }
.card img { display:block; width:100%; }
#logo { display:flex; align-items:center; gap:14px; }
#logo img { width:58px; height:58px; border-radius:14px; }
#logo .t1 { font-family:"Barlow C"; font-weight:800; font-size:38px; letter-spacing:.04em; line-height:1; }
#logo .t2 { font-size:22px; font-weight:700; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>
<div id="bar"></div>

<!-- S1 HOOK 0-2.6 -->
<h1 class="el" id="s1h" style="left:84px; top:560px;">いつもの重さで、<br><em>十分？</em></h1>

<!-- S2 PROBLEM 2.6-6.0 -->
<p class="el lead" id="s2l" style="left:84px; top:400px;">ベンチプレスの記録</p>
<h1 class="el" id="s2h" style="left:84px; top:470px; font-size:104px;">ずっと<span class="num" style="font-size:140px;"> 70</span>kg。</h1>
<div class="el dot" id="d0"></div><div class="el dot" id="d1"></div><div class="el dot" id="d2"></div><div class="el dot" id="d3"></div>
<div class="el chip num" id="c0">67.5×10</div><div class="el chip num" id="c1">70×8</div><div class="el chip num" id="c2">70×9</div><div class="el chip num" id="c3">70×10</div>
<p class="el lead" id="s2c" style="left:84px; top:1330px; color:var(--text);">3回連続、同じ重さ。</p>

<!-- S3 REVEAL 6.0-9.4 -->
<p class="el lead" id="s3l" style="left:84px; top:400px; color:var(--text);">頭打ちに、アプリが気づく</p>
<h1 class="el" id="s3h" style="left:84px; top:480px; font-size:120px;"><em>そろそろ、<br>上げどき。</em></h1>
<div class="el card" id="s3card" style="left:84px; top:900px; width:912px;"><img src="../../../instagram/assets/plateau.png" alt=""></div>
<p class="el lead" id="s3c" style="left:84px; top:1190px;">前回の記録と、自動でくらべる</p>

<!-- S4 PROOF 9.4-12.4 -->
<h1 class="el" id="s4h" style="left:84px; top:430px; font-size:104px;">今日は、<span class="num" style="font-size:140px; color:var(--yellow);">72.5</span>kg。</h1>
<div class="el card" id="s4card" style="left:84px; top:700px; width:912px;"><img src="../../../instagram/assets/row1.png" alt=""></div>
<div class="el num" id="s4big" style="left:84px; top:950px; font-size:260px; color:var(--green); line-height:1;">+2.5kg</div>

<!-- S5 CLOSE 12.4-15 -->
<img class="el" id="s5icon" src="../../../../icon-512.png" style="left:84px; top:560px; width:200px; height:200px; border-radius:46px;">
<div class="el num" id="s5name" style="left:84px; top:800px; font-size:170px; letter-spacing:.03em; line-height:1;">KURABELL</div>
<h1 class="el" id="s5h" style="left:84px; top:1040px; font-size:96px;">比べるから、<br><em>伸びる。</em></h1>
<p class="el lead" id="s5c" style="left:84px; top:1330px;">プロフィールのリンクから</p>

<!-- 右下ロゴ(仮。本番は既存ロゴ素材に差し替え) -->
<div class="el" id="logo" style="right:150px; top:1400px;">
  <img src="../../../../icon-512.png" alt=""><div><div class="t1">KURABELL</div><div class="t2">ワークアウトログ</div></div>
</div>

<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
// 閉形式のバネ(少し行き過ぎて止まる)。u = 経過秒
const spring=(u,w=13,z=0.55)=>{ if(u<=0) return 0; const wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*u)*(Math.cos(wd*u)+(z*w/wd)*Math.sin(wd*u)); };
const soft=(u,w=10)=>spring(u,w,0.85);           // 行き過ぎ控えめ(パネル用)
const $=id=>document.getElementById(id);
const S=[[0,2.6],[2.6,6.0],[6.0,9.4],[9.4,12.4],[12.4,15.2]];
// 場面の出入り: 入り=下から、出=上へ消える
function show(id,t,tin,tout,{dy=60,w=11,outDur=0.28}={}){
  const e=$(id); const k=soft(t-tin,w); let op=clamp((t-tin)/0.18); let y=(1-k)*dy;
  if(tout!=null && t>tout){ const o=clamp((t-tout)/outDur); op*=1-o; y-=o*o*80; }
  e.style.opacity=t<tin?0:op; e.style.transform=`translateY(${y}px)`;
}
// 1本の棒が全編を通して形を変える
const HEX=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const BAR=[ // [時刻, x, y, w, h, r, 色, 不透明]
  [0.35, 84, 880, 0,   16, 8,  '#E8B33C', 1],
  [1.0,  84, 880, 420, 16, 8,  '#E8B33C', 1],
  [2.75, 84, 880, 420, 16, 8,  '#E8B33C', 1],
  [3.5,  351,1131, 420, 12, 6,  '#A3A8B0', 1],   // 頭打ちの平らな線
  [6.6,  351,1131, 420, 12, 6,  '#A3A8B0', 1],
  [7.1,  72, 888, 936, 249, 34, '#E8B33C', .9],  // 通知カードの枠
  [9.5,  72, 888, 936, 249, 34, '#E8B33C', .9],
  [10.2, 84, 1240, 470, 18, 9,  '#4CAF6E', 1],    // +2.5kg の下線
  [12.5, 84, 1240, 470, 18, 9,  '#4CAF6E', 1],
  [13.2, 84, 990, 760, 18, 9,  '#E2453C', 1],     // KURABELL の下線
  [16,   84, 990, 760, 18, 9,  '#E2453C', 1],
];
function bar(t){
  let i=0; while(i<BAR.length-2 && t>=BAR[i+1][0]) i++;
  const a=BAR[i], b=BAR[i+1]; const hold=(a[1]===b[1]&&a[2]===b[2]&&a[3]===b[3]&&a[4]===b[4]);
  const k= t<a[0]?0 : hold?1 : spring(t-a[0],12,0.62)*clamp((t-a[0])/(b[0]-a[0])*3);
  const kk=Math.min(k,1.12);
  const v=j=>lerp(a[j],b[j],kk); const ca=HEX(a[6]),cb=HEX(b[6]); const cc=clamp(k);
  const col=`rgb(${ca.map((x,j)=>Math.round(lerp(x,cb[j],cc))).join(',')})`;
  const e=$('bar'); const isFrame=v(4)>100;
  Object.assign(e.style,{transform:`translate(${v(1)}px,${v(2)}px)`,width:Math.max(0,v(3))+'px',height:v(4)+'px',borderRadius:v(5)+'px',
    background:col,opacity:t<0.35?0:lerp(a[7],b[7],cc)});
}
// 推移のドット(67.5×10 → 70×8 → 70×9 → 70×10)
const DX=[40,250,460,670], DY=[1235,1120,1120,1120], DT=[3.0,3.45,3.9,4.35];
function dots(t){
  for(let i=0;i<4;i++){
    const k=spring(t-DT[i],16,0.5), out=t>6.0?clamp((t-6.0)/0.25):0;
    const d=$('d'+i), c=$('c'+i);
    d.style.opacity=(t<DT[i]?0:1)*(1-out); c.style.opacity=(t<DT[i]?0:clamp((t-DT[i])/0.15))*(1-out);
    d.style.transform=`translate(${DX[i]+84}px,${DY[i]}px) scale(${k})`;
    c.style.transform=`translate(${DX[i]+84-20}px,${DY[i]-100+(1-soft(t-DT[i],12))*30 - out*60}px)`;
    if(i>=1){ d.style.background = t>4.6 ? '#E8B33C' : '#F2F0EB'; }
  }
}
window.seek=function(t){
  bar(t);
  show('s1h',t,0.0,2.55,{dy:40});
  show('s2l',t,2.75,5.95); show('s2h',t,2.85,5.95);
  dots(t); show('s2c',t,4.7,5.95);
  show('s3l',t,6.1,9.3); show('s3h',t,6.25,9.3); show('s3card',t,6.55,9.3,{dy:90,w:9}); show('s3c',t,7.4,9.3);
  show('s4h',t,9.55,12.3); show('s4card',t,9.75,12.3,{dy:90,w:9});
  // +2.5kg はバネで大きく
  { const e=$('s4big'), k=spring(t-10.3,14,0.45), o=t>12.3?clamp((t-12.3)/0.28):0;
    e.style.opacity=(t<10.3?0:1)*(1-o); e.style.transformOrigin='0% 80%'; e.style.transform=`translateY(${-o*o*80}px) scale(${0.6+0.4*k})`; }
  show('s5icon',t,12.55,null,{dy:80}); show('s5name',t,12.7,null); show('s5h',t,13.25,null); show('s5c',t,13.8,null);
  const lo=$('logo'); lo.style.opacity = t<0.4?0 : (t<12.3?clamp((t-0.4)/0.3):1-clamp((t-12.3)/0.3)); lo.style.transform='none';
};
window.seek(0);
</script>
</body>
</html>
